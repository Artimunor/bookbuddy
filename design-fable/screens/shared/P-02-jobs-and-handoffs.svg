<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="P-02-jobs-and-handoffs-title P-02-jobs-and-handoffs-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="P-02-jobs-and-handoffs-title">P-02 Jobs and handoffs — offering a job to a named foreman</title>
  <desc id="P-02-jobs-and-handoffs-desc">Mateo, acting as Reformas Ruiz provider admin on Monday 23 November at 17:50 Spain time, prepares the transfer of BB-1031 Pergola post repair from Inés Vidal to himself as foreman. The reply deadline is Tuesday 24 November at 09:50: ten staffed minutes today and one hour fifty tomorrow. Inés remains accountable unless Mateo accepts in the Foreman role. The booked Thursday visit is unchanged.</desc>
