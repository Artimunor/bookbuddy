  <title id="L-05-session-booking--pending-change-title">L-05 Session booking [Later] — pending change</title>
  <desc id="L-05-session-booking--pending-change-desc">Later category, not in the construction release. Alternative branch. Customer view for Claire Martin at 09:41 UK time on Thursday 26 November. The capsule from Estudi Mar Pilates, BB-S1042, still shows the booked time: Saturday 28 November, in 2 days, 10:00 to 10:45 Spain time, 09:00 to 09:45 her time, with Elena Costa. An amber card says the studio proposes a new time and that her booking stays until she answers. Change 1 compares booked 10:00 to 10:45, 09:00 to 09:45 her time, with proposed 11:30 to 12:15, 10:30 to 11:15 her time, on the same day, with the same place, host, language and price. The dock asks for an answer by Friday 27 November at 10:00 Spain time and has Decline and Accept new time.</desc>
