  <title id="P-02-jobs-and-handoffs--handoff-stuck-title">P-02 Jobs and handoffs — handoff stuck</title>
  <desc id="P-02-jobs-and-handoffs--handoff-stuck-desc">Alternative branch. Provider admin view for Mateo Ruiz at Reformas Ruiz at 18:05 Spain time on Tuesday 24 November. The Needs you segment holds one job: the pergola post repair, BB-1031, booked for Thursday 26 November 10:00 to 11:30. A red block says the handoff is stuck: the offer to Mateo Ruiz expired on Tuesday 24 November at 18:00 Spain time. Inés Vidal is still the accountable foreman and nothing moves until a foreman accepts. A link offers help from the local service. The dock notes that Mateo is the only other foreman and has one action: Offer again to Mateo Ruiz.</desc>
