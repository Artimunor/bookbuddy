<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-13-chat-details-title S-13-chat-details-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-13-chat-details-title">S-13 Chat details — sheet, Job conversation</title>
  <desc id="S-13-chat-details-desc">Bottom sheet over Claire Martin's dimmed job chat at 07:58 UK time on Tuesday 24 November. Title: Chat details, Job conversation, BB-1042, with Close. An audience note says only the people below can read this chat and Mateo is her contact for this job. People: Mateo Ruiz, foreman, writes Español, marked Your contact; Claire Martin, you, customer, reads English. A note says crew members can read and write here only when Mateo adds them, and she will see their names. A row shows Read messages in English and opens Language and display. A link offers Help with this chat. The sheet only informs: it has no primary action, no phone numbers and no way to add or remove people.</desc>
