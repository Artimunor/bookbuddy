3 0 0 0 0 6zm-6 8a6 6 0 0 1 12 0m1-8a3 3 0 1 0 0-6m2 14a6 6 0 0 0-3-5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="209" font-size="12" font-weight="600" fill="#15171C">Crew updated · Diego Torres joins · 08:40</text></g><circle cx="36" cy="262" r="16" fill="#DDEBFF"/><text x="36" y="267" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">MR</text><text x="62" y="248" font-size="12" font-weight="600" fill="#555A66">Mateo Ruiz · Foreman</text><text x="346" y="248" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">08:49</text><g><rect x="62.5" y="256.5" width="283" height="220" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><path d="M63 366h282v86a24 24 0 0 1-24 24H87a24 24 0 0 1-24-24z" fill="#ECE8DE"/><rect x="62.5" y="256.5" width="283" height="220" rx="24" fill="none" stroke="#DED8CB"/><text x="82" y="280" font-size="12" font-weight="600" fill="#1E4A7D">Translation · English</text><text x="82" y="304" font-size="16" font-weight="400" fill="#15171C">Small crew change: Diego Torres</text><text x="82" y="328" font-size="16" font-weight="400" fill="#15171C">joins me today. Same arrival</text><text x="82" y="352" font-size="16" font-weight="400" fill="#15171C">window.</text><text x="82" y="388" font-size="12" font-weight="600" fill="#555A66">Original · Español</text><text x="82" y="412" font-size="16" font-weight="400" fill="#15171C">Pequeño cambio de equipo: Diego</text><text x="82" y="436" font-size="16" font-weight="400" fill="#15171C">Torres viene conmigo hoy.</text><text x="82" y="460" font-size="16" font-weight="400" fill="#15171C">Misma franja de llegada.</text></g><text x="370" y="500" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">You · 08:50</text><g><rect x="118" y="508" width="252" height="72" rx="24" fill="#E4E9FF"/><text x="138" y="538" font-size="16" font-weight="400" fill="#15171C">Thanks, Mateo. The side gate</text><text x="138" y="562" font-size="16" font-weight="400" fill="#15171C">will be open.</text></g><text x="370" y="600" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Sent · Mateo reads it in Español</text><g><rect x="35.5" y="620.5" width="319" height="35" rx="17.5" fill="#FFFFFF" stroke="#DED8CB"/><circle cx="58" cy="638" r="6" fill="#D6F33C" stroke="#15171C" stroke-width="2"/><text x="74" y="643" font-size="12" font-weight="600" fill="#15171C">On the way · arriving 09:10–09:20 · 08:52</text></g><text x="195" y="700" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">Write in your language. Your original stays attached.</text></g><g><rect y="724" width="390" height="120" fill="#FFFFFF"/><path d="M0 724.5h390" stroke="#DED8CB"/><rect x="20.5" y="738.5" width="55" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/><path transform="translate(36 754)" d="M12 5v14M5 12h14" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="88.5" y="738.5" width="213" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/><text x="110" y="772" font-size="16" font-weight="400" fill="#555A66">Message Mateo</text><rect x="314" y="738" width="56" height="56" rx="28" fill="#15171C"/><path transform="translate(330 754)" d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
