  <text x="40" y="247" font-size="14" font-weight="600" fill="#15171C">For Diego Torres</text><rect x="196" y="228" width="154" height="28" rx="14" fill="#E3EEFB"/><path transform="translate(204 234) scale(0.6667)" d="m5 12 5 5 9-10" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="247" font-size="12" font-weight="600" fill="#1E4A7D">Version 2 · current</text>
  <text x="40" y="270" font-size="14" font-weight="500" fill="#555A66">Issued by you · 08:41 Spain time</text>
  <text x="40" y="300" font-size="12" font-weight="600" fill="#555A66">Original · Español · your words</text><text x="40" y="324" font-size="16" font-weight="400" fill="#15171C">No uses la puerta de la terraza hasta</text><text x="40" y="348" font-size="16" font-weight="400" fill="#15171C">que Mateo lo autorice. Mantén el paso</text><text x="40" y="372" font-size="16" font-weight="400" fill="#15171C">acordonado mientras no haya rodillos.</text>
  <text x="40" y="412" font-size="14" font-weight="500" fill="#15171C">Diego reads it in English, original beneath.</text>
