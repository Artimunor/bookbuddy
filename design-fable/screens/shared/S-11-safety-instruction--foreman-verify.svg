<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-11-safety-instruction--foreman-verify-title S-11-safety-instruction--foreman-verify-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-11-safety-instruction--foreman-verify-title">S-11 Safety instruction — foreman verifies the teach-back</title>
  <desc id="S-11-safety-instruction--foreman-verify-desc">Foreman view for Mateo Ruiz at 09:16 Spain time on Tuesday 24 November. The safety hold banner names Diego Torres: brief him in person, then verify his teach-back; work stays blocked. The instruction for Diego Torres, version 2, current, issued by Mateo at 08:41, is shown once in his own Spanish words, with a note that Diego reads it in English with this original beneath and a link to preview what Diego reads. Briefing language: Español is selected, with a Change link; it must be a language both can check. The record shows Teach-back, now: Diego explains the points back to you; and Diego's acknowledgement, which unlocks on his phone after Mateo verifies. The dock says verify only what Diego explained back to you. One action: Verify teach-back.</desc>
