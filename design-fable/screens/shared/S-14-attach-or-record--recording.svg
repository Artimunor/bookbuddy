<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-14-attach-or-record--recording-title S-14-attach-or-record--recording-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-14-attach-or-record--recording-title">S-14 Attach or record — recording a voice note</title>
  <desc id="S-14-attach-or-record--recording-desc">Bottom sheet over Claire Martin's dimmed job chat at 07:58 UK time on Tuesday 24 November, while she records a voice note. Title: Voice note, for the Job conversation, not sent yet. A card says Recording with a dot, shows the elapsed time 0:12 and a level trace. A note says to speak in any language, the original is kept and a transcript is added when it is ready. Two separate full-size actions: Discard, and the primary Stop and review, which opens the preview. Nothing is sent from this sheet.</desc>
