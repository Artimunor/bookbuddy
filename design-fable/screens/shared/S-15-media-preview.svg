  <desc id="S-15-media-preview-desc">Full-screen preview opened by Claire Martin at 08:37 UK time on Tuesday 24 November from the photo stamp in Moments. Title: Photo, 1 of 1, Terrace door repair, BB-1042, with Close. The picture is an illustration of the terrace door track with the two old rollers taken out and lying beside it. Zoom out and Zoom in buttons sit under the picture next to the hint Pinch or use the buttons. A stamp says Photo shared at 09:36 by Mateo Ruiz, foreman, Spain time. The caption is shown in English, Old rollers out, with Mateo's Spanish original, Rodillos viejos fuera, attached beneath. A closing line says only people on this job can open the photo. The preview is read-only for Claire; there is no primary action.</desc>
