  <title id="L-07-session-live-card--island-compact-title">L-07 Session live card [Later] — Dynamic Island, compact</title>
  <desc id="L-07-session-live-card--island-compact-desc">Later category, not in the construction release. System surface on Claire Martin’s iPhone Home Screen in Xàbia at 09:20 Spain time on Saturday 28 November. The Dynamic Island shows the compact session activity: a lime calendar glyph on the leading side for a session today and the countdown 40 min on the trailing side. Tapping opens the session booking; touching and holding expands the island, which has one link, Open booking, and no control that changes the booking.</desc>
