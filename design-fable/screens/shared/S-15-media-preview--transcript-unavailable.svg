  <desc id="S-15-media-preview--transcript-unavailable-desc">Full-screen preview opened by Claire Martin at 08:41 UK time on Tuesday 24 November from a voice note in the job chat. Title: Voice note, Job chat, Terrace door repair, BB-1042, with Close. From Mateo Ruiz, foreman, at 09:40 Spain time, 08:40 her time. The player is labelled Original, Español, and is paused at 0:04 of 0:12 with a Play button and a level trace. Two statuses: Transcript unavailable, this recording could not be turned into text, with a Try again link; and No translation, because a translation needs a transcript first. A note says she can still play Mateo's original and nothing has been guessed. The dock says it opens the job chat with this voice note quoted. One action: Ask Mateo to write it.</desc>
