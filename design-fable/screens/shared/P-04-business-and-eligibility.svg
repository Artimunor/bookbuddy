  <title id="P-04-business-and-eligibility-title">P-04 Business and eligibility — approved</title>
  <desc id="P-04-business-and-eligibility-desc">Provider admin view for Mateo Ruiz at 09:41 Spain time on Tuesday 24 November. Reformas Ruiz is approved for repairs and small renovations on the Costa Blanca, with cover from its own crew; other categories are not approved. Crew eligibility, by status and date only: Nadia Benali eligible until Wednesday 31 March 2027, Diego Torres until Thursday 31 December 2026, Lucía Ortega until Wednesday 30 June 2027, and Pau Soler pending review, so he cannot be assigned yet. Documents are handled by the local service, not in the app. The dock shows the status was confirmed at 09:40 and has one action: Contact the local service.</desc>
