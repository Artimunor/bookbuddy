<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-18-live-updates-and-privacy--details-allowed-title S-18-live-updates-and-privacy--details-allowed-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-18-live-updates-and-privacy--details-allowed-title">S-18 Live updates and privacy — customer, details explicitly allowed</title>
  <desc id="S-18-live-updates-and-privacy--details-allowed-desc">Claire tapped Follow live in C-09 for this visit on this iPhone. Separately she turned off Hide details, which starts on. This preview assumes iOS also permits details: Reformas Ruiz, BB-1042, On the way, about 14 minutes, arriving 08:10 to 08:20 her time. Stop following ends the card without changing the booking.</desc>
