  <title id="L-05-session-booking--today-title">L-05 Session booking [Later] — today, starts in 40 minutes</title>
  <desc id="L-05-session-booking--today-desc">Later category, not in the construction release. Customer view for Claire Martin in Xàbia at 09:20 Spain time on Saturday 28 November. The capsule from Estudi Mar Pilates, BB-S1042, is live: today, starts in 40 minutes, 10:00 to 10:45 Spain time, doors open 09:45. One time is shown because she is in the same zone. The session line is at step two of five, Today. Mat Pilates with Elena Costa, who confirmed the class is on at 08:30 Spain time. A strip offers to follow the session on the Lock Screen. Below: check in at reception, arrive by 09:50, step-free entry; €16.00 due at the studio, paid to Estudi Mar Pilates and not in the app. The dock has Get directions and a message button.</desc>
