<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-14-attach-or-record-title S-14-attach-or-record-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-14-attach-or-record-title">S-14 Attach or record — sheet, ready</title>
  <desc id="S-14-attach-or-record-desc">Bottom sheet over Claire Martin's dimmed job chat at 07:58 UK time on Tuesday 24 November. Title: Attach or record, for the Job conversation, nothing is sent yet, with Close. Three choices: Take a photo, opens your camera; Choose a photo, only the photos you pick are shared; Record a voice note, in any language, your original is kept. A privacy note says only people in this chat can open it and to leave out gate and alarm codes. Choosing a source never sends anything; the message is sent from the chat.</desc>
