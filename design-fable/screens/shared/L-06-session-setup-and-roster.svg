<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="L-06-session-setup-and-roster-title L-06-session-setup-and-roster-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="L-06-session-setup-and-roster-title">L-06 Session setup and roster [Later] — published</title>
  <desc id="L-06-session-setup-and-roster-desc">Later category, not in the construction release. Provider admin view for Marina Serra at Estudi Mar Pilates at 09:41 Spain time on Wednesday 25 November. A capsule for Mat Pilates on Saturday 28 November, 10:00 to 10:45 Spain time, says 6 booked of 8 places, 2 open, bookings on; the session line is at Published, step one of five; published by Marina on Monday 16 November. Setup: group class with 8 places, 45 minutes, in English, step-free entry; €16.00 per person, paid at the studio, free to cancel until 24 hours before. Roster: one host needed and Elena Costa is confirmed, teaching in English. Marina Serra is the accountable coordinator and staffing is done in the coordinator role. The dock says changes go to booked customers as proposals and has one action: Edit session.</desc>
