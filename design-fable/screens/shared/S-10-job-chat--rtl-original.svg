<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-10-job-chat--rtl-original-title S-10-job-chat--rtl-original-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-10-job-chat--rtl-original-title">S-10 Job chat — right-to-left original</title>
  <desc id="S-10-job-chat--rtl-original-desc">Customer view for Claire Martin on Monday 23 November; times are Spain time. The language line says she reads English and two other languages are written here. A stamp records Crew confirmed, Nadia Benali, 08:38. Nadia Benali, crew, wrote at 08:44 in Arabic. The English translation is on top: Good morning. I'll come with Mateo tomorrow. Please keep the terrace by the door clear. The Arabic original is attached beneath, labelled Original, Arabic, and is right-aligned although the app runs left to right. Claire replied in English at 08:47; the receipt says it is sent and read in Español and Arabic. The composer says Message this chat, because Mateo and the crew member he added can both read it.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
