  <text x="82" y="304" font-size="16" font-weight="400" fill="#15171C">Good morning. I’ll come with</text><text x="82" y="328" font-size="16" font-weight="400" fill="#15171C">Mateo tomorrow. Please keep the</text><text x="82" y="352" font-size="16" font-weight="400" fill="#15171C">terrace by the door clear.</text>
