  <text x="326" y="412" font-size="16" font-weight="400" fill="#15171C" text-anchor="end">صباح الخير. سأحضر مع ماتيو</text>
  <text x="326" y="436" font-size="16" font-weight="400" fill="#15171C" text-anchor="end">غدًا. يُرجى إبقاء الشرفة</text>
  <text x="326" y="460" font-size="16" font-weight="400" fill="#15171C" text-anchor="end">قرب الباب خالية.&#x200F;</text></g>
  <text x="370" y="500" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">You · 08:47</text>
  <g id="sent-bubble"><rect x="118" y="508" width="252" height="72" rx="24" fill="#E4E9FF"/><text x="138" y="538" font-size="16" font-weight="400" fill="#15171C">Thank you, Nadia. I’ll move</text><text x="138" y="562" font-size="16" font-weight="400" fill="#15171C">the plant pots tonight.</text></g>
  <text x="332" y="600" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Sent · read in Español and</text><text x="370" y="600" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">العربية</text>
  <text x="195" y="700" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">Write in your language. Your original stays attached.</text>
