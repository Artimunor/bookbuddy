<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-03-verify-code--wrong-code-title S-03-verify-code--wrong-code-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-03-verify-code--wrong-code-title">S-03 Verify code — wrong code</title>
  <desc id="S-03-verify-code--wrong-code-desc">Signed-out view for claire@example.com after a code did not match. The code field is cleared and outlined in the critical colour, with the message: That code didn’t match. Use the newest email from BookBuddy. Two tries remain before a 15-minute pause. Links: send a new code, change email address, get help signing in. The Verify code button is disabled until six digits are entered.</desc>
