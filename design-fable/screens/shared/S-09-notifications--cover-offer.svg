  <title id="S-09-notifications--cover-offer-title">S-09 Notifications — cover offer</title>
  <desc id="S-09-notifications--cover-offer-desc">Worker view for Diego Torres at Reformas Ruiz at 08:36 Spain time on Tuesday 24 November, Field mode on. Under Needs you, a lime offer card: cover offer from Reformas Ruiz for today 09:00 to 10:00 Spain time, terrace door adjustment in Xàbia; the offer clock shows 6 minutes left and Reply by 08:42 Spain time. A line says opening the offer accepts nothing. Earlier: he joined Reformas Ruiz as Worker on 16 November after an invitation from Mateo Ruiz on 14 November. One action: Open offer.</desc>
