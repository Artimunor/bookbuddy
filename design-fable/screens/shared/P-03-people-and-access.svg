  <desc id="P-03-people-and-access-desc">Provider admin view for Mateo Ruiz at Reformas Ruiz at 09:41 Spain time on Tuesday 24 November. The Active segment lists six people and their roles in this business: Mateo Ruiz, Provider admin and Foreman, marked You; Inés Vidal, Foreman; Nadia Benali, Diego Torres and Lucía Ortega, Workers; and Pau Soler, Worker, whose eligibility review is pending. Other segments: Invited and Past. A link opens Eligibility. The dock says access starts only when the person accepts and has one action: Invite a person.</desc>
