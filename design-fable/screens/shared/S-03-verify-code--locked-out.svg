<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-03-verify-code--locked-out-title S-03-verify-code--locked-out-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-03-verify-code--locked-out-title">S-03 Verify code — locked out</title>
  <desc id="S-03-verify-code--locked-out-desc">Signed-out view for claire@example.com after too many wrong codes, at 09:41 her time. Sign-in is paused for this email until 09:56 her time, 15 minutes from now; codes are paused on every device and old codes no longer work. A second card says devices already signed in stay signed in and bookings and visits carry on. Links: use a different email, get help signing in. The Send a new code button is disabled until 09:56.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Enter your code</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Sign in or create account</text>
    
  </g>
  <g id="content">
    <text x="20" y="152" font-size="28" font-weight="800" fill="#15171C">Sign-in is paused</text>
    <text x="20" y="182" font-size="16" font-weight="400" fill="#15171C">Too many wrong codes for</text>
    <text x="20" y="206" font-size="16" font-weight="700" fill="#15171C">claire@example.com</text>
    <rect x="20" y="230" width="350" height="140" rx="24" fill="#FCE6E3"/>
    <path transform="translate(40 250)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#8A2F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="268" font-size="20" font-weight="700" fill="#8A2F28">Try again at 09:56</text>
    <text x="40" y="296" font-size="14" font-weight="600" fill="#8A2F28">Your time · 15 minutes from now</text>
    <path d="M40 312.5h310" stroke="#8A2F28"/>
    <text x="40" y="336" font-size="14" font-weight="500" fill="#8A2F28">Codes are paused for this email on every</text>
    <text x="40" y="356" font-size="14" font-weight="500" fill="#8A2F28">device. Old codes no longer work.</text>
    <rect x="20.5" y="386.5" width="349" height="87" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="402" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 408) scale(0.8333)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="418" font-size="17" font-weight="700" fill="#15171C">Nothing else changes</text>
    <text x="80" y="440" font-size="14" font-weight="500" fill="#555A66">Devices already signed in stay signed</text>
    <text x="80" y="460" font-size="14" font-weight="500" fill="#555A66">in. Bookings and visits carry on.</text>
    <text x="20" y="514" font-size="14" font-weight="700" fill="#2438B5">Use a different email</text><path d="M20 518.5h135" stroke="#2438B5" stroke-width="1.5"/>
    <text x="20" y="558" font-size="14" font-weight="700" fill="#2438B5">Get help signing in</text><path d="M20 562.5h120.3" stroke="#2438B5" stroke-width="1.5"/>
  </g>
  <g id="dock">
    <rect y="692" width="390" height="152" fill="#FFFFFF"/>
    <path d="M0 692.5h390" stroke="#DED8CB"/>
    <text x="195" y="718" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Available at 09:56 your time</text>
    <rect x="20" y="738" width="350" height="56" rx="28" fill="#ECE8DE"/>
    <text x="195" y="772" font-size="17" font-weight="700" fill="#555A66" text-anchor="middle">Send a new code</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
