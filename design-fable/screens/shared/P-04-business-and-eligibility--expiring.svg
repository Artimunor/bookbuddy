<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="P-04-business-and-eligibility--expiring-title P-04-business-and-eligibility--expiring-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="P-04-business-and-eligibility--expiring-title">P-04 Business and eligibility — crew check expiring</title>
  <desc id="P-04-business-and-eligibility--expiring-desc">Later outcome. Provider admin view for Mateo Ruiz on Tuesday 1 December. An amber notice says a check ends in 30 days: Diego Torres, Thursday 31 December 2026; after that he cannot be assigned. Reformas Ruiz stays approved for repairs and small renovations on the Costa Blanca. Crew eligibility lists Diego Torres first, marked Expiring, until Thursday 31 December 2026, then Nadia Benali eligible until Wednesday 31 March 2027 and Lucía Ortega eligible until Wednesday 30 June 2027. A note says Diego can take shifts that end before then and each assignment is rechecked when confirmed. The dock shows the status was confirmed at 08:00 Spain time and has one action: Contact the local service.</desc>
