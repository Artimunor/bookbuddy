  <title id="P-05-invite-or-edit-member-title">P-05 Invite or edit member — new invitation</title>
  <desc id="P-05-invite-or-edit-member-desc">Mateo invites diego@example.com to Reformas Ruiz as Worker. The recipient must sign in with that verified address. Worker membership does not confirm eligibility or a shift; only a verified Foreman can be invited as Foreman. The Provider admin option is locked and requires local service verification. Send invitation creates a single-use link valid for 48 hours.</desc>
