  <title id="S-08-messages-title">S-08 Messages — unread</title>
  <desc id="S-08-messages-desc">Foreman view for Mateo Ruiz at Reformas Ruiz at 08:50 Spain time on Tuesday 24 November. Two conversations for BB-1042. Claire Martin, Job conversation: one new message at 08:50, shown in Español, translated from English with the original kept. Diego Torres, Crew only: a message at 08:41 in Español as written. A note says customers never see Crew only chats. The live pill above the tab bar says Crew confirmed, today 09:00 to 10:00. Four tabs with Messages selected and one unread.</desc>
