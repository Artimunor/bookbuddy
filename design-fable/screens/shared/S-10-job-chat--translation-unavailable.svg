  <title id="S-10-job-chat--translation-unavailable-title">S-10 Job chat — translation unavailable</title>
  <desc id="S-10-job-chat--translation-unavailable-desc">Customer view for Claire Martin at 07:50 UK time on Tuesday 24 November; times in the thread are Spain time. Monday's message from Mateo Ruiz, foreman, is translated as usual: See you on Tuesday at 09:00, with the Spanish original beneath. Today's stamp says Crew updated, Diego Torres joins, 08:40. Mateo's 08:49 message could not be translated, so his exact Spanish original is on top and the strip beneath says Translation unavailable, this is Mateo's original, with two links: Try again and Ask Mateo to clarify. Nothing has been guessed. The composer is unchanged.</desc>
