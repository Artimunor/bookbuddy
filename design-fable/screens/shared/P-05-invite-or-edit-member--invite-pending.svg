  <title id="P-05-invite-or-edit-member--invite-pending-title">P-05 Invite or edit member — invite pending</title>
  <desc id="P-05-invite-or-edit-member--invite-pending-desc">Bottom sheet over the dimmed People screen with the Invited segment selected, for Mateo Ruiz at Reformas Ruiz on Sunday 15 November. Title: Invitation pending, acting as Provider admin. The invitation to diego@example.com as Worker is not accepted yet and is marked Pending. It was sent on Saturday 14 November at 10:12 Spain time by Mateo Ruiz, and the link works until Saturday 21 November at 10:12 Spain time, then it expires. A separate red link withdraws the invitation. The dock says there is no access until they accept with this email and has one action: Resend invitation.</desc>
