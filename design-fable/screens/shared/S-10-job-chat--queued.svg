<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-10-job-chat--queued-title S-10-job-chat--queued-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-10-job-chat--queued-title">S-10 Job chat — message queued offline</title>
  <desc id="S-10-job-chat--queued-desc">Customer view for Claire Martin at 07:59 UK time on Tuesday 24 November, with no connection. An amber line under the language line says Offline, last confirmed 08:52 Spain time, 1 message waiting. Her 08:50 reply, Thanks, Mateo. The side gate will be open, is sent and Mateo reads it in Español. The stamp On the way, arriving 09:10 to 09:20, 08:52, is the last confirmed status; its bead is an unlit ring because freshness cannot be confirmed offline. Her new message, The gate is open now. Come straight through, sits in a dashed bubble marked Saved on this device, pending sync; Mateo hasn't received it yet, and a Remove link deletes it before it is sent. The line above the composer says she is offline and new messages wait on this phone. Attach and Send still work for drafts.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">7:59</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Job chat</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Terrace door repair · BB-1042</text><path transform="translate(334 64)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 8v5m0-8h.01" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="language-line"><rect x="20" y="114" width="350" height="36" rx="18" fill="#ECE8DE"/><path transform="translate(32 122) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="137" font-size="14" font-weight="600" fill="#15171C">You read English · Mateo writes Español</text></g>
  <g id="offline-line"><rect x="20" y="158" width="350" height="36" rx="18" fill="#FFEFCF"/><path transform="translate(32 166) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 2" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="181" font-size="14" font-weight="600" fill="#6E4300">Offline · last confirmed 08:52 · 1 waiting</text></g>
  <g id="thread">
  <text x="195" y="218" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">Tue, 24 Nov · times in Spain time</text>
  <text x="370" y="246" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">You · 08:50</text>
  <g id="sent-bubble"><rect x="118" y="254" width="252" height="72" rx="24" fill="#E4E9FF"/><text x="138" y="284" font-size="16" font-weight="400" fill="#15171C">Thanks, Mateo. The side gate</text><text x="138" y="308" font-size="16" font-weight="400" fill="#15171C">will be open.</text></g>
  <text x="370" y="346" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Sent · Mateo reads it in Español</text>
  <g id="stamp-on-the-way"><rect x="35.5" y="366.5" width="319" height="35" rx="17.5" fill="#FFFFFF" stroke="#DED8CB"/><circle cx="58" cy="384" r="6" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><text x="74" y="389" font-size="12" font-weight="600" fill="#15171C">On the way · arriving 09:10–09:20 · 08:52</text></g>
  <text x="370" y="432" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">You · written 08:59</text>
  <g id="queued-bubble"><rect x="119" y="441" width="250" height="70" rx="23" fill="#FFFFFF" stroke="#747986" stroke-width="2" stroke-dasharray="6 5"/><text x="138" y="470" font-size="16" font-weight="400" fill="#15171C">The gate is open now. Come</text><text x="138" y="494" font-size="16" font-weight="400" fill="#15171C">straight through.</text></g>
  <text x="370" y="532" font-size="12" font-weight="600" fill="#6E4300" text-anchor="end">Saved on this device · pending sync</text>
  <text x="370" y="552" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Mateo hasn’t received it yet.</text>
  <text x="370" y="578" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end" text-decoration="underline">Remove</text>
  <text x="195" y="700" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">You’re offline. New messages wait on this phone.</text>
  </g>
  <g id="composer"><rect y="724" width="390" height="120" fill="#FFFFFF"/><path d="M0 724.5h390" stroke="#DED8CB"/><rect x="20.5" y="738.5" width="55" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/><path transform="translate(36 754)" d="M12 5v14M5 12h14" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="88.5" y="738.5" width="213" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/><text x="110" y="772" font-size="16" font-weight="400" fill="#555A66">Message Mateo</text><rect x="314" y="738" width="56" height="56" rx="28" fill="#15171C"/><path transform="translate(330 754)" d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
