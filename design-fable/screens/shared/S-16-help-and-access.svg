<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-16-help-and-access-title S-16-help-and-access-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-16-help-and-access-title">S-16 Help and access — expired link</title>
  <desc id="S-16-help-and-access-desc">Claire Martin, acting as Customer, opened a link that no longer works. A card says This link has expired: it no longer opens anything for this account, and nothing was changed or sent. The screen does not say what the link pointed to. Under What you can do: Ask for a new link, from the person who sent it to you; and Contact BookBuddy, the local service team, in writing. A support reference, HX-2Q7, can be quoted and reveals nothing about a job. A line explains that the destination is not shown, to protect other people's jobs and places. One action: Back to Now.</desc>
