<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-18-live-updates-and-privacy--worker-title S-18-live-updates-and-privacy--worker-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-18-live-updates-and-privacy--worker-title">S-18 Live updates and privacy — worker, what others see</title>
  <desc id="S-18-live-updates-and-privacy--worker-desc">Worker view for Diego Torres at 09:15 Spain time on Tuesday 24 November, Field mode on, opened from the check-in sheet. On this phone: Lock Screen shift card is on, optional, and starts after he checks in; Hide details is off and would show only Shift, since 09:14; Notifications are allowed for offers and shift changes. What others see about you: Mateo, his foreman, sees his status and his own times, confirmed, on the way, check-in and check-out. The customer sees crew status only, and his name once Mateo has confirmed him; an example shows what the customer sees, Crew on site, 09:14. Never his position, route or reasons. A green notice says No location is collected: check-in is his tap, no GPS, no map. A link opens the privacy notice for crew. Each switch applies at once; there is no primary action.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:15</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Live updates and privacy</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Diego Torres · this phone</text></g>
  <g id="this-phone"><rect x="20.5" y="114.5" width="349" height="215" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <text x="40" y="146" font-size="17" font-weight="700" fill="#15171C">Lock Screen shift card</text><text x="40" y="168" font-size="14" font-weight="500" fill="#555A66">Optional · starts after you check in</text><rect x="294" y="134" width="56" height="32" rx="16" fill="#15171C"/><circle cx="334" cy="150" r="12" fill="#FFFFFF"/><path d="M40 186.5H350" stroke="#DED8CB"/>
  <text x="40" y="218" font-size="17" font-weight="700" fill="#15171C">Hide details</text><text x="40" y="240" font-size="14" font-weight="500" fill="#555A66">Shows only “Shift · since 09:14”</text><rect x="295" y="207" width="54" height="30" rx="15" fill="#FFFFFF" stroke="#747986" stroke-width="2"/><circle cx="310" cy="222" r="10" fill="#747986"/><path d="M40 258.5H350" stroke="#DED8CB"/>
  <text x="40" y="290" font-size="17" font-weight="700" fill="#15171C">Notifications</text><text x="40" y="312" font-size="14" font-weight="500" fill="#555A66">Allowed · offers and shift changes</text><path transform="translate(326 282)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="20" y="366" font-size="20" font-weight="700" fill="#15171C">What others see about you</text>
  <g id="others-see"><rect x="20.5" y="380.5" width="349" height="281" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <circle cx="56" cy="414" r="16" fill="#DDEBFF"/><text x="56" y="419" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">MR</text><text x="84" y="410" font-size="17" font-weight="700" fill="#15171C">Mateo, your foreman</text>
  <text x="84" y="432" font-size="14" font-weight="500" fill="#555A66">Your status and your own times:</text><text x="84" y="452" font-size="14" font-weight="500" fill="#555A66">confirmed, on the way, check-in and out</text>
  <path d="M40 470.5H350" stroke="#DED8CB"/>
  <rect x="40" y="486" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 492) scale(0.8333)" d="M4 11l8-7 8 7v9H4zm6 9v-6h4v6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="500" font-size="17" font-weight="700" fill="#15171C">The customer</text>
  <text x="84" y="522" font-size="14" font-weight="500" fill="#555A66">Crew status only, and your name once</text><text x="84" y="542" font-size="14" font-weight="500" fill="#555A66">Mateo has confirmed you</text>
  <rect x="40" y="558" width="310" height="60" rx="16" fill="#ECE8DE"/><text x="56" y="580" font-size="12" font-weight="600" fill="#555A66">The customer sees</text><text x="56" y="604" font-size="17" font-weight="700" fill="#15171C">Crew on site · 09:14</text>
  <path transform="translate(40 630) scale(0.75)" d="M6 6l12 12M18 6 6 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="644" font-size="14" font-weight="600" fill="#15171C">Never your position, route or reasons</text></g>
  <g id="no-location"><rect x="20" y="676" width="350" height="64" rx="24" fill="#E1F3E4"/><path transform="translate(36 696)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM4 4l16 16" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="704" font-size="17" font-weight="700" fill="#1E5A32">No location is collected</text><text x="72" y="724" font-size="14" font-weight="500" fill="#1E5A32">Check-in is your tap. No GPS, no map.</text></g>
  <text x="20" y="776" font-size="14" font-weight="700" fill="#2438B5" text-decoration="underline">Read the privacy notice for crew</text>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
