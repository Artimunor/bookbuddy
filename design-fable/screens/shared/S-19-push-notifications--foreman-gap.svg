  <title id="S-19-push-notifications--foreman-gap-title">S-19 Push notifications — foreman crew gap banner</title>
  <desc id="S-19-push-notifications--foreman-gap-desc">System surface: Mateo Ruiz's iPhone Lock Screen at 08:32 Spain time on Tuesday 24 November. One BookBuddy push banner for Reformas Ruiz: Crew gap, today 09:00 to 10:00. A crew member can't make it. Open BB-1042 to find cover. The worker's name and reason are not shown on the Lock Screen. Tapping opens Find cover after unlock; no offer is sent and nobody is assigned from the banner.</desc>
