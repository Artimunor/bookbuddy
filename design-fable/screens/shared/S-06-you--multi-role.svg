    <text x="92" y="148" font-size="20" font-weight="700" fill="#15171C">Mateo Ruiz</text>
    <text x="92" y="170" font-size="14" font-weight="500" fill="#555A66">mateo@example.com</text>
    <text x="350" y="157" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end">Edit</text><path d="M324.4 161.5h25.6" stroke="#2438B5" stroke-width="1.5"/>
  </g>
