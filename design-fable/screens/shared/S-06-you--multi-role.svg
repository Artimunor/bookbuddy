<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-06-you--multi-role-title S-06-you--multi-role-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-06-you--multi-role-title">S-06 You — multi-role</title>
  <desc id="S-06-you--multi-role-desc">Mateo Ruiz opens You from the identity chip. The role card says he is acting as Foreman at Reformas Ruiz in Xàbia and that Provider admin is also his; a Switch button opens the role sheet. Rows open Language and display (English app, messages in Español), Live updates and privacy, and Help and access. Sign out is a quiet button at the end.</desc>
