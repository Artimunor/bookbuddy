<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-10-job-chat-title S-10-job-chat-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-10-job-chat-title">S-10 Job chat — customer view with translation and original</title>
  <desc id="S-10-job-chat-desc">Customer view for Claire Martin on Tuesday 24 November; times are Spain time. The language line says she reads English and Mateo writes Español. An inline stamp records the crew update at 08:40. Mateo Ruiz, foreman, wrote at 08:49 in Spanish; the English translation is on top and the Spanish original is attached beneath. Claire replied in English at 08:50; it is sent and Mateo reads it in Español. A second stamp records On the way, arriving 09:10 to 09:20, at 08:52. The composer has separate Attach and Send controls.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">7:58</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Job chat</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Terrace door repair · BB-1042</text>
    <path transform="translate(334 64)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 8v5m0-8h.01" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="language-line">
    <rect x="20" y="114" width="350" height="36" rx="18" fill="#ECE8DE"/>
    <path transform="translate(32 122) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="137" font-size="14" font-weight="600" fill="#15171C">You read English · Mateo writes Español</text>
  </g>
  <g id="thread">
    <text x="195" y="174" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">Tue, 24 Nov · times in Spain time</text>
    <g id="stamp-crew">
      <rect x="45.5" y="186.5" width="299" height="35" rx="17.5" fill="#FFFFFF" stroke="#DED8CB"/>
      <path transform="translate(58 194) scale(0.8333)" d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-6 8a6 6 0 0 1 12 0m1-8a3 3 0 1 0 0-6m2 14a6 6 0 0 0-3-5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="209" font-size="12" font-weight="600" fill="#15171C">Crew updated · Diego Torres joins · 08:40</text>
    </g>
    <circle cx="36" cy="262" r="16" fill="#DDEBFF"/><text x="36" y="267" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">MR</text>
    <text x="62" y="248" font-size="12" font-weight="600" fill="#555A66">Mateo Ruiz · Foreman</text>
    <text x="346" y="248" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">08:49</text>
    <g id="twin-bubble">
      <rect x="62.5" y="256.5" width="283" height="220" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
      <path d="M63 366h282v86a24 24 0 0 1-24 24H87a24 24 0 0 1-24-24z" fill="#ECE8DE"/>
      <rect x="62.5" y="256.5" width="283" height="220" rx="24" fill="none" stroke="#DED8CB"/>
      <text x="82" y="280" font-size="12" font-weight="600" fill="#1E4A7D">Translation · English</text>
      <text x="82" y="304" font-size="16" font-weight="400" fill="#15171C">Small crew change: Diego Torres</text>
      <text x="82" y="328" font-size="16" font-weight="400" fill="#15171C">joins me today. Same arrival</text>
      <text x="82" y="352" font-size="16" font-weight="400" fill="#15171C">window.</text>
      <text x="82" y="388" font-size="12" font-weight="600" fill="#555A66">Original · Español</text>
      <text x="82" y="412" font-size="16" font-weight="400" fill="#15171C">Pequeño cambio de equipo: Diego</text>
      <text x="82" y="436" font-size="16" font-weight="400" fill="#15171C">Torres viene conmigo hoy.</text>
      <text x="82" y="460" font-size="16" font-weight="400" fill="#15171C">Misma franja de llegada.</text>
    </g>
    <text x="370" y="500" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">You · 08:50</text>
    <g id="sent-bubble">
      <rect x="118" y="508" width="252" height="72" rx="24" fill="#E4E9FF"/>
      <text x="138" y="538" font-size="16" font-weight="400" fill="#15171C">Thanks, Mateo. The side gate</text>
      <text x="138" y="562" font-size="16" font-weight="400" fill="#15171C">will be open.</text>
    </g>
    <text x="370" y="600" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Sent · Mateo reads it in Español</text>
    <g id="stamp-on-the-way">
      <rect x="35.5" y="620.5" width="319" height="35" rx="17.5" fill="#FFFFFF" stroke="#DED8CB"/>
      <circle cx="58" cy="638" r="6" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="74" y="643" font-size="12" font-weight="600" fill="#15171C">On the way · arriving 09:10–09:20 · 08:52</text>
    </g>
    <text x="195" y="700" font-size="12" font-weight="600" fill="#555A66" text-anchor="middle">Write in your language. Your original stays attached.</text>
  </g>
  <g id="composer">
    <rect y="724" width="390" height="120" fill="#FFFFFF"/>
    <path d="M0 724.5h390" stroke="#DED8CB"/>
    <rect x="20.5" y="738.5" width="55" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/>
    <path transform="translate(36 754)" d="M12 5v14M5 12h14" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="88.5" y="738.5" width="213" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/>
    <text x="110" y="772" font-size="16" font-weight="400" fill="#555A66">Message Mateo</text>
    <rect x="314" y="738" width="56" height="56" rx="28" fill="#15171C"/>
    <path transform="translate(330 754)" d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
