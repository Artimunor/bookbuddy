  <title id="L-07-session-live-card--android-title">L-07 Session live card [Later] — Android ongoing notification, expanded</title>
  <desc id="L-07-session-live-card--android-desc">Later category, not in the construction release. System surface on an Android phone in Xàbia at 09:20 Spain time on Saturday 28 November, with the ongoing BookBuddy notification expanded in the shade. Title: Mat Pilates, starts in 40 min. Today 10:00 to 10:45, doors open 09:45; Estudi Mar Pilates, BB-S1042. A determinate progress bar. With Elena Costa, taught in English; Elena confirmed it is on at 08:30 Spain time. Two actions that only open the app: Open booking and Message the studio. Nothing here changes the booking, and no address, price or message text is shown.</desc>
