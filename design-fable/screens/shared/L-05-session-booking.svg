  <title id="L-05-session-booking-title">L-05 Session booking [Later] — upcoming</title>
  <desc id="L-05-session-booking-desc">Later category, not in the construction release. Customer view for Claire Martin at 09:41 UK time on Wednesday 25 November. The booking pass is a capsule from Estudi Mar Pilates, reference BB-S1042: booked for Saturday 28 November, in 3 days, 10:00 to 10:45 Spain time, 09:00 to 09:45 her time. The session line is at step one of five, Booked, followed by Today, Doors open, In session and Done. Mat Pilates with Elena Costa; booked Monday 23 November at 10:42 Spain time. Below: check in at reception, arrive by 09:50, step-free entry; €16.00 due at the studio, paid to Estudi Mar Pilates and not in the app; change or cancel for free until Friday 27 November at 10:00 Spain time. Her contact is Marina Serra, coordinator. One action: Message the studio.</desc>
