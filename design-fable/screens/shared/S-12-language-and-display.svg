<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-12-language-and-display-title S-12-language-and-display-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-12-language-and-display-title">S-12 Language and display — signed in, English</title>
  <desc id="S-12-language-and-display-desc">Claire Martin's language and display settings, saved to her account. App language: English is selected and Português is the other choice; it covers menus, buttons and notifications. Read messages in: English, used for messages, quotes and briefings. A preview shows how a translated message looks: See you on Tuesday at 09:00 in English on top and the Spanish original, Nos vemos el martes a las 09:00, beneath; originals are never changed or hidden. Display: Show my time as well is on, Spain time first and UK time beneath; Field mode is off, bigger buttons for gloves and glare; Appearance follows the system. A closing line says changing a language never changes an approved quote, an issued instruction or a booked time. There is no primary action; each change applies at once.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
