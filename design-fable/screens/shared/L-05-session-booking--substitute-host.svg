  <title id="L-05-session-booking--substitute-host-title">L-05 Session booking [Later] — substitute host</title>
  <desc id="L-05-session-booking--substitute-host-desc">Later category, not in the construction release. Alternative branch. Customer view for Claire Martin at 17:15 UK time on Friday 27 November, 18:15 in Spain. The capsule from Estudi Mar Pilates, BB-S1042, still says booked for Saturday 28 November, tomorrow, 10:00 to 10:45 Spain time, 09:00 to 09:45 her time, at step one of five. The host is now Lucía Vidal; updated by Marina Serra on Friday at 18:10 Spain time. A blue notice says the host changed: Lucía Vidal will teach the class, with the same time, place and price, still taught in English. No reason is given. Below: check in at reception, arrive by 09:50; €16.00 due at the studio. One action: Message the studio.</desc>
