<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-18-live-updates-and-privacy--notifications-off-title S-18-live-updates-and-privacy--notifications-off-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-18-live-updates-and-privacy--notifications-off-title">S-18 Live updates and privacy — notifications off</title>
  <desc id="S-18-live-updates-and-privacy--notifications-off-desc">Claire has turned off ordinary BookBuddy alerts on this iPhone and is not following this visit on the Lock Screen. The alerts setting and the visit card are separate. Hide details is on by default. Opening phone settings changes no booking and starts no card. Claire can still see the visit in the app. No location is collected.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">7:58</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Live updates and privacy</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Claire Martin · this iPhone</text></g>
  <g id="notifications-off"><rect x="20" y="114" width="350" height="92" rx="24" fill="#FFEFCF"/><path transform="translate(36 130)" d="M6 16h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4zm4 3a2 2 0 0 0 4 0" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 132l20 20" stroke="#6E4300" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="144" font-size="17" font-weight="700" fill="#6E4300">Notifications are off</text><text x="70" y="166" font-size="14" font-weight="500" fill="#6E4300">You won’t get alerts on this phone.</text><text x="70" y="186" font-size="14" font-weight="500" fill="#6E4300">Your booking is unchanged.</text></g>
  <text x="20" y="234" font-size="14" font-weight="700" fill="#2438B5" text-decoration="underline">Open phone settings</text>
  <g id="this-phone"><rect x="20.5" y="254.5" width="349" height="203" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <text x="40" y="284" font-size="17" font-weight="700" fill="#15171C">Lock Screen visit card</text><text x="40" y="306" font-size="14" font-weight="500" fill="#555A66">Off · not following this visit</text><rect x="295" y="273" width="54" height="30" rx="15" fill="#FFFFFF" stroke="#747986" stroke-width="2"/><circle cx="310" cy="288" r="10" fill="#747986"/><path d="M40 322.5H350" stroke="#DED8CB"/>
  <text x="40" y="352" font-size="17" font-weight="700" fill="#15171C">Hide details</text><text x="40" y="374" font-size="14" font-weight="500" fill="#555A66">On by default · stage only</text><rect x="294" y="340" width="56" height="32" rx="16" fill="#15171C"/><circle cx="334" cy="356" r="12" fill="#FFFFFF"/><path d="M40 390.5H350" stroke="#DED8CB"/>
  <text x="40" y="420" font-size="17" font-weight="700" fill="#15171C">Notifications</text><text x="40" y="442" font-size="14" font-weight="500" fill="#555A66">Off · change in phone settings</text><path transform="translate(326 412)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="20" y="494" font-size="20" font-weight="700" fill="#15171C">What the crew shares with you</text>
  <g id="shared-with-you"><rect x="20.5" y="508.5" width="349" height="131" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <path transform="translate(40 522) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="536" font-size="14" font-weight="500" fill="#15171C">Crew status, when a person confirms it</text>
  <path transform="translate(40 548) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="562" font-size="14" font-weight="500" fill="#15171C">An arrival estimate the crew chose to share</text>
  <path transform="translate(40 574) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="588" font-size="14" font-weight="500" fill="#15171C">Names of confirmed crew, shared photos</text>
  <path transform="translate(40 600) scale(0.75)" d="M6 6l12 12M18 6 6 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="614" font-size="14" font-weight="500" fill="#15171C">Never a map, a route or anyone’s position</text></g>
  <g id="no-location"><rect x="20" y="652" width="350" height="64" rx="24" fill="#E1F3E4"/><path transform="translate(36 672)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM4 4l16 16" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="680" font-size="17" font-weight="700" fill="#1E5A32">No location is collected</text><text x="72" y="700" font-size="14" font-weight="500" fill="#1E5A32">Not yours, and not the crew’s.</text></g>
  <text x="20" y="748" font-size="14" font-weight="500" fill="#555A66">You can still follow the visit in the app.</text>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
