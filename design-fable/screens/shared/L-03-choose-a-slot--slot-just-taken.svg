  <title id="L-03-choose-a-slot--slot-just-taken-title">L-03 Choose a slot [Later] — slot just taken</title>
  <desc id="L-03-choose-a-slot--slot-just-taken-desc">Later category, not in the construction release. Alternative snapshot of the Choose a time sheet over the dimmed Mat Pilates detail, for Claire Martin. She asked to hold one place at 10:00 to 10:45 on Saturday 28 November, but the last places went first. The 10:00 row is greyed and reads No places left. The 11:30 to 12:15 row is open with 5 places left, 10:30 to 11:15 her time, and is not selected for her. A red notice says that time was just taken, nothing was held, and 11:30 has 5 places. The dock button Hold 1 place and review is disabled with the reason: Choose another time to continue.</desc>
