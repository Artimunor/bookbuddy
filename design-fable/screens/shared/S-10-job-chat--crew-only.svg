<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-10-job-chat--crew-only-title S-10-job-chat--crew-only-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-10-job-chat--crew-only-title">S-10 Job chat — Crew only, worker view in Field mode</title>
  <desc id="S-10-job-chat--crew-only-desc">Worker view for Diego Torres at 09:15 Spain time on Tuesday 24 November, Field mode on. The header says Crew only with a lock; only Mateo and Diego can read it. A pinned safety hold banner says version 2 needs a briefing with Mateo before work starts and opens the safety instruction. Stamps inside the crew: Confirmed as cover by Mateo, 08:40, and You checked in, 09:14, attendance only. Diego wrote in Spanish at 08:41, Confirmado. Salgo en cinco minutos; it is sent and Mateo reads it in Español. Mateo's 08:53 message is shown in English, On my way. See you at the side gate, with his Spanish original beneath. A line above the composer says customers never see this chat. Attach and Send are 62 units high.</desc>
