<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-19-push-notifications-title S-19-push-notifications-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-19-push-notifications-title">S-19 Push notifications — customer Lock Screen banners</title>
  <desc id="S-19-push-notifications-desc">System surface: Claire Martin's iPhone Lock Screen at 07:52 UK time on Tuesday 24 November, before she follows the visit live. Three BookBuddy push banners for Terrace door repair, newest first. Now: Crew on the way, arriving 09:10 to 09:20 Spain time. Three minutes ago: New message from Mateo Ruiz, open the job chat to read it; the message text is not shown. Twelve minutes ago: Crew updated, same visit window, open for details. No address, price, message text or position appears, and the banners are plain, without lime. Tapping a banner opens its record after unlock and never approves or accepts anything.</desc>
