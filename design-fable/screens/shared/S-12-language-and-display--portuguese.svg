  <text x="40" y="742" font-size="14" font-weight="500" fill="#555A66">Claro, escuro ou como o telemóvel</text></g>
  <text x="20" y="786" font-size="14" font-weight="500" fill="#555A66">O idioma nunca altera orçamentos aprovados,</text><text x="20" y="806" font-size="14" font-weight="500" fill="#555A66">instruções emitidas nem horas marcadas.</text>
