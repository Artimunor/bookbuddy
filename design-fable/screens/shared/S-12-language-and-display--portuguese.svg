<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-12-language-and-display--portuguese-title S-12-language-and-display--portuguese-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-12-language-and-display--portuguese-title">S-12 Language and display — Portuguese app language</title>
  <desc id="S-12-language-and-display--portuguese-desc">The same settings for Claire Martin after she chose Português as the app language; the labels are European Portuguese and run 30 to 40 percent longer. App language, Idioma da aplicação: Português is selected. Read messages in, Ler mensagens em, is still English, because the reading language is a separate choice; the preview still shows the English translation on top and the Spanish original beneath, with the labels Tradução and Original. Display: Mostrar também a minha hora wraps to two lines and its row grows, on; Modo de obra, Field mode, off; Aspeto, appearance, Sistema. The closing line says the language never changes approved quotes, issued instructions or booked times. Nothing is shrunk or truncated.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
