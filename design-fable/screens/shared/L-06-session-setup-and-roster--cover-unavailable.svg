<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="L-06-session-setup-and-roster--cover-unavailable-title L-06-session-setup-and-roster--cover-unavailable-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="L-06-session-setup-and-roster--cover-unavailable-title">L-06 Session setup and roster [Later] — cover unavailable</title>
  <desc id="L-06-session-setup-and-roster--cover-unavailable-desc">Later category, not in the construction release. Alternative branch. Coordinator view for Marina Serra at Estudi Mar Pilates at 18:05 Spain time on Friday 27 November. The capsule for Mat Pilates on Saturday 28 November, 10:00 to 10:45 Spain time, says Host needed, 6 of 8 booked; Elena Costa reported she cannot attend at 17:30. The cover ladder has two rungs. Own team: no cover; Lucía Vidal cannot cover and replied at 17:52, and no one else is eligible to teach. Propose a change is now open: offer the 6 booked customers another time, or cancel the class; each customer must answer. New bookings are paused. Customers see that a host is being arranged, not the reason. The dock says customers answer each proposal themselves and has one action: Propose a new time; a red link cancels the class instead.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
