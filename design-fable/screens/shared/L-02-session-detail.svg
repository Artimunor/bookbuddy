  <title id="L-02-session-detail-title">L-02 Session detail [Later] — open, places left</title>
  <desc id="L-02-session-detail-desc">Later category, not in the construction release. Customer view for Claire Martin of Mat Pilates at Estudi Mar Pilates in Xàbia. The next session is Saturday 28 November, 10:00 to 10:45 Spain time, 09:00 to 09:45 her time, 45 minutes, with 3 of 8 places left. The host is Elena Costa, who teaches in English. Facts: taught in English whatever the app language; step-free studio entry; €16.00 per person, paid to the studio and not in the app; free to cancel or move until Friday 27 November at 10:00 Spain time. One action: Choose a time.</desc>
