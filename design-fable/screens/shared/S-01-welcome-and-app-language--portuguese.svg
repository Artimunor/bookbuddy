    <text x="76" y="556" font-size="17" font-weight="700" fill="#15171C">Idioma da aplicação</text>
    <text x="40" y="580" font-size="14" font-weight="500" fill="#555A66">O seu telemóvel está em português.</text>
    <rect x="40.5" y="596.5" width="148" height="39" rx="19.5" fill="#FFFFFF" stroke="#747986"/><text x="114.5" y="621" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">English</text><rect x="201" y="596" width="149" height="40" rx="20" fill="#15171C"/><path d="m219 616 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="239" y="621" font-size="14" font-weight="700" fill="#FFFFFF">Português</text>
