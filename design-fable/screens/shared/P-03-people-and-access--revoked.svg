  <title id="P-03-people-and-access--revoked-title">P-03 People and access — access revoked</title>
  <desc id="P-03-people-and-access--revoked-desc">Later outcome. Provider admin view for Mateo Ruiz at Reformas Ruiz at 16:20 Spain time on Tuesday 24 November, just after he confirmed a revocation. A notice says access is revoked: Pau Soler no longer has Worker access at Reformas Ruiz. The Past segment is selected and holds one record: Pau Soler, former Worker, revoked on Tuesday 24 November at 16:20 Spain time by Mateo Ruiz, Provider admin. The Active segment now counts five. A note says revoked access is not restored and a new invitation is needed to grant access again. The dock action is Invite a person.</desc>
