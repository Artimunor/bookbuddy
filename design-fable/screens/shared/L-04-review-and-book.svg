  <title id="L-04-review-and-book-title">L-04 Review and book [Later] — place held</title>
  <desc id="L-04-review-and-book-desc">Later category, not in the construction release. Customer view for Claire Martin at 09:41 UK time on Monday 23 November, 10:41 in Spain. One place is held until 10:48 Spain time, 09:48 her time; a ring shows 7 minutes left. Summary: Mat Pilates at Estudi Mar Pilates in Xàbia, Saturday 28 November, 10:00 to 10:45 Spain time, 09:00 to 09:45 her time, 1 place, in English, with Elena Costa; a link changes the time. Total €16.00, 1 place at €16.00 per person, paid to Estudi Mar Pilates at the studio; no payment is taken in the app. Free to cancel or move until Friday 27 November at 10:00 Spain time. The dock says it is not booked until she confirms and has one action: Book session.</desc>
