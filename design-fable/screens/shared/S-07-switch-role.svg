<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-07-switch-role-title S-07-switch-role-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-07-switch-role-title">S-07 Switch role — sheet with two roles</title>
  <desc id="S-07-switch-role-desc">Bottom sheet over Mateo Ruiz’s dimmed You screen at 09:41 Spain time on Tuesday 24 November. Foreman is the current role and Provider admin is selected, both at Reformas Ruiz. BB-1042 stays live under Foreman. Alerts for that role are still possible if enabled. Drafts stay with their original role. Switch to Provider admin confirms the choice; Close keeps the current role.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">You</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Your account on this phone</text>
    
  </g>
  <g id="identity">
    <circle cx="48" cy="152" r="28" fill="#DDEBFF"/><text x="48" y="158" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">MR</text>
    <text x="92" y="148" font-size="20" font-weight="700" fill="#15171C">Mateo Ruiz</text>
    <text x="92" y="170" font-size="14" font-weight="500" fill="#555A66">mateo@example.com</text>
    <text x="350" y="157" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end">Edit</text><path d="M324.4 161.5h25.6" stroke="#2438B5" stroke-width="1.5"/>
  </g>
  <g id="role-card">
    <rect x="20.5" y="196.5" width="349" height="119" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <text x="40" y="226" font-size="12" font-weight="600" fill="#555A66">Acting as</text>
    <text x="40" y="254" font-size="20" font-weight="700" fill="#15171C">Foreman</text>
    <text x="40" y="276" font-size="14" font-weight="500" fill="#555A66">Reformas Ruiz · Xàbia</text>
    <text x="40" y="298" font-size="14" font-weight="500" fill="#555A66">Also yours: Provider admin</text>
    <rect x="262.5" y="216.5" width="87" height="39" rx="19.5" fill="#FFFFFF" stroke="#747986"/><text x="306" y="241" font-size="14" font-weight="700" fill="#15171C" text-anchor="middle">Switch</text>
  </g>
  <g id="settings">
    <rect x="20.5" y="332.5" width="349" height="191" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="348" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 354) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="360" font-size="17" font-weight="700" fill="#15171C">Language and display</text><text x="80" y="380" font-size="14" font-weight="500" fill="#555A66">English · messages in Español</text><path transform="translate(326 352)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 396.5h318" stroke="#DED8CB"/>
    <rect x="36" y="412" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 418) scale(0.8333)" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="424" font-size="17" font-weight="700" fill="#15171C">Live updates and privacy</text><text x="80" y="444" font-size="14" font-weight="500" fill="#555A66">What customers and crew can see</text><path transform="translate(326 416)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 460.5h318" stroke="#DED8CB"/>
    <rect x="36" y="476" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 482) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-2.5 7a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7m0 3h.01" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="488" font-size="17" font-weight="700" fill="#15171C">Help and access</text><text x="80" y="508" font-size="14" font-weight="500" fill="#555A66">Reach the local service</text><path transform="translate(326 480)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="sign-out">
    <rect x="20.5" y="544.5" width="349" height="55" rx="27.5" fill="#FFFFFF" stroke="#747986"/>
    <text x="195" y="578" font-size="17" font-weight="700" fill="#8A2F28" text-anchor="middle">Sign out</text>
    <text x="195" y="628" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">You can sign out on this phone even offline.</text>
  </g>
  <rect id="scrim" width="390" height="844" fill="#15171C" opacity="0.4"/>
  <g id="sheet">
    <path d="M0 348a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32v496H0z" fill="#FFFFFF"/>
    <rect x="175" y="326" width="40" height="5" rx="2.5" fill="#747986"/>
    <text x="20" y="376" font-size="20" font-weight="700" fill="#15171C">Switch role</text>
    <rect x="322.5" y="344.5" width="47" height="47" rx="23.5" fill="#FFFFFF" stroke="#747986"/>
    <path transform="translate(334 356)" d="M6 6l12 12M18 6 6 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="404" font-size="14" font-weight="500" fill="#555A66">You stay signed in as Mateo Ruiz.</text>
    <text x="20" y="424" font-size="14" font-weight="500" fill="#555A66">Only what you act as changes.</text>
    <g id="role-foreman">
      <rect x="20.5" y="444.5" width="349" height="75" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
      <rect x="36" y="466" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 472) scale(0.8333)" d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-6 8a6 6 0 0 1 12 0m1-8a3 3 0 1 0 0-6m2 14a6 6 0 0 0-3-5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="476" font-size="17" font-weight="700" fill="#15171C">Foreman</text>
      <text x="80" y="498" font-size="14" font-weight="500" fill="#555A66">Reformas Ruiz · Xàbia</text>
      <rect x="162" y="458" width="68" height="24" rx="12" fill="#ECE8DE"/><text x="196" y="475" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">Current</text>
      <circle cx="330" cy="482" r="11" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    </g>
    <g id="role-admin">
      <rect x="21" y="533" width="348" height="74" rx="23" fill="#E4E9FF" stroke="#2438B5" stroke-width="2"/>
      <rect x="36" y="554" width="32" height="32" rx="12" fill="#FFFFFF"/><path transform="translate(42 560) scale(0.8333)" d="M6 5h12v15H6zM9 9h6M9 13h6M9 17h3" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="564" font-size="17" font-weight="700" fill="#15171C">Provider admin</text>
      <text x="80" y="586" font-size="14" font-weight="500" fill="#15171C">Reformas Ruiz · Xàbia</text>
      <circle cx="330" cy="570" r="12" fill="#15171C"/><path d="m324.5 570 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="live-note">
      <rect x="20" y="620" width="350" height="60" rx="16" fill="#ECE8DE"/>
      <circle cx="44" cy="641" r="6" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="62" y="646" font-size="14" font-weight="600" fill="#15171C">BB-1042 stays live under Foreman.</text>
      <text x="38" y="666" font-size="14" font-weight="500" fill="#555A66">You can still get alerts for this role, if enabled.</text>
    </g>
  </g>
  <g id="sheet-dock">
    <rect y="692" width="390" height="152" fill="#FFFFFF"/>
    <path d="M0 692.5h390" stroke="#DED8CB"/>
    <text x="195" y="718" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Drafts stay with the role they were written in</text>
    <rect x="20" y="738" width="350" height="56" rx="28" fill="#15171C"/>
    <text x="195" y="772" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Switch to Provider admin</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
