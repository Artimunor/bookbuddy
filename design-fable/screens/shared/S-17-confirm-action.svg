<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-17-confirm-action-title S-17-confirm-action-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-17-confirm-action-title">S-17 Confirm action — sign-off dialog</title>
  <desc id="S-17-confirm-action-desc">Confirmation dialog over Claire Martin's dimmed Review and sign off screen at 09:40 UK time on Tuesday 24 November. Title: Sign off this work? The item is BB-1042, Terrace door repair, Villa Mar in Xàbia, approved scope version 1. She acts as Claire Martin, named approver and customer at Villa Mar. Effects: it tells Reformas Ruiz she accepts the work as finished; it is recorded with her name and the time; and it is not a payment, because the bill comes from Reformas Ruiz and she pays them directly. Two actions inside the dialog: the named action Sign off the work, and Cancel, which changes nothing.</desc>
