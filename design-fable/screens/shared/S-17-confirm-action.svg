  <g id="parent" aria-hidden="true"><rect width="390" height="844" fill="#F6F3EC"/><g aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:40</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g><g><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Review and sign off</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text></g><g><rect x="20" y="114" width="350" height="64" rx="24" fill="#FFEFCF"/><path transform="translate(36 134)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 2" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="140" font-size="17" font-weight="700" fill="#6E4300">Waiting for your review</text><text x="72" y="162" font-size="14" font-weight="500" fill="#6E4300">Submitted by Mateo · 10:15 Spain time</text></g><text x="20" y="210" font-size="20" font-weight="700" fill="#15171C">Approved scope</text><text x="370" y="210" font-size="14" font-weight="500" fill="#555A66" text-anchor="end">Quote v1 · €240.00</text><g><rect x="20.5" y="224.5" width="349" height="381" rx="23.5" fill="#FFFFFF" stroke="#DED8CB"/><path d="M21 494h348v88a24 24 0 0 1-24 24H45a24 24 0 0 1-24-24z" fill="#ECE8DE"/><rect x="20.5" y="224.5" width="349" height="382" rx="24" fill="none" stroke="#DED8CB"/><text x="40" y="250" font-size="12" font-weight="600" fill="#1E4A7D">Translation · English</text><text x="40" y="286" font-size="17" font-weight="700" fill="#15171C">Adjust the terrace door</text><path transform="translate(40 295) scale(0.66667)" d="m5 12 5 5 9-10" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="308" font-size="14" font-weight="600" fill="#1E5A32">Done · slides and locks</text><text x="40" y="328" font-size="12" font-weight="600" fill="#555A66">Photo · After adjustment · 10:15</text><g transform="translate(286 270)"><rect width="64" height="64" rx="12" fill="#DDF3E4"/><path d="M0 50h64v2a12 12 0 0 1-12 12H12A12 12 0 0 1 0 52z" fill="#DED8CB"/><rect x="13" y="10" width="38" height="40" fill="#FFFFFF" stroke="#15171C" stroke-width="2" stroke-linejoin="round"/><path d="M32 10v40M26 28v6" stroke="#15171C" stroke-width="2" stroke-linecap="round"/><rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="#DED8CB"/></g><path d="M40 346.5h310" stroke="#DED8CB"/><text x="40" y="370" font-size="17" font-weight="700" fill="#15171C">Replace the rollers</text><path transform="translate(40 379) scale(0.66667)" d="m5 12 5 5 9-10" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="392" font-size="14" font-weight="600" fill="#1E5A32">Done · 2 new rollers fitted</text><text x="40" y="412" font-size="12" font-weight="600" fill="#555A66">Photo · Old rollers out · 09:36</text><g transform="translate(286 354)"><rect width="64" height="64" rx="12" fill="#DDEBFF"/><path d="M0 44h64v8a12 12 0 0 1-12 12H12A12 12 0 0 1 0 52z" fill="#DED8CB"/><path d="M6 44h52" stroke="#15171C" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="33" r="8" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><circle cx="22" cy="33" r="2" fill="#15171C"/><circle cx="43" cy="35" r="6" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><circle cx="43" cy="35" r="1.5" fill="#15171C"/><rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="#DED8CB"/></g><path d="M40 430.5h310" stroke="#DED8CB"/><text x="40" y="454" font-size="17" font-weight="700" fill="#15171C">Glass replacement</text><path transform="translate(40 463) scale(0.66667)" d="M6 12h12" fill="none" stroke="#555A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="476" font-size="14" font-weight="600" fill="#555A66">Not included in quote v1</text><text x="40" y="518" font-size="12" font-weight="600" fill="#555A66">Original · Español · the provider’s words</text><text x="40" y="542" font-size="16" font-weight="400" fill="#15171C">Ajustar la puerta de la terraza y</text><text x="40" y="566" font-size="16" font-weight="400" fill="#15171C">sustituir los rodillos. No incluye la</text><text x="40" y="590" font-size="16" font-weight="400" fill="#15171C">sustitución del vidrio.</text></g><text x="20" y="638" font-size="14" font-weight="500" fill="#555A66">Something not right?</text><text x="167" y="638" font-size="14" font-weight="700" fill="#2438B5" text-decoration="underline">Report a problem</text><g><rect y="692" width="390" height="152" fill="#FFFFFF"/><path d="M0 692.5h390" stroke="#DED8CB"/><text x="195" y="718" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Signing off accepts the work. It is not payment.</text><rect x="20" y="738" width="350" height="56" rx="28" fill="#15171C"/><text x="195" y="772" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign off the work</text></g></g>
