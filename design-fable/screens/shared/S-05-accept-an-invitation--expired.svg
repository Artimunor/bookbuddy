<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-05-accept-an-invitation--expired-title S-05-accept-an-invitation--expired-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-05-accept-an-invitation--expired-title">S-05 Accept an invitation — expired</title>
  <desc id="S-05-accept-an-invitation--expired-desc">Diego Torres, signed in as diego@example.com, opens a crew invitation after it ran out. The page says the invitation expired on Saturday 21 November and nothing changed on his account. A card names the sender, Mateo Ruiz at Reformas Ruiz, sent Saturday 14 November, and says only the person who invited him can send a new one. A link opens help with access. There is nothing to accept or decline. One action: Done.</desc>
