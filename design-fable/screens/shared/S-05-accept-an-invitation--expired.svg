    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Signed in as diego@example.com</text>
    
  </g>
  <g id="content">
    <rect x="20" y="124" width="196" height="32" rx="16" fill="#ECE8DE"/>
    <path transform="translate(30 130) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 2" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="145" font-size="12" font-weight="600" fill="#15171C">Expired · Sat, 21 Nov</text>
    <text x="20" y="204" font-size="28" font-weight="800" fill="#15171C">This invitation</text>
    <text x="20" y="238" font-size="28" font-weight="800" fill="#15171C">has expired</text>
    <text x="20" y="270" font-size="16" font-weight="400" fill="#15171C">It ran out on Sat, 21 Nov. Nothing</text>
    <text x="20" y="294" font-size="16" font-weight="400" fill="#15171C">changed on your account.</text>
    <rect x="20.5" y="320.5" width="349" height="147" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <circle cx="60" cy="360" r="20" fill="#DDEBFF"/><text x="60" y="365" font-size="14" font-weight="700" fill="#15171C" text-anchor="middle">MR</text>
    <text x="92" y="356" font-size="17" font-weight="700" fill="#15171C">Mateo Ruiz</text>
    <text x="92" y="376" font-size="14" font-weight="500" fill="#555A66">Reformas Ruiz · sent Sat, 14 Nov</text>
