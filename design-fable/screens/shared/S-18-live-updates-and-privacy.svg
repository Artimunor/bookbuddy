<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-18-live-updates-and-privacy-title S-18-live-updates-and-privacy-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-18-live-updates-and-privacy-title">S-18 Live updates and privacy — customer, details hidden by default</title>
  <desc id="S-18-live-updates-and-privacy-desc">Claire tapped Follow live in C-09 at 07:58 UK time on Tuesday 24 November. Hide details is still on, the default for this iPhone. Her visit card shows only BookBuddy visit and On the way. It shows no provider, job title, reference, arrival estimate or photo. Stop following ends the card, not the booking. In the app Claire can see crew-level stamps, the shared estimate, confirmed crew names and shared photos. No location is collected.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">7:58</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Live updates and privacy</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Claire Martin · this iPhone</text></g>
  <text x="20" y="134" font-size="14" font-weight="600" fill="#15171C">Lock Screen preview · details hidden</text>
  <g id="lock-screen-preview"><rect x="20" y="146" width="350" height="132" rx="28" fill="#15171C"/>
  <circle cx="46" cy="172" r="9" fill="none" stroke="#D6F33C" stroke-width="1.5"/><circle cx="46" cy="172" r="5" fill="#D6F33C"/>
  <text x="64" y="177" font-size="14" font-weight="600" fill="#F6F3EC">BookBuddy visit</text>
  <text x="40" y="224" font-size="28" font-weight="800" fill="#F6F3EC">On the way</text>
  <path transform="translate(40 242) scale(0.8333)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#B1B5C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="257" font-size="14" font-weight="500" fill="#B1B5C0">Unlock to open visit</text></g>
  <text x="20" y="300" font-size="14" font-weight="500" fill="#555A66">Following since 07:58 your time. Stops when the</text><text x="20" y="320" font-size="14" font-weight="500" fill="#555A66">visit is finished or after 8 hours.</text><text x="370" y="320" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end" text-decoration="underline">Stop following</text>
  <g id="this-phone"><rect x="20.5" y="338.5" width="349" height="203" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <text x="40" y="368" font-size="17" font-weight="700" fill="#15171C">Lock Screen visit card</text><text x="40" y="390" font-size="14" font-weight="500" fill="#555A66">Starts when you tap Follow live</text><rect x="294" y="356" width="56" height="32" rx="16" fill="#15171C"/><circle cx="334" cy="372" r="12" fill="#FFFFFF"/><path d="M40 406.5H350" stroke="#DED8CB"/>
  <text x="40" y="436" font-size="17" font-weight="700" fill="#15171C">Hide details</text><text x="40" y="458" font-size="14" font-weight="500" fill="#555A66">On by default · stage only</text><rect x="294" y="424" width="56" height="32" rx="16" fill="#15171C"/><circle cx="334" cy="440" r="12" fill="#FFFFFF"/><path d="M40 474.5H350" stroke="#DED8CB"/>
  <text x="40" y="504" font-size="17" font-weight="700" fill="#15171C">Notifications</text><text x="40" y="526" font-size="14" font-weight="500" fill="#555A66">Allowed · quotes, changes, messages</text><path transform="translate(326 496)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="20" y="578" font-size="20" font-weight="700" fill="#15171C">What the crew shares with you</text>
  <g id="shared-with-you"><rect x="20.5" y="592.5" width="349" height="131" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <path transform="translate(40 606) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="620" font-size="14" font-weight="500" fill="#15171C">Crew status, when a person confirms it</text>
  <path transform="translate(40 632) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="646" font-size="14" font-weight="500" fill="#15171C">An arrival estimate the crew chose to share</text>
  <path transform="translate(40 658) scale(0.75)" d="m5 12 5 5 9-10" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="672" font-size="14" font-weight="500" fill="#15171C">Names of confirmed crew, shared photos</text>
  <path transform="translate(40 684) scale(0.75)" d="M6 6l12 12M18 6 6 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="698" font-size="14" font-weight="500" fill="#15171C">Never a map, a route or anyone’s position</text></g>
  <g id="no-location"><rect x="20" y="736" width="350" height="64" rx="24" fill="#E1F3E4"/><path transform="translate(36 756)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM4 4l16 16" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="764" font-size="17" font-weight="700" fill="#1E5A32">No location is collected</text><text x="72" y="784" font-size="14" font-weight="500" fill="#1E5A32">Not yours, and not the crew’s.</text></g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
