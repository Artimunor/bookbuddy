<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-11-safety-instruction--acknowledged-title S-11-safety-instruction--acknowledged-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-11-safety-instruction--acknowledged-title">S-11 Safety instruction — acknowledged, hold cleared</title>
  <desc id="S-11-safety-instruction--acknowledged-desc">Worker view for Diego Torres at 09:17 Spain time on Tuesday 24 November, Field mode on. A green banner says Hold cleared at 09:17 Spain time: he acknowledged version 2 and Mateo can now start work. The instruction stays readable, English on top and Mateo's Spanish original beneath. The record shows Teach-back verified by Mateo Ruiz at 09:16, spoken in Español, and Acknowledged by you at 09:17, version 2, confirmed by the server. The dock says a new version would need a new acknowledgement. One action: Back to your shift.</desc>
