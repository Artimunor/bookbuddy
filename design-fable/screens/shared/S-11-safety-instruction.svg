  <g id="hold-banner"><rect x="20" y="114" width="350" height="92" rx="24" fill="#FFEFCF"/><path transform="translate(36 130)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="144" font-size="17" font-weight="700" fill="#6E4300">Safety hold</text><text x="70" y="166" font-size="14" font-weight="500" fill="#6E4300">Work can’t start until you acknowledge</text><text x="70" y="186" font-size="14" font-weight="500" fill="#6E4300">version 2. Your 09:14 check-in stands.</text></g>
  <g id="instruction-twin-card"><rect x="20.5" y="218.5" width="349" height="282" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><path d="M21 388h348v88.5a24 24 0 0 1-24 24H45a24 24 0 0 1-24-24z" fill="#ECE8DE"/><rect x="20.5" y="218.5" width="349" height="282" rx="24" fill="none" stroke="#DED8CB"/>
  <text x="40" y="247" font-size="14" font-weight="600" fill="#15171C">For Diego Torres</text><rect x="196" y="228" width="154" height="28" rx="14" fill="#E3EEFB"/><path transform="translate(204 234) scale(0.6667)" d="m5 12 5 5 9-10" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="247" font-size="12" font-weight="600" fill="#1E4A7D">Version 2 · current</text>
  <text x="40" y="270" font-size="14" font-weight="500" fill="#555A66">Issued by Mateo Ruiz · 08:41 Spain time</text>
  <text x="40" y="300" font-size="12" font-weight="600" fill="#1E4A7D">Translation · English</text><text x="40" y="324" font-size="16" font-weight="400" fill="#15171C">Do not use the terrace door until</text><text x="40" y="348" font-size="16" font-weight="400" fill="#15171C">Mateo clears it. Keep the doorway</text><text x="40" y="372" font-size="16" font-weight="400" fill="#15171C">taped off while the rollers are out.</text>
  <text x="40" y="410" font-size="12" font-weight="600" fill="#555A66">Original · Español · Mateo’s words</text><text x="40" y="434" font-size="16" font-weight="400" fill="#15171C">No uses la puerta de la terraza hasta</text><text x="40" y="458" font-size="16" font-weight="400" fill="#15171C">que Mateo lo autorice. Mantén el paso</text><text x="40" y="482" font-size="16" font-weight="400" fill="#15171C">acordonado mientras no haya rodillos.</text></g>
