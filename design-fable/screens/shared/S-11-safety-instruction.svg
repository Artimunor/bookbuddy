<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="S-11-safety-instruction-title S-11-safety-instruction-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="S-11-safety-instruction-title">S-11 Safety instruction — ready to acknowledge</title>
  <desc id="S-11-safety-instruction-desc">Worker view for Diego Torres at 09:16 Spain time on Tuesday 24 November, Field mode on. A safety hold banner says work cannot start until he acknowledges version 2 and that his 09:14 check-in stands. The instruction for Diego Torres, version 2, current, was issued by Mateo Ruiz at 08:41 Spain time. The English translation is on top: Do not use the terrace door until Mateo clears it. Keep the doorway taped off while the rollers are out. Mateo's exact Spanish original is attached beneath. The record shows two steps: Teach-back verified by Mateo Ruiz at 09:16, spoken in Español, and Your acknowledgement, needed online for version 2. A link offers Not clear? Ask Mateo privately. The dock says it records his name, version 2 and the time. One action: Acknowledge version 2.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:16</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
