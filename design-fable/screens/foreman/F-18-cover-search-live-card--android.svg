  <title id="F-18-cover-search-live-card-android-title">F-18 Cover search live card — Android ongoing notification, expanded</title>
  <desc id="F-18-cover-search-live-card-android-desc">System surface on Mateo Ruiz’s Android phone at 08:36 Spain time on Tuesday 24 November: the notification shade with the expanded ongoing notification for the cover search. From BookBuddy, now: Cover search, offers out, 6 minutes left; reply by 08:42; two people asked and no reply yet; a four-point progress bar at step two; BB-1042, visit 09:00 to 10:00 Spain time; sent by Mateo at 08:33, and he confirms in the app. Two actions open the app and change nothing by themselves: Open search and Crew chat. No worker name, address or price is shown.</desc>
