<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-03-new-job-title F-03-new-job-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-03-new-job-title">F-03 New job — new request</title>
  <desc id="F-03-new-job-desc">Foreman view for Mateo Ruiz at Reformas Ruiz on Monday 23 November, before he accepts at 08:10 Spain time. New job BB-1042 at Villa Mar in Xàbia. A language line says Mateo reads Español and Claire writes English. The request from Claire Martin, sent Monday 08:05, is a twin card: the Spanish translation on top and her English original beneath: “The terrace door sticks when I close it and no longer slides smoothly. It has got worse over the last month.” Below: one photo of the terrace door from Claire, and the place, Villa Mar in Xàbia, whose address opens when he accepts. A link lets him decline or pass the job back. Offered by Reformas Ruiz. Dock: accepting makes him Claire’s named foreman; actions Ask Claire and Accept job.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
