  <g id="language-line">
  <rect x="20" y="114" width="350" height="36" rx="18" fill="#ECE8DE"/><path transform="translate(32 122) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="137" font-size="14" font-weight="600" fill="#15171C">You read Español · Claire writes English</text>
  </g>
  <g id="request-twin-card">
  <rect x="20.5" y="162.5" width="349" height="249" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
  <path d="M21 302h348v86a24 24 0 0 1-24 24H45a24 24 0 0 1-24-24z" fill="#ECE8DE"/>
  <rect x="20.5" y="162.5" width="349" height="249" rx="24" fill="none" stroke="#DED8CB"/>
  <text x="40" y="192" font-size="17" font-weight="700" fill="#15171C">Request from Claire Martin</text>
  <text x="350" y="192" font-size="14" font-weight="600" fill="#555A66" text-anchor="end">Mon 08:05</text>
  <text x="40" y="216" font-size="12" font-weight="600" fill="#1E4A7D">Translation · Español</text>
  <text x="40" y="240" font-size="16" font-weight="400" fill="#15171C">La puerta de la terraza se atasca al</text>
  <text x="40" y="264" font-size="16" font-weight="400" fill="#15171C">cerrarla y ya no se desliza bien. Ha</text>
  <text x="40" y="288" font-size="16" font-weight="400" fill="#15171C">empeorado durante el último mes.</text>
  <text x="40" y="326" font-size="12" font-weight="600" fill="#555A66">Original · English · Claire’s words</text>
  <text x="40" y="350" font-size="16" font-weight="400" fill="#15171C">The terrace door sticks when I close</text>
  <text x="40" y="374" font-size="16" font-weight="400" fill="#15171C">it and no longer slides smoothly. It</text>
  <text x="40" y="398" font-size="16" font-weight="400" fill="#15171C">has got worse over the last month.</text>
  </g>
