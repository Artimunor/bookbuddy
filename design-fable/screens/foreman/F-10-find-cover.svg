<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-10-find-cover-title F-10-find-cover-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-10-find-cover-title">F-10 Find cover — crew offers out</title>
  <desc id="F-10-find-cover-desc">Foreman view for Mateo Ruiz at 08:36 Spain time on Tuesday 24 November, running a live cover search for BB-1042 Terrace door repair after Nadia Benali said she can’t make it. The live capsule says offers are out, reply by 08:42 Spain time, six minutes left on the offer clock, and the visit starts in 24 minutes; the cover line is at step two of four, Offers out. Claire sees Cover being arranged: she was told at 08:34 and Mateo promised an update by 08:45. The cover ladder has two rungs. Rung one, Your crew, is live: Diego Torres opened the offer at 08:35 and Lucía Ortega was offered at 08:33; neither has replied. Rung two, Propose a new visit, is locked and opens at 08:42 if nobody accepts. A link withdraws the offers. The dock action Confirm cover is disabled because nobody has accepted yet.</desc>
