  <title id="F-12-confirm-cover-title">F-12 Confirm cover — ready</title>
  <desc id="F-12-confirm-cover-desc">Foreman view for Mateo Ruiz at 08:38 Spain time on Tuesday 24 November: the Confirm cover sheet over the dimmed Find cover screen for BB-1042, visit Tuesday 24 November, 09:00 to 10:00 Spain time. The one accepted candidate from his own crew is Diego Torres, door fitting, Español: accepted 08:38, slot held to 08:43. Rechecks, results only: eligible to 31 December 2026; free 08:00 to 10:30, before his next shift at 10:30; the gap is still open and needs one door fitter. They were checked at 08:38 and are checked again when he confirms. When he confirms: Claire sees Crew updated, Diego Torres joins, same window; Lucía Ortega’s offer closes as filled; Diego needs his own safety briefing before work. Close changes nothing and Diego keeps the slot until 08:43. One lime action in the sheet: Confirm Diego Torres; Diego can travel once it is confirmed.</desc>
