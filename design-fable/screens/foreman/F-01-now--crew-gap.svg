  <title id="F-01-now-crew-gap-title">F-01 Now — crew gap</title>
  <desc id="F-01-now-crew-gap-desc">Foreman view for Mateo Ruiz at Reformas Ruiz at 08:32 Spain time on Tuesday 24 November. A critical gap card comes first: Nadia Benali can’t make it, reported 08:32; door fitting; the visit starts in 28 minutes; it is still booked and Claire has not been told. Below, the capsule for BB-1042 Terrace door repair at Villa Mar in Xàbia is quiet: Crew gap, visit 09:00 to 10:00 Spain time, the first bead of the day line is an open ring, Mateo is confirmed and Nadia is out, one door fitter is needed for the same window. Nothing is lime because nothing is live. One action: Find cover.</desc>
