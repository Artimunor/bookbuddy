  <desc id="F-05-job-control-desc">Foreman view for Mateo Ruiz at 09:21 Spain time on Tuesday 24 November, running BB-1042 Terrace door repair at Villa Mar in Xàbia for Claire Martin. Today is selected in the Today and Whole job switch. The live capsule says Working since 09:18 Spain time, window 09:00 to 10:00, two on site, day line at step four of five; Claire sees Working and crew on site 09:14. A share row says Claire last heard at 09:18, with a preview link. Per-worker crew: Diego Torres, on site, checked in 09:14, briefed on version 2; Mateo Ruiz, foreman, leading the visit. Shortcuts: Site log, Chat, Change, Wrap up. One lime action: Share an update.</desc>
