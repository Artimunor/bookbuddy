  <title id="F-18-cover-search-live-card-island-compact-title">F-18 Cover search live card — Dynamic Island, compact</title>
  <desc id="F-18-cover-search-live-card-island-compact-desc">System surface on Mateo Ruiz’s iPhone Home Screen at 08:36 Spain time on Tuesday 24 November. The Dynamic Island shows the compact cover search activity: a lime crew glyph on the leading side and the countdown 6 min to the reply deadline on the trailing side. Tapping opens Find cover; touching and holding expands the island. Details allowed separately in S-18.</desc>
