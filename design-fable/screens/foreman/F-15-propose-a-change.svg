<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-15-propose-a-change-title F-15-propose-a-change-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-15-propose-a-change-title">F-15 Propose a change — draft</title>
  <desc id="F-15-propose-a-change-desc">Separate branch. Foreman view for Mateo Ruiz at 09:41 Spain time on Tuesday 24 November, drafting a change to BB-1042 Terrace door repair. The approved text of quote version 1, €240.00, is locked and shown in his exact Spanish words: Ajustar la puerta de la terraza y sustituir los rodillos. No incluye la sustitución del vidrio. It was approved by Claire Martin on Monday at 08:20 and is never altered. The addition is a draft in his words, with an Edit link: Sustituir también el carril inferior desgastado; the preview shows what Claire reads in English: Also replace the worn bottom track. One photo from Diego at 09:31 is attached. Addition plus €40.00; new total €280.00; same visit, about 30 minutes longer. On hold until Claire decides: the bottom track only; the approved work carries on as agreed. One action: Send for approval; Claire Martin decides as named approver.</desc>
