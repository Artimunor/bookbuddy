<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-16-shift-detail-title F-16-shift-detail-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-16-shift-detail-title">F-16 Shift detail — covered</title>
  <desc id="F-16-shift-detail-desc">Foreman view for Mateo Ruiz at 08:41 Spain time on Tuesday 24 November. The shift for BB-1042 Terrace door repair is covered: 09:00 to 10:00 Spain time at Villa Mar in Xàbia, starting in 19 minutes; terrace door adjustment, one door fitter, briefing in Español. Per-worker crew, visible only to the foreman: Diego Torres, cover, confirmed by Mateo at 08:40, briefing due; Mateo Ruiz, foreman, leading the visit; Nadia Benali, out, told Mateo at 08:32, reason transport. A safety hold applies to Diego Torres: instruction version 2, brief him on site and verify his teach-back; work waits until then. A strip says the crew update was published at 08:40 and opens the site log, which lists every stamp and who sees it. Actions: a crew chat button and one lime action, Share an update.</desc>
