  <title id="F-06-schedule-title">F-06 Schedule — proposal</title>
  <desc id="F-06-schedule-desc">Foreman view for Mateo Ruiz on Monday 23 November, after Claire approved quote version 1 at 08:20 Spain time: no visit is agreed yet for BB-1042 Terrace door repair. A week strip for November 2026 in Spain time marks today, Monday 23, selects Tuesday 24 and dots the days with proposed windows. The day view for Tuesday 24 November shows three eligible door fitters, Nadia Benali, Diego Torres and Lucía Ortega, as lanes from 08:00 to 18:00 with their busy blocks, and the proposed windows 09:00 to 10:00 and 15:00 to 16:00 as bands. Windows to propose: Tuesday 24 November 09:00 to 10:00, three free; Tuesday 15:00 to 16:00, two free; Wednesday 25 November 09:00 to 10:00, three free. Add a window. Claire sees her own time too. Dock: Claire picks one and nothing is booked until then; action Send 3 windows to Claire.</desc>
