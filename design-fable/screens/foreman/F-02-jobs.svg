  <title id="F-02-jobs-title">F-02 Jobs — active</title>
  <desc id="F-02-jobs-desc">Foreman view for Mateo Ruiz at Reformas Ruiz at 08:58 Spain time on Tuesday 24 November. The Jobs tab shows stage segments Incoming with one job, Active selected, and Past. Three booking cards each show the title, reference, place, a mini journey line, the stage as text and the next step: BB-1042 Terrace door repair at Villa Mar in Xàbia for Claire Martin, Visit, on the way, arriving 09:10 to 09:20, crew of two; BB-1045 Kitchen shutter repair at Apartamento Sol, Quoted, step 2 of 6, quote version 1 for €180.00 waiting for the approver; BB-1038 Bathroom tap replacement at Casa Pinar, Signed off, step 5 of 6, bill for €95.00 sent and not recorded as paid. A live pill above the tab bar says On the way, 09:10 to 09:20.</desc>
