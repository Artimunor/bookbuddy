  <title id="F-09-crew-member-title">F-09 Crew member — available</title>
  <desc id="F-09-crew-member-desc">Foreman view for Mateo Ruiz at 08:33 Spain time on Tuesday 24 November, opened from Find cover to check a candidate. Diego Torres, own crew at Reformas Ruiz: door fitting, works in Español, open to cover today to 18:00. Fit for today’s cover on BB-1042, 09:00 to 10:00 Spain time, is Available, with four checks: the skill the shift needs, door fitting; the briefing language, Español, which he works in; free 08:00 to 10:30, with his next shift at 10:30; eligible to 31 December 2026, checked today at 08:33, result only. A row opens the crew-only chat with Diego, who writes Español. Mateo sees results of checks, never documents. Dock: selecting sends nothing and offers are sent next; action Select for cover.</desc>
