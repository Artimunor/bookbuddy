  <title id="F-18-cover-search-live-card-title">F-18 Cover search live card — Lock Screen, offers out</title>
  <desc id="F-18-cover-search-live-card-desc">System surface on Mateo Ruiz’s iPhone Lock Screen at 08:36 Spain time on Tuesday 24 November. A dark Live Activity card for the cover search on BB-1042 says Offers out, 6 minutes left; the cover line is at step two of four; reply by 08:42; two people asked and no reply yet; the visit is 09:00 to 10:00 Spain time and the offers were sent at 08:33. No worker name, address, price or message text is shown. Tapping opens Find cover after unlock; nothing can be confirmed from the Lock Screen. Details allowed separately in S-18.</desc>
