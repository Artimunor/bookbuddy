<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-03-new-job-reassignment-title F-03-new-job-reassignment-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-03-new-job-reassignment-title">F-03 New job — reassignment</title>
  <desc id="F-03-new-job-reassignment-desc">Foreman view for Mateo Ruiz at Reformas Ruiz on Monday 23 November. Reformas Ruiz asks him to take over BB-1031 Pergola post repair at Casa Llum in Xàbia from the foreman Inés Vidal; reply by Tuesday 24 November, 18:00 Spain time. The handoff card shows Inés Vidal, foreman until he accepts, and Mateo Ruiz, named foreman if he accepts. The job is Booked, step 3 of 6, with the visit on Thursday 26 November, 10:00 to 11:30 Spain time. What stays as it is: quote version 1 for €380.00, approved; the visit window and booked time; the crew, Lucía Ortega, confirmed. Dock: Inés stays accountable until he accepts; actions Decline and Take over job.</desc>
