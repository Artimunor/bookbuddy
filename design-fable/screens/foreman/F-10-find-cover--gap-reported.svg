<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-10-find-cover-gap-reported-title F-10-find-cover-gap-reported-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-10-find-cover-gap-reported-title">F-10 Find cover — gap</title>
  <desc id="F-10-find-cover-gap-reported-desc">Foreman view for Mateo Ruiz at 08:32 Spain time on Tuesday 24 November, just after Nadia Benali reported she can’t make the visit for BB-1042 Terrace door repair. The capsule is quiet, nothing is lit: Crew gap, visit starts 09:00 Spain time, in 28 minutes; the cover line is at step one of four, Gap. Claire has not been told and the visit is still booked. The cover ladder has two rungs. Rung one, Your crew: two can cover, Diego Torres and Lucía Ortega, both free and open to cover to 18:00, both ticked; Pau Soler can’t be asked because his review is pending. Rung two, Propose a new visit, is locked and used only if nobody in the crew can cover. One lime action: Send 2 offers, reply by 08:42; the first to accept holds the slot.</desc>
