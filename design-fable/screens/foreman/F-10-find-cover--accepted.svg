<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-10-find-cover-accepted-title F-10-find-cover-accepted-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-10-find-cover-accepted-title">F-10 Find cover — accepted, confirm</title>
  <desc id="F-10-find-cover-accepted-desc">Foreman view for Mateo Ruiz at 08:38 Spain time on Tuesday 24 November. Diego Torres accepted the cover offer for BB-1042 Terrace door repair at 08:38. The live capsule says Diego accepted, confirm by 08:43 Spain time, five minutes left; the slot is held and nobody is assigned yet; the cover line is at step three of four, Accepted. Claire still sees Cover being arranged, with an update promised by 08:45. In the cover ladder, rung one, Your crew, shows one accepted: Diego Torres, accepted 08:38, slot held, not travelling yet; Lucía Ortega’s offer is on hold while Mateo confirms. Rung two, Propose a new visit, stays locked unless this cover falls through. One lime action: Review and confirm Diego, which opens the Confirm cover sheet.</desc>
