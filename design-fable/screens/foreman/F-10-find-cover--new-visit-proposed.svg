  <title id="F-10-find-cover-new-visit-proposed-title">F-10 Find cover — new visit proposed</title>
  <desc id="F-10-find-cover-new-visit-proposed-desc">Alternative branch. Foreman view for Mateo Ruiz at 08:44 Spain time on Tuesday 24 November, after he proposed a new visit because nobody in his crew could cover BB-1042 Terrace door repair. The cover search is closed and the capsule is quiet: proposed, waiting for Claire, 09:00 to 10:00 on Wednesday 25 November Spain time, sent 08:44; today’s visit is off; the cover line is at step four of four, New visit proposed. Claire sees New visit proposed and is free to accept or change it. The ladder is a record: rung one, Your crew, nobody can cover, Diego Torres declined 08:39, Lucía Ortega no reply by 08:42; rung two, New visit proposed at 08:44 for Wednesday 25 November 09:00 to 10:00, waiting for Claire, no crew assigned yet. One action: Message Claire.</desc>
