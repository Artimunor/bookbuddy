  <title id="F-17-share-an-update-photo-title">F-17 Share an update — photo</title>
  <desc id="F-17-share-an-update-photo-desc">Foreman view for Mateo Ruiz at 09:36 Spain time on Tuesday 24 November: the Share an update sheet over the dimmed job control screen for BB-1042, addressed to Claire Martin, with Photo selected among On the way, Running late, Paused and Photo. The photo, taken at 09:35, shows the old rollers on the door track, with a Retake link and his caption in Spanish, Rodillos viejos retirados, which Claire reads in English. A preview shows the stamp Claire will see in Moments: Photo shared, 09:36, Mateo Ruiz, foreman, Old rollers out, marked as an English translation, with the thumbnail. A reminder says to check first that there are no people and no house number; she can open it with his original caption. One lime action in the sheet: Share photo, which goes to her Moments and the job chat.</desc>
