<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-10-find-cover-no-cover-new-visit-title F-10-find-cover-no-cover-new-visit-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-10-find-cover-no-cover-new-visit-title">F-10 Find cover — no cover, propose a new visit</title>
  <desc id="F-10-find-cover-no-cover-new-visit-desc">Alternative branch. Foreman view for Mateo Ruiz at 08:42 Spain time on Tuesday 24 November. Nobody in his own crew accepted cover for BB-1042 Terrace door repair. The capsule is quiet: offers closed 08:42, No cover, visit starts in 18 minutes; the cover line is at step three of four, No cover, with New visit next. An attention strip says Claire is waiting for the update Mateo promised by 08:45, three minutes left. In the cover ladder, rung one, Your crew, is exhausted: Diego Torres declined at 08:39 and Lucía Ortega did not reply before her offer closed at 08:42. Rung two, Propose a new visit, is now open: the earliest time the crew is free is Wednesday 25 November, 09:00 to 10:00. There is no outside pool at launch. One action: Propose a new visit, which opens Schedule.</desc>
