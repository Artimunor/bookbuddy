<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-11-vetted-pool-title F-11-vetted-pool-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-11-vetted-pool-title">F-11 Vetted pool — later capability, matches</title>
  <desc id="F-11-vetted-pool-desc">Later capability, not in the launch release and with no launch navigation; it stays off until a compliant route is confirmed. Foreman view for Mateo Ruiz at 08:42 Spain time on Tuesday 24 November in a later release, after nobody in his own crew could cover BB-1042 Terrace door repair. A header badge reads Later. A three-step ladder strip shows Your crew, none; Vetted pool, the current rung; and New visit as the last rung. Every match must have door fitting, an Español briefing, be free 09:00 to 10:00, be in the Xàbia area, be eligible today and come through an approved provider. Two matches are ticked: Alba Navarro, door fitting, Español and English, approved provider, Xàbia area; Óscar Ferrer, door fitting, Español, approved provider, Xàbia area. Reply by 08:50 Spain time, with a Change link. Reformas Ruiz stays accountable to Claire and Mateo still confirms one person. One lime action: Send 2 pool offers; the first to accept holds the slot.</desc>
