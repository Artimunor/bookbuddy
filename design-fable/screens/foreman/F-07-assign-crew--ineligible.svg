<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-07-assign-crew-ineligible-title F-07-assign-crew-ineligible-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-07-assign-crew-ineligible-title">F-07 Assign crew — ineligible worker</title>
  <desc id="F-07-assign-crew-ineligible-desc">Foreman view for Mateo Ruiz on Monday 23 November: the Assign crew sheet over the dimmed job control screen for BB-1042, visit Tuesday 24 November, 09:00 to 10:00 Spain time, needing one door fitter with the briefing in Español. The Not eligible filter, one person, is selected. Pau Soler, door fitting, Català and Español, is not eligible yet: his review is pending and he cannot be selected. A card explains why: BookBuddy’s local team is still checking his eligibility; the foreman sees the result, not the documents, and it cannot be overridden here. Links open Pau’s crew page and ask about the review. The Send assignment action is disabled; the dock says to choose an eligible worker to send.</desc>
