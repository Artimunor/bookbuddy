<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-07-assign-crew-title F-07-assign-crew-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-07-assign-crew-title">F-07 Assign crew — eligible worker selected</title>
  <desc id="F-07-assign-crew-desc">Foreman view for Mateo Ruiz on Monday 23 November: the Assign crew sheet over the dimmed job control screen for BB-1042, visit Tuesday 24 November, 09:00 to 10:00 Spain time. The shift needs one door fitter with the briefing in Español. The Eligible filter, three people, is selected; Not eligible has one. Worker cards from his own crew: Nadia Benali, door fitting, Español and English, free, eligible to 31 March 2027, selected; Diego Torres, door fitting, Español, free, eligible to 31 December 2026; Lucía Ortega, door fitting, Español, free, eligible to 30 June 2027. Only his own crew is listed, and Nadia is on the visit only after she confirms. Close is at the top. One lime action in the sheet: Send to Nadia, which sends a named assignment to confirm.</desc>
