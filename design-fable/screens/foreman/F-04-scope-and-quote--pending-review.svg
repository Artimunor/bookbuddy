  <title id="F-04-scope-and-quote-pending-review-title">F-04 Scope and quote — pending business review</title>
  <desc id="F-04-scope-and-quote-pending-review-desc">Foreman view for Mateo Ruiz at Reformas Ruiz on Monday 23 November: quote version 1 for BB-1042 Terrace door repair is waiting for business review, sent to Reformas Ruiz on Monday at 08:13 Spain time. Claire has not received it. The scope is locked in review: his Español words and the English preview Claire will read are shown unchanged. Lines: Mano de obra, Labour, €160.00; Rodillos, Rollers, €80.00; total €240.00 in EUR. A link withdraws the quote from review to edit it. The Send to Claire action is disabled; the dock says Reformas Ruiz must review before sending.</desc>
