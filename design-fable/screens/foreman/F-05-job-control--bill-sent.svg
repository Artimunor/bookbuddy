  <g id="view-switch"><rect x="20.5" y="116.5" width="83" height="39" rx="19.5" fill="#FFFFFF" stroke="#747986"/><text x="62" y="141" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Today</text><rect x="112" y="116" width="130" height="40" rx="20" fill="#15171C"/><path d="m128 136 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="141" font-size="14" font-weight="700" fill="#FFFFFF">Whole job</text></g>
