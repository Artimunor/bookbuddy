<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-05-job-control-bill-sent-title F-05-job-control-bill-sent-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-05-job-control-bill-sent-title">F-05 Job control — bill sent, not paid</title>
  <desc id="F-05-job-control-bill-sent-desc">Foreman view for Mateo Ruiz at 10:45 Spain time on Tuesday 24 November. BB-1042 Terrace door repair at Villa Mar in Xàbia is at step 5 of 6, Signed off by Claire Martin on Tuesday at 10:40 Spain time; Whole job is selected in the view switch. The bill card says the bill was sent at 10:42 and is not paid yet: Reformas Ruiz bills Claire directly, €240.00, based on the approved quote version 1, paid outside the app. Claire sees the bill too. A note says Mateo is also a Provider admin and can switch role to record the payment. In the Foreman role the Record as paid action is disabled; the dock says only a Provider admin can record “paid”.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">10:45</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
