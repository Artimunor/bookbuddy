  <g id="journey-line"><path d="M62 284H338" stroke="#ECE8DE" stroke-width="6" stroke-linecap="round"/><path d="M62 284H282.8" stroke="#15171C" stroke-width="6" stroke-linecap="round"/><circle cx="62" cy="284" r="10" fill="#15171C"/><path d="m58 284 3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="117.2" cy="284" r="10" fill="#15171C"/><path d="m113.2 284 3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="172.4" cy="284" r="10" fill="#15171C"/><path d="m168.4 284 3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="227.6" cy="284" r="10" fill="#15171C"/><path d="m223.6 284 3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="282.8" cy="284" r="10" fill="#D6F33C" stroke="#15171C" stroke-width="2"/><circle cx="282.8" cy="284" r="3" fill="#15171C"/><circle cx="338" cy="284" r="8" fill="#FFFFFF" stroke="#747986" stroke-width="2"/><text x="282.8" y="316" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">Signed off</text><text x="348" y="316" font-size="12" font-weight="600" fill="#555A66" text-anchor="end">Paid</text></g>
