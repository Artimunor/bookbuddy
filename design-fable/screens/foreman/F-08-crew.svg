  <desc id="F-08-crew-desc">Foreman view for Mateo Ruiz at Reformas Ruiz at 08:58 Spain time on Tuesday 24 November. The Crew tab shows a search field for name, skill or language, filters All selected, Free now and Open to cover, and four worker cards with skills and working languages: Diego Torres, door fitting, Español, on BB-1042 today 09:00 to 10:00; Lucía Ortega, door fitting, Español, free until 11:00 and open to cover; Nadia Benali, door fitting, Español and English, unavailable today, told Mateo at 08:32; Pau Soler, door fitting, Català and Español, eligibility review pending, cannot be assigned. A live pill above the tab bar says On the way, 09:10 to 09:20.</desc>
