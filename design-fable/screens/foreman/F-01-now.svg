<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-01-now-title F-01-now-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-01-now-title">F-01 Now — visit live, crew on the way</title>
  <desc id="F-01-now-desc">Foreman view for Mateo Ruiz at Reformas Ruiz at 08:58 Spain time on Tuesday 24 November. The live capsule for BB-1042 Terrace door repair at Villa Mar in Xàbia says On the way, arriving 09:10 to 09:20 Spain time, day line at step two of five. Per-worker crew dots, visible to the foreman only: Mateo Ruiz, on the way, shared 08:52; Diego Torres, confirmed 08:40, safety briefing due on site. Claire sees the arrival band. Two items need Mateo; the first is shown: brief Diego before work, safety instruction version 2 with teach-back. The second, a job handoff to answer, is further down the list. One lime action: Share an update. Tabs: Now, Jobs, Crew, Messages.</desc>
