<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-16-shift-detail-dropped-title F-16-shift-detail-dropped-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-16-shift-detail-dropped-title">F-16 Shift detail — dropped</title>
  <desc id="F-16-shift-detail-dropped-desc">Foreman view for Mateo Ruiz at 08:32 Spain time on Tuesday 24 November. The shift for BB-1042 Terrace door repair has a crew gap: 09:00 to 10:00 Spain time at Villa Mar in Xàbia, starting in 28 minutes; terrace door adjustment, one door fitter, briefing in Español. Per-worker crew, visible only to the foreman: an open place, door fitter needed, open since 08:32 for the same window; Mateo Ruiz, foreman, leading the visit; Nadia Benali, out, told Mateo at 08:32, reason transport. A note says whoever covers gets their own offer, briefing and attendance. A strip says Claire has not been told and the visit is still booked, and opens the site log. One action: Find cover, starting with his own crew.</desc>
