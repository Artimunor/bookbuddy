<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-17-share-an-update-title F-17-share-an-update-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-17-share-an-update-title">F-17 Share an update — on the way</title>
  <desc id="F-17-share-an-update-desc">Foreman view for Mateo Ruiz at 08:52 Spain time on Tuesday 24 November: the Share an update sheet over the dimmed job control screen for BB-1042, addressed to Claire Martin. Four update types: On the way, selected; Running late; Paused; Photo. The arrival band editor shows his estimate, 09:10 to 09:20 Spain time, 08:10 to 08:20 for Claire, with minus and plus buttons that move it in five-minute steps. A preview shows exactly what Claire sees: a live capsule from Reformas Ruiz, On the way, arriving 09:10 to 09:20, Spain time, 08:10 to 08:20 her time, shared by Mateo at 08:52. No location is shared and Claire sees only this; it can be corrected or retracted afterwards. One lime action in the sheet: Share On the way; Claire sees it at once on her live visit.</desc>
