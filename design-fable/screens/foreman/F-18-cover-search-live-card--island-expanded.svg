  <title id="F-18-cover-search-live-card-island-expanded-title">F-18 Cover search live card — Dynamic Island, expanded, accepted</title>
  <desc id="F-18-cover-search-live-card-island-expanded-desc">System surface on Mateo Ruiz’s iPhone at 08:38 Spain time on Tuesday 24 November after touching and holding the Dynamic Island. The expanded cover search activity for BB-1042 says Cover accepted, 5 minutes left to confirm; the cover line is at step three of four; the slot is held to 08:43 and nobody is assigned yet. One link, Open to confirm, opens the Confirm cover sheet after unlock. Nothing on this surface assigns anyone. Details allowed separately in S-18.</desc>
