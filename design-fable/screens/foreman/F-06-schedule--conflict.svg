<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-06-schedule-conflict-title F-06-schedule-conflict-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-06-schedule-conflict-title">F-06 Schedule — crew capacity conflict</title>
  <desc id="F-06-schedule-conflict-desc">Foreman view for Mateo Ruiz on Monday 23 November, proposing visit windows for BB-1042 Terrace door repair. He has added Tuesday 24 November, 11:00 to 12:00 Spain time. The day view shows none of the three eligible door fitters free at 11:00: the conflict band crosses busy blocks in every lane, while the 09:00 to 10:00 window is clear. A critical card says no crew is free 11:00 to 12:00 because all three door fitters are busy then; it does not name their other jobs. Free alternatives on Tuesday: 09:00 to 10:00 with three free and 15:00 to 16:00 with two free. A link removes the 11:00 window. The Send windows to Claire action is disabled; the dock says to move or remove the 11:00 window to send.</desc>
