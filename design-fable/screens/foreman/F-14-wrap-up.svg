<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="F-14-wrap-up-title F-14-wrap-up-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="F-14-wrap-up-title">F-14 Wrap up — draft ready to submit</title>
  <desc id="F-14-wrap-up-desc">Foreman view for Mateo Ruiz at 10:15 Spain time on Tuesday 24 November, wrapping up BB-1042 Terrace door repair. Work finished at 10:12 and Diego checked out at 10:14. The approved scope of quote version 1, €240.00, is listed in Mateo’s own Spanish words, never altered, as a checklist; each done item has his result note, what Claire reads, and its photo. Ajustar la puerta de la terraza, checked: Desliza y cierra con llave, which Claire reads as slides and locks, with the photo after adjustment. Sustituir los rodillos, checked: 2 rodillos nuevos colocados, which Claire reads as 2 new rollers fitted, with the photo of the old rollers. No incluye la sustitución del vidrio is not in quote version 1 and has nothing to check. Two photos go to Claire, one already shared at 09:36, and a link adds a photo. Bill reference from Reformas Ruiz: RR-0412, €240.00; Claire sees it after she signs off and there is no payment in the app. Claire will see Finished at once. One lime action: Submit completion, which asks Claire to review and sign off.</desc>
