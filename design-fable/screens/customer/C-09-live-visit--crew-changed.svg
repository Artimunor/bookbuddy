  <title id="C-09-live-visit--crew-changed-title">C-09 Live visit — crew changed</title>
  <desc id="C-09-live-visit--crew-changed-desc">Customer view for Claire Martin at 07:41 UK time on Tuesday 24 November, 08:41 Spain time. The capsule says the crew is confirmed again after a crew update: the visit window is 09:00 to 10:00 Spain time, 08:00 to 09:00 her time, unchanged. The day line is at step one of five, Confirmed. Confirmed crew: Mateo Ruiz and Diego Torres, updated by Mateo at 08:40. The earlier crew member and the reason are not shown. She can follow on her Lock Screen. Moments in Spain time: Crew updated at 08:40, Diego Torres joins, same window; Cover being arranged at 08:34. One action: Message Mateo.</desc>
