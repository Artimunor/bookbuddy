  <title id="C-09-live-visit--on-site-title">C-09 Live visit — crew on site</title>
  <desc id="C-09-live-visit--on-site-desc">Customer view for Claire Martin at 08:15 UK time on Tuesday 24 November. The live capsule says the Reformas Ruiz crew is on site at Villa Mar since 09:14 Spain time, 08:14 her time. The check-in is shown at crew level: no person, position or route is named. The day line is at step three of five, On site. Confirmed crew: Mateo Ruiz and Diego Torres. Follow live is already on, so its strip is gone. Moments in Spain time: Crew on site at 09:14, On the way at 08:52, Crew updated at 08:40. One action: Message Mateo.</desc>
