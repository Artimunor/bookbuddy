<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-02-describe-the-job--voice-recorded-title C-02-describe-the-job--voice-recorded-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-02-describe-the-job--voice-recorded-title">C-02 Describe the job — voice recorded</title>
  <desc id="C-02-describe-the-job--voice-recorded-desc">Customer view for Claire Martin, step 1 of 3 of a new request, after recording a voice note through the attach sheet. The typed note is optional and empty. A card shows the voice note, 18 seconds, original English, added to the draft, with Play, a waveform and its English transcript: The terrace door sticks when I close it and no longer slides smoothly. It says to check that it reads right and that both the recording and the transcript are sent, and offers Record again and Remove. She can add a photo. The dock says the voice note is the description; one action: Continue.</desc>
