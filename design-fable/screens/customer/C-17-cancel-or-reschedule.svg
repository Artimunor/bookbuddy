<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-17-cancel-or-reschedule-title C-17-cancel-or-reschedule-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-17-cancel-or-reschedule-title">C-17 Cancel or reschedule sheet — reschedule</title>
  <desc id="C-17-cancel-or-reschedule-desc">Bottom sheet over the dimmed Job home for BB-1042, viewed by Claire Martin on Monday 23 November after the visit was booked. Title: Change this visit. The current window is Tuesday 24 November, 09:00 to 10:00 Spain time, 08:00 to 09:00 her time. A line says there is no fee to reschedule or cancel. Two choices: Reschedule, chosen, pick a new window that Reformas Ruiz agrees; and Cancel the booking, free, the approved quote stays on record. A link says her legal right to withdraw is separate. The dock says her window stays until a new one is agreed. Close is in the sheet header; one action: Choose a new window.</desc>
