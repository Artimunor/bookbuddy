<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-03-place-and-access-title C-03-place-and-access-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-03-place-and-access-title">C-03 Place and access — known place</title>
  <desc id="C-03-place-and-access-desc">Customer view for Claire Martin, step 2 of 3 of a new request. Where is the job: her saved place Villa Mar, 12 Carrer de la Porta Verda, 03730 Xàbia, Spain, a fictional address, marked In the service area, with a Change link. A line says the site runs on Spain time, one hour ahead of her. How does the crew get in: Use the side gate. It is unlocked on the morning of the visit. A note says not to write gate or alarm codes because they are never stored, and to agree them with the foreman. Who will be on site: Nobody is selected; the other choices are Me and Someone else. One action: Review request.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Place and access</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Step 2 of 3 · New request</text></g>
  <text x="20" y="134" font-size="14" font-weight="600" fill="#15171C">Where is the job?</text>
  <g id="place"><rect x="20.5" y="146.5" width="349" height="131" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><rect x="36" y="162" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 168) scale(0.8333)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zm0-12a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="177" font-size="17" font-weight="700" fill="#15171C">Villa Mar</text><text x="350" y="177" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end" text-decoration="underline">Change</text><text x="80" y="199" font-size="14" font-weight="500" fill="#555A66">12 Carrer de la Porta Verda</text><text x="80" y="219" font-size="14" font-weight="500" fill="#555A66">03730 Xàbia, Spain</text><rect x="80" y="232" width="168" height="28" rx="14" fill="#E1F3E4"/><path transform="translate(88 236) scale(0.8333)" d="m5 12 5 5 9-10" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="251" font-size="12" font-weight="600" fill="#1E5A32">In the service area</text></g>
  <path transform="translate(20 285) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 5v4l3 2" fill="none" stroke="#555A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="300" font-size="14" font-weight="500" fill="#555A66">Spain time · one hour ahead of you</text>
  <text x="20" y="336" font-size="14" font-weight="600" fill="#15171C">How does the crew get in?</text>
  <g id="access-note"><rect x="20.5" y="348.5" width="349" height="83" rx="16" fill="#FFFFFF" stroke="#747986"/><text x="40" y="380" font-size="16" font-weight="400" fill="#15171C">Use the side gate. It is unlocked</text><text x="40" y="404" font-size="16" font-weight="400" fill="#15171C">on the morning of the visit.</text></g>
  <path transform="translate(20 439) scale(0.8333)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#555A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="454" font-size="14" font-weight="500" fill="#555A66">No gate or alarm codes here: they are</text><text x="48" y="474" font-size="14" font-weight="500" fill="#555A66">never stored. Agree them with your foreman.</text>
  <text x="20" y="512" font-size="14" font-weight="600" fill="#15171C">Who will be on site?</text>
  <g id="on-site"><rect x="20" y="524" width="112" height="40" rx="20" fill="#15171C"/><path d="m36 544 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="549" font-size="14" font-weight="700" fill="#FFFFFF">Nobody</text><rect x="144.5" y="524.5" width="63" height="39" rx="19.5" fill="#FFFFFF" stroke="#747986"/><text x="176" y="549" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Me</text><rect x="220.5" y="524.5" width="135" height="39" rx="19.5" fill="#FFFFFF" stroke="#747986"/><text x="288" y="549" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Someone else</text></g>
  <text x="20" y="594" font-size="14" font-weight="500" fill="#555A66">The crew lets itself in using your note. You</text><text x="20" y="614" font-size="14" font-weight="500" fill="#555A66">can follow the visit live from anywhere.</text>
  <g id="dock"><rect y="692" width="390" height="152" fill="#FFFFFF"/><path d="M0 692.5h390" stroke="#DED8CB"/><text x="195" y="718" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Next: review and send</text><rect x="20" y="738" width="350" height="56" rx="28" fill="#15171C"/><text x="195" y="772" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Review request</text></g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
