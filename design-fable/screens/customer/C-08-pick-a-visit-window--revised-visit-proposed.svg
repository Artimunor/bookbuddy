<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-08-pick-a-visit-window--revised-visit-proposed-title C-08-pick-a-visit-window--revised-visit-proposed-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-08-pick-a-visit-window--revised-visit-proposed-title">C-08 Pick a visit window — revised visit proposed</title>
  <desc id="C-08-pick-a-visit-window--revised-visit-proposed-desc">Claire Martin at 07:46 UK time on Tuesday 24 November. The agreed visit on Tuesday from 09:00 to 10:00 Spain time, 08:00 to 09:00 her time, is still booked but Reformas Ruiz has no crew available. Mateo Ruiz proposed Wednesday 25 November at the same times at 08:44 Spain time. The proposal is waiting for Claire; the Tuesday booking changes only once her acceptance is confirmed. Quote v1 stays approved at €240.00. She can accept the new visit without a fee, ask for another time or message Mateo.</desc>
