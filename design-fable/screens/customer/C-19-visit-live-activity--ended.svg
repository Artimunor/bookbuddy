  <text x="195" y="124" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">Tuesday, 24 November</text><text x="195" y="216" font-size="96" font-weight="800" fill="#15171C" text-anchor="middle">3:30</text>
