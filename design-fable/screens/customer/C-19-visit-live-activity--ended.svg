<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-19-visit-live-activity--ended-title C-19-visit-live-activity--ended-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-19-visit-live-activity--ended-title">C-19 Visit Live Activity — Lock Screen, ended at 8 hours</title>
  <desc id="C-19-visit-live-activity--ended-desc">System surface on an iPhone Lock Screen at 15:30 UK time on Tuesday 24 November, in a branch with a long visit that is still under way eight hours after the customer tapped Follow live at 07:30. iOS has ended the Live Activity, so the card shows its last content: Live view ended, with the day line held at step four of five, Working, as an open ring. Open the visit for the latest status. Live Activities stop after 8 hours; the visit is not affected and no new activity is started automatically. Tapping opens the Live visit after unlock.</desc>
