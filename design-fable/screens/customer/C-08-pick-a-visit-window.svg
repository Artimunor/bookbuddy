<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-08-pick-a-visit-window-title C-08-pick-a-visit-window-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-08-pick-a-visit-window-title">C-08 Pick a visit window — proposed windows</title>
  <desc id="C-08-pick-a-visit-window-desc">Customer view for Claire Martin on Monday 23 November after she approved quote version 1, 240 euros. Mateo proposed three windows for BB-1042 Terrace door repair, shown in Spain time first with her UK time beneath. Tuesday 24 November: 09:00 to 10:00 Spain time, 08:00 to 09:00 her time, chosen; and 15:00 to 16:00 Spain time, 14:00 to 15:00 her time. Wednesday 25 November: 09:00 to 10:00 Spain time, 08:00 to 09:00 her time. A note says a window is when the crew arrives and that on the day she sees the arrival live. The dock repeats the chosen window and that it is free to change. Actions: a chat button for Mateo and one primary, Confirm this window.</desc>
