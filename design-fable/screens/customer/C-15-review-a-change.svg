<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-15-review-a-change-title C-15-review-a-change-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-15-review-a-change-title">C-15 Review a change — open</title>
  <desc id="C-15-review-a-change-desc">Customer view for Claire Martin at 08:43 UK time on Tuesday 24 November, in a branch where Mateo Ruiz proposed a change to BB-1042 at 09:41 Spain time. Two twin cards are compared. Approved, quote version 1, locked, 240 euros: Adjust the terrace door and replace the rollers. Glass replacement is not included, with the provider’s Spanish original beneath, never altered. Addition, plus 40 euros: Also replace the worn bottom track, with the Spanish original beneath: Sustituir también el carril inferior desgastado. New total 280 euros; same visit, about 30 minutes longer. On hold until she decides: the bottom track only; the approved work carries on as agreed. Reply by 10:00 Spain time, 09:00 her time. She decides as named approver for Villa Mar. Actions: Reject, and one primary, Approve 280 euros.</desc>
