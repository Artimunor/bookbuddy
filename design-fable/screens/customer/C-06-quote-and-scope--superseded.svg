  <desc id="C-06-quote-and-scope--superseded-desc">Alternative branch. Customer view for Claire Martin on Monday 23 November: quote version 1 for BB-1042, 240 euros from Reformas Ruiz, was replaced by version 2 at 08:17 Spain time and is read-only. Its line items and scope stay exactly as issued, with the Spanish original beneath the English translation. It cannot be approved or declined. Actions: a chat button for Mateo and one primary, View current quote.</desc>
