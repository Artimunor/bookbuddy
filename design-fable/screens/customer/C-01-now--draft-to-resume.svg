<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-01-now--draft-to-resume-title C-01-now--draft-to-resume-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-01-now--draft-to-resume-title">C-01 Now — draft to resume</title>
  <desc id="C-01-now--draft-to-resume-desc">Customer tab root for Claire Martin on Monday 23 November with an unsent request draft. The ask bar is in its draft state: Draft, not sent, step 2 of 3, The terrace door sticks, and opens the draft where she left it. Beneath it are a link to start a different request and the note Saved on this device. A notice says a draft is not a request and nothing is sent until she taps Send. The card How a job goes repeats the three steps: say what is wrong, approve a quote, follow the visit live. Nothing is live, so nothing on the page is lime. Tabs: Now selected, Bookings, Messages.</desc>
