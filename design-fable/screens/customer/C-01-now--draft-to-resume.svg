  <g id="ask-bar-draft"><rect x="20.5" y="190.5" width="349" height="63" rx="31.5" fill="#FFFFFF" stroke="#747986"/><path transform="translate(40 210)" d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="216" font-size="12" font-weight="600" fill="#555A66">Draft · not sent · step 2 of 3</text><text x="76" y="238" font-size="17" font-weight="700" fill="#15171C">The terrace door sticks…</text><path transform="translate(326 210)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="20" y="284" font-size="14" font-weight="700" fill="#2438B5" text-decoration="underline">Start a different request</text>
  <text x="370" y="284" font-size="14" font-weight="500" fill="#555A66" text-anchor="end">Saved on this device</text>
  <g id="draft-notice"><rect x="20" y="308" width="350" height="72" rx="24" fill="#E3EEFB"/><path transform="translate(36 324)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 8v5m0-8h.01" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="338" font-size="17" font-weight="700" fill="#1E4A7D">A draft is not a request</text><text x="70" y="360" font-size="14" font-weight="500" fill="#1E4A7D">Nothing is sent until you tap Send.</text></g>
  <g id="how-it-goes"><rect x="20.5" y="396.5" width="349" height="287" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><text x="40" y="434" font-size="20" font-weight="700" fill="#15171C">How a job goes</text><rect x="40" y="456" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 462) scale(0.8333)" d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="470" font-size="17" font-weight="700" fill="#15171C">Say what is wrong</text><text x="84" y="492" font-size="14" font-weight="500" fill="#555A66">Your own words, a photo or a voice</text><text x="84" y="512" font-size="14" font-weight="500" fill="#555A66">note. No forms, no categories.</text><rect x="40" y="532" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 538) scale(0.8333)" d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5m-5 4h5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="546" font-size="17" font-weight="700" fill="#15171C">Approve a quote</text><text x="84" y="568" font-size="14" font-weight="500" fill="#555A66">A local provider prices the job.</text><text x="84" y="588" font-size="14" font-weight="500" fill="#555A66">Nothing is booked until you approve.</text><rect x="40" y="608" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 614) scale(0.8333)" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-4a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="622" font-size="17" font-weight="700" fill="#15171C">Follow the visit live</text><text x="84" y="644" font-size="14" font-weight="500" fill="#555A66">On the way, on site, finished: shared</text><text x="84" y="664" font-size="14" font-weight="500" fill="#555A66">by the crew, never tracked.</text></g>
  <text x="195" y="718" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Nothing is live yet.</text>
