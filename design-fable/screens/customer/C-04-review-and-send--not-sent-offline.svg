<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-04-review-and-send--not-sent-offline-title C-04-review-and-send--not-sent-offline-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-04-review-and-send--not-sent-offline-title">C-04 Review and send — not sent, offline</title>
  <desc id="C-04-review-and-send--not-sent-offline-desc">Customer view for Claire Martin, step 3 of 3 of a new request, with no connection. An attention notice says Not sent, you are offline, and that the request is saved on this device, not sent. The job card shows her description with one photo saved on this device; the place and access card is unchanged and both stay editable. Send request is disabled; the dock gives the reason: connect to send, nothing sends by itself.</desc>
