  <g id="the-job"><rect x="20.5" y="198.5" width="349" height="175" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><text x="40" y="228" font-size="17" font-weight="700" fill="#15171C">The job</text><text x="350" y="228" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end" text-decoration="underline">Edit</text><text x="40" y="258" font-size="16" font-weight="400" fill="#15171C">The terrace door sticks when I close</text><text x="40" y="282" font-size="16" font-weight="400" fill="#15171C">it and no longer slides smoothly. It</text><text x="40" y="306" font-size="16" font-weight="400" fill="#15171C">has got worse over the last month.</text><path d="M36 322.5h318" stroke="#DED8CB"/><g><rect x="40" y="330" width="36" height="36" rx="9" fill="#ECE8DE"/><path d="M40 360.24H76V357a9 9 0 0 1-9 9H49a9 9 0 0 1-9-9z" fill="#FFE3D3"/><rect x="47.2" y="335.04" width="21.599999999999998" height="25.2" fill="#E3EEFB" stroke="#555A66" stroke-width="1.5"/><path d="M58 335.04v25.2" stroke="#555A66" stroke-width="1.5"/><rect x="59.44" y="345.84" width="2" height="5.040000000000001" rx="1" fill="#15171C"/></g><text x="88" y="353" font-size="14" font-weight="500" fill="#555A66">1 photo · saved on this device</text></g>
  <g id="place-and-access"><rect x="20.5" y="386.5" width="349" height="161" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><text x="40" y="416" font-size="17" font-weight="700" fill="#15171C">Place and access</text><text x="350" y="416" font-size="14" font-weight="700" fill="#2438B5" text-anchor="end" text-decoration="underline">Edit</text><text x="40" y="444" font-size="16" font-weight="400" fill="#15171C">Villa Mar · Xàbia</text><text x="40" y="466" font-size="14" font-weight="500" fill="#555A66">12 Carrer de la Porta Verda, 03730 Xàbia</text><path d="M36 480.5h318" stroke="#DED8CB"/><text x="40" y="504" font-size="12" font-weight="600" fill="#555A66">Access</text><text x="108" y="504" font-size="14" font-weight="500" fill="#15171C">Side gate, unlocked that morning</text><text x="40" y="528" font-size="12" font-weight="600" fill="#555A66">On site</text><text x="108" y="528" font-size="14" font-weight="500" fill="#15171C">Nobody · crew lets itself in</text></g>
  <path transform="translate(20 559) scale(0.8333)" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="#555A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="574" font-size="14" font-weight="500" fill="#555A66">Seen by the provider that takes the job and</text><text x="48" y="594" font-size="14" font-weight="500" fill="#555A66">its named foreman. Not public.</text>
