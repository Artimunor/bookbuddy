  <desc id="C-16-report-a-problem--case-open-desc">Customer view for Claire Martin at 09:41 UK time on Tuesday 24 November, after the server accepted her report at 10:38 Spain time. Case C-0193 on BB-1042 is open: Work quality, Replace the rollers, quote version 1, with her words, The door still catches halfway when it slides. Sophie tried it at 10:30, and one photo. A notice says the first reply is due within one business day, as a target, and that the work is not signed off. No resolution time, refund or billing hold is promised. Case history in Spain time: Reformas Ruiz told at 10:39; Case received by the BookBuddy local service at 10:38; Problem reported by her at 10:38. One action: Add to this case.</desc>
