  <title id="C-13-places-title">C-13 Places — many, one delegated</title>
  <desc id="C-13-places-desc">Customer view for Claire Martin, opened from You. Three places are listed under a search field. Villa Mar in Xàbia, Spain time: she is owner and named approver; one booking in progress, BB-1042. Apartamento Sol in Dénia, Spain time: managed for Hugo Lambert, who approves quotes and changes; she can request work and message there. Casa Pinos in Moraira, Spain time: she is owner and named approver; no open bookings. A note says each place keeps its own people and approver. One action: Add a place.</desc>
