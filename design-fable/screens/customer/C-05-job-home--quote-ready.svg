  <title id="C-05-job-home--quote-ready-title">C-05 Job home — quote ready</title>
  <desc id="C-05-job-home--quote-ready-desc">Customer view for Claire Martin on Monday 23 November after Reformas Ruiz sent quote version 1 at 08:14 Spain time. Job home for BB-1042 Terrace door repair at Villa Mar. The stage is Quote ready, step two of six on the journey line: 240 euros for the whole job, and she is the named approver for Villa Mar. Rows: quote version 1, sent 08:14, needs her approval; the visit window is offered after she approves; Mateo Ruiz, foreman at Reformas Ruiz, is her contact. History in Spain time: Quote version 1 sent at 08:14 and Job accepted at 08:10. Actions: a chat button for Mateo and one primary, Review quote.</desc>
