  <title id="C-20-visit-ongoing-notification--finished-title">C-20 Visit ongoing notification — finished</title>
  <desc id="C-20-visit-ongoing-notification--finished-desc">System surface on Claire Martin’s Android phone at 09:16 UK time on Tuesday 24 November, with the notification shade open. The visit notification shows its final state and is no longer ongoing, so it can be cleared: a check icon, BookBuddy, 9:15, the title Work finished, the text Open the visit to review and sign off, and a full progress bar. It performs no action: tapping opens the Live visit, where the dock offers Review and sign off.</desc>
