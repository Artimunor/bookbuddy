  <title id="C-04-review-and-send--sent-title">C-04 Review and send — sent</title>
  <desc id="C-04-review-and-send--sent-desc">Customer view for Claire Martin after the server confirmed her request on Monday 23 November at 08:05 Spain time, 07:05 her time. The screen says Request sent, not a booking yet, with reference BB-1042 for Villa Mar. The journey line is at step one of six, Requested, followed by Quoted, Booked, Visit, Signed off and Paid. What happens next: a local provider reads it with her original beneath a translation; she gets a quote to approve and nothing is booked or owed before that; then she picks a visit window, and changing or cancelling is free. She will be notified when the quote arrives. One action: Open job.</desc>
