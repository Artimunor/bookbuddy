  <text x="20" y="268" font-size="14" font-weight="600" fill="#15171C">Which part of the job?</text><rect x="20.5" y="280.5" width="349" height="55" rx="15.5" fill="#FFFFFF" stroke="#747986"/><text x="36" y="314" font-size="16" font-weight="400" fill="#15171C">Replace the rollers · quote v1</text><path transform="translate(326 296)" d="m6 10 6 6 6-6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="366" font-size="14" font-weight="600" fill="#15171C">What happened?</text><rect x="20.5" y="378.5" width="349" height="95" rx="15.5" fill="#FFFFFF" stroke="#747986"/><text x="36" y="408" font-size="16" font-weight="400" fill="#15171C">The door still catches halfway when it</text><text x="36" y="432" font-size="16" font-weight="400" fill="#15171C">slides. My neighbour checked at 10:30.</text>
