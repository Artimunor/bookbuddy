  <title id="C-16-report-a-problem-title">C-16 Report a problem — draft</title>
  <desc id="C-16-report-a-problem-desc">Customer view for Claire Martin at 09:38 UK time on Tuesday 24 November, in a branch where she reports a problem instead of signing off. The draft for BB-1042 has the category Work quality chosen from Work quality, Damage, Bill, Timing and Something else. The affected item is Replace the rollers from quote version 1. Her words: The door still catches halfway when it slides. My neighbour checked at 10:30. One photo is attached and a tile adds a photo or a voice note. A notice says who sees the report: BookBuddy’s case owner and Reformas Ruiz, not public. The dock says sending does not sign off the work or change the bill. One action: Send report.</desc>
