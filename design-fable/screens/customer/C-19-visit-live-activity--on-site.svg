  <title id="C-19-visit-live-activity--on-site-title">C-19 Visit Live Activity — Lock Screen, crew on site</title>
  <desc id="C-19-visit-live-activity--on-site-desc">System surface on Claire Martin’s iPhone Lock Screen at 08:15 UK time on Tuesday 24 November. The Live Activity card from Reformas Ruiz for BB-1042 says Crew on site, with a lime pin glyph. The day line is at step three of five. On site since 08:14 her time, 09:14 Spain time; the crew checked in. No person, address, price or message text is shown. Tapping opens the Live visit after unlock.</desc>
