<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-11-bill-and-payment-record-title C-11-bill-and-payment-record-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-11-bill-and-payment-record-title">C-11 Bill and payment record — bill due</title>
  <desc id="C-11-bill-and-payment-record-desc">Customer view for Claire Martin at 09:44 UK time on Tuesday 24 November. The bill from Reformas Ruiz for BB-1042 is due: 240 euros in total, bill RR-0412, sent on Tuesday at 10:42 Spain time, due by Tuesday 1 December, matching approved quote version 1. Lines with the Spanish original beneath each label: Labour, Mano de obra, 160 euros; Rollers, Rodillos, 80 euros. She pays Reformas Ruiz directly: BookBuddy takes no payment and holds no card. Bank transfer details are on the provider’s bill, and the reference BB-1042 can be copied. The payment record says it is not recorded as paid yet and that Reformas Ruiz records the payment. A link asks about the bill. One action: Open the provider’s bill.</desc>
