    <text x="80" y="619" font-size="17" font-weight="700" fill="#15171C">Paid entry · corrected</text><text x="350" y="619" font-size="14" font-weight="600" fill="#555A66" text-anchor="end">09:05</text>
    <text x="80" y="643" font-size="14" font-weight="500" fill="#555A66">Mateo Ruiz · Provider admin</text>
  </g>
  <g id="dock"><rect y="724" width="390" height="120" fill="#FFFFFF"/><path d="M0 724.5h390" stroke="#DED8CB"/><rect x="20" y="738" width="350" height="56" rx="28" fill="#15171C"/><text x="195" y="772" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ask about this bill</text></g>
