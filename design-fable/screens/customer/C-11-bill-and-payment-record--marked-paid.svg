  <title id="C-11-bill-and-payment-record--marked-paid-title">C-11 Bill and payment record — marked paid by provider</title>
  <desc id="C-11-bill-and-payment-record--marked-paid-desc">Customer view for Claire Martin on Wednesday 25 November. The bill from Reformas Ruiz for BB-1042, 240 euros, bill RR-0412, is marked paid by the provider on Wednesday at 09:05 Spain time. Lines: Labour, Mano de obra, 160 euros; Rollers, Rodillos, 80 euros. The job is complete at step six of six on the journey line; she paid Reformas Ruiz directly. Payment record in Spain time: Marked paid on Wednesday at 09:05 by Mateo Ruiz, provider admin; Bill sent on Tuesday at 10:42 by Reformas Ruiz, 240 euros. The record is the provider’s statement, not a BookBuddy receipt. One action: Open the provider’s bill.</desc>
