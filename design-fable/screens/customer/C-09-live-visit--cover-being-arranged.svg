  <title id="C-09-live-visit--cover-being-arranged-title">C-09 Live visit — cover being arranged</title>
  <desc id="C-09-live-visit--cover-being-arranged-desc">Customer view for Claire Martin at 07:36 UK time on Tuesday 24 November, 08:36 Spain time. The capsule is not lit: it says cover is being arranged and that Mateo will update her by 08:45 Spain time, 07:45 her time. Her 09:00 to 10:00 window has not changed. There is no arrival time, and the first bead of the day line is an open ring because the crew is not fully confirmed. Only the still-confirmed name is shown: Mateo Ruiz, foreman. No candidate, reason or staffing detail appears. She can follow on her Lock Screen. Moments in Spain time: Cover being arranged at 08:34. One action: Message Mateo.</desc>
