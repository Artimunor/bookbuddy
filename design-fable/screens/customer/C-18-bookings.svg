  <desc id="C-18-bookings-desc">Customer tab root for Claire Martin at 07:58 UK time on Tuesday 24 November. Segments: Active chosen, Past; a place filter set to All places. Three booking cards, each with a mini journey line and the stage in words. BB-1042 Terrace door repair at Villa Mar, Xàbia, with Reformas Ruiz: at the Visit step, step four of six, visit today, crew on the way, marked Live. BB-1047 Bathroom tap leak at Apartamento Sol, Dénia: Quoted, waiting for Hugo Lambert, the named approver there. BB-1049 Garden gate latch at Casa Pinos, Moraira: Requested, not a booking yet. Above the tab bar the live pill says On the way, arriving 09:10 to 09:20 Spain time, and opens the Live visit. Tabs: Now, Bookings selected, Messages.</desc>
