  <title id="C-19-visit-live-activity--finished-title">C-19 Visit Live Activity — Lock Screen, finished</title>
  <desc id="C-19-visit-live-activity--finished-desc">System surface on Claire Martin’s iPhone Lock Screen at 09:16 UK time on Tuesday 24 November. The Live Activity card from Reformas Ruiz for BB-1042 shows its final state: Finished, Done, with all five beads of the day line done and no pulse. Finished at 09:15 her time, 10:15 Spain time; open the visit to review and sign off. The card performs no action and can stay for up to four hours. Tapping opens the Live visit after unlock, where the dock offers Review and sign off.</desc>
