<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-07-approve-quote-title C-07-approve-quote-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-07-approve-quote-title">C-07 Approve quote sheet — ready</title>
  <desc id="C-07-approve-quote-desc">Bottom sheet over the dimmed quote for BB-1042, viewed by Claire Martin on Monday 23 November. Title: Approve this quote. She approves as Claire Martin, named approver for Villa Mar. The sheet names quote version 1 from Reformas Ruiz, total 240 euros. Effects: it agrees the scope and price of version 1; it books nothing yet, she picks a window next; it takes no payment, Reformas Ruiz bills her. The approval is recorded with her name, the version and the time, and a link opens the quote terms. Close is in the sheet header; one action: Approve 240 euros.</desc>
