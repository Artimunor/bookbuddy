<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-20-visit-ongoing-notification--live-update-title C-20-visit-ongoing-notification--live-update-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-20-visit-ongoing-notification--live-update-title">C-20 Visit ongoing notification — Android 16 Live Update (later)</title>
  <desc id="C-20-visit-ongoing-notification--live-update-desc">Later concept, not offered or requested in the pilot. System surface on Claire Martin’s Android 16 phone at 07:58 UK time on Tuesday 24 November, where the system has promoted the visit notification to a Live Update. A status-bar chip beside the clock shows a van glyph and 14 min. The promoted notification sits on top of the shade: BookBuddy, 7:52, Crew on the way, about 14 min, Arriving 08:10 to 08:20 your time, and a segmented progress line with the five day-line points and a lime tracker with a van between On the way and On site, also written as Step 2 of 5, On the way. The pilot uses the standard ongoing notification on all supported Android versions.</desc>
