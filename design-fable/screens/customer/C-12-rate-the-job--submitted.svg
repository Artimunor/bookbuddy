  <title id="C-12-rate-the-job--submitted-title">C-12 Rate the job sheet — submitted</title>
  <desc id="C-12-rate-the-job--submitted-desc">Bottom sheet over the dimmed Job home for BB-1042, viewed by Claire Martin on Wednesday 25 November after the server accepted her rating. Title: Thanks, Claire. A confirmation row says Rating sent, 4 of 5, private feedback, Wednesday 25 November. Notes say it is seen by BookBuddy and Reformas Ruiz’s feedback lead, that one rating is kept per job and that support can correct or withdraw it. Close is in the sheet header; one action: Done.</desc>
