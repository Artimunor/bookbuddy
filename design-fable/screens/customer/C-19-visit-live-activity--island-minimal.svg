<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-19-visit-live-activity--island-minimal-title C-19-visit-live-activity--island-minimal-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-19-visit-live-activity--island-minimal-title">C-19 Visit Live Activity — Dynamic Island, minimal</title>
  <desc id="C-19-visit-live-activity--island-minimal-desc">System surface on Claire Martin’s iPhone Home Screen at 07:58 UK time while another app’s timer also has a Live Activity. The other activity takes the main island, shown as a neutral timer. The visit activity is reduced to the minimal presentation: a separate round island holding only the lime van glyph for On the way, with no text. Tapping it opens the Live visit; touching and holding expands the island.</desc>
