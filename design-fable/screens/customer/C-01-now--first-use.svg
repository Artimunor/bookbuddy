  <text x="20" y="172" font-size="14" font-weight="500" fill="#555A66">Mon, 23 Nov · nothing booked yet</text>
  <g id="ask-bar"><rect x="20.5" y="190.5" width="349" height="63" rx="31.5" fill="#FFFFFF" stroke="#747986"/><text x="44" y="228" font-size="17" font-weight="700" fill="#15171C">What needs doing?</text><path transform="translate(286 210)" d="M12 4a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3zm-6 7a6 6 0 0 0 12 0m-6 6v3" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path transform="translate(326 210)" d="M4 8h3l2-3h6l2 3h3v11H4zm8 2.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="20" y="280" font-size="14" font-weight="500" fill="#555A66">Type, talk or take a photo, in any language.</text>
  <g id="how-it-goes"><rect x="20.5" y="300.5" width="349" height="287" rx="24" fill="#FFFFFF" stroke="#DED8CB"/><text x="40" y="338" font-size="20" font-weight="700" fill="#15171C">How a job goes</text><rect x="40" y="360" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 366) scale(0.8333)" d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="374" font-size="17" font-weight="700" fill="#15171C">Say what is wrong</text><text x="84" y="396" font-size="14" font-weight="500" fill="#555A66">Your own words, a photo or a voice</text><text x="84" y="416" font-size="14" font-weight="500" fill="#555A66">note. No forms, no categories.</text><rect x="40" y="436" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 442) scale(0.8333)" d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5m-5 4h5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="450" font-size="17" font-weight="700" fill="#15171C">Approve a quote</text><text x="84" y="472" font-size="14" font-weight="500" fill="#555A66">A local provider prices the job.</text><text x="84" y="492" font-size="14" font-weight="500" fill="#555A66">Nothing is booked until you approve.</text><rect x="40" y="512" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(46 518) scale(0.8333)" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-4a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="526" font-size="17" font-weight="700" fill="#15171C">Follow the visit live</text><text x="84" y="548" font-size="14" font-weight="500" fill="#555A66">On the way, on site, finished: shared</text><text x="84" y="568" font-size="14" font-weight="500" fill="#555A66">by the crew, never tracked.</text></g>
  <g id="pay-notice"><rect x="20" y="604" width="350" height="48" rx="24" fill="#E3EEFB"/><path transform="translate(36 616)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 8v5m0-8h.01" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="633" font-size="14" font-weight="600" fill="#1E4A7D">You pay the provider, not the app</text></g>
  <text x="195" y="694" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Nothing is live yet. Start with the bar above.</text>
