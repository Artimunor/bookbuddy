  <desc id="C-01-now--decision-due-desc">Customer tab root for Claire Martin on Monday 23 November after Reformas Ruiz sent quote version 1 at 08:14 Spain time. One unread notification. Under Needs you, a card marked Decision due asks her to approve the quote for BB-1042 Terrace door repair at Villa Mar, 240 euros; the journey line is at step two of six, Quoted, and the job is not booked yet. The card holds one action, Review quote. Below, a quiet card says nothing is live right now and that a visit lights up here on the day. Tabs: Now selected, Bookings, Messages.</desc>
