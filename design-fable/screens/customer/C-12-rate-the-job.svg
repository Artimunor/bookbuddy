  <title id="C-12-rate-the-job-title">C-12 Rate the job sheet — rating chosen</title>
  <desc id="C-12-rate-the-job-desc">Bottom sheet over the dimmed Job home for BB-1042, viewed by Claire Martin on Wednesday 25 November after Reformas Ruiz recorded the bill as paid. Title: Rate the job, Terrace door repair with Reformas Ruiz. Five stars with four chosen, also written as 4 of 5, Good. An optional comment reads: Quick and tidy, and the updates were clear all morning. The audience is stated before sending: seen by BookBuddy and Reformas Ruiz’s feedback lead, not the crew, not public, and no edits after sending. The dock says it is optional and that closing sends nothing. Close is in the sheet header; one action: Send rating.</desc>
