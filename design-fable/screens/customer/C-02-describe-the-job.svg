<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="C-02-describe-the-job-title C-02-describe-the-job-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="C-02-describe-the-job-title">C-02 Describe the job — typed description with a photo</title>
  <desc id="C-02-describe-the-job-desc">Customer view for Claire Martin, step 1 of 3 of a new request. A language line says she can write in any language and her original is kept. Under What needs doing she has typed, in English: The terrace door sticks when I close it and no longer slides smoothly. It has got worse over the last month. The draft is saved on this device. Under Photos and voice, one photo of the terrace door is added to the draft, with tiles to add another photo or a voice note. A note says only the provider handling the request sees these and to leave out gate and alarm codes. One action: Continue, to where the job is.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:41</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header"><path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Describe the job</text><text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">Step 1 of 3 · New request</text></g>
  <g id="language-line"><rect x="20" y="114" width="350" height="36" rx="18" fill="#ECE8DE"/><path transform="translate(32 122) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="137" font-size="14" font-weight="600" fill="#15171C">Write in any language · original kept</text></g>
  <text x="20" y="178" font-size="14" font-weight="600" fill="#15171C">What needs doing?</text>
  <g id="description"><rect x="20.5" y="190.5" width="349" height="131" rx="16" fill="#FFFFFF" stroke="#747986"/><text x="40" y="222" font-size="16" font-weight="400" fill="#15171C">The terrace door sticks when I close</text><text x="40" y="246" font-size="16" font-weight="400" fill="#15171C">it and no longer slides smoothly. It</text><text x="40" y="270" font-size="16" font-weight="400" fill="#15171C">has got worse over the last month.</text><text x="40" y="304" font-size="12" font-weight="600" fill="#555A66">Original · English</text></g>
  <path transform="translate(20 329) scale(0.8333)" d="m5 12 5 5 9-10" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="344" font-size="14" font-weight="500" fill="#555A66">Draft saved on this device</text>
  <text x="20" y="388" font-size="20" font-weight="700" fill="#15171C">Photos and voice</text>
  <text x="20" y="410" font-size="14" font-weight="500" fill="#555A66">Optional. They help the provider quote faster.</text>
