  <text x="20" y="556" font-size="14" font-weight="500" fill="#555A66">Terrace door · added to draft</text>
  <g id="privacy-note"><path transform="translate(20 585) scale(0.8333)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#555A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="600" font-size="14" font-weight="500" fill="#555A66">Seen only by the provider handling your</text><text x="48" y="620" font-size="14" font-weight="500" fill="#555A66">request. Leave out gate and alarm codes.</text></g>
