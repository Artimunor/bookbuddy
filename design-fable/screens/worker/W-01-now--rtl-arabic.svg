  <title id="W-01-now--rtl-arabic-title">W-01 الآن — عرض تغطية من فريق العمل</title>
  <desc id="W-01-now--rtl-arabic-desc">الثلاثاء، 24 نوفمبر، الساعة 08:36 بتوقيت إسبانيا. تلقّى دييغو توريس عرضًا من فريقه لتغطية مناوبة في شابيا من الساعة 09:00 إلى الساعة 10:00 لضبط باب الشرفة. الإحاطة بالإسبانية. بقيت ست دقائق للرد قبل الساعة 08:42. قبول العرض يحجز المكان فقط؛ على دييغو انتظار تأكيد ماتيو قبل التوجّه إلى الموقع. دييغو متاح للتغطية حتى الساعة 18:00. هذه الواجهة العربية لاختبار التخطيط من اليمين إلى اليسار.</desc>
