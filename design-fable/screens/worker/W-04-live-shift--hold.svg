<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-04-live-shift--hold-title W-04-live-shift--hold-desc" xml:lang="en" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-04-live-shift--hold-title">W-04 Live shift — on site, work held</title>
  <desc id="W-04-live-shift--hold-desc">Diego at 09:15 Spain time on Tuesday 24 November. The server has confirmed his 09:14 attendance, not the start of work. He must explain version 2 to Mateo and acknowledge it online after Mateo verifies. He can open the briefing or check out if he leaves.</desc>
