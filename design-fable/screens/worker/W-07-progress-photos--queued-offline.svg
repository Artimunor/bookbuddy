<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-07-progress-photos--queued-offline-title W-07-progress-photos--queued-offline-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-07-progress-photos--queued-offline-title">W-07 Progress photos — queued offline</title>
  <desc id="W-07-progress-photos--queued-offline-desc">Worker view for Diego Torres at 09:31 Spain time on Tuesday 24 November, Field mode on, in a branch where his phone lost its connection before he sent the photo. An offline banner says the last confirmed time was 09:29 Spain time and that one photo is waiting on this phone. The upload queue lists one waiting photo with a dashed border: Carril inferior desgastado, taken 09:29 and queued 09:31, labelled Saved on this device, pending sync. Mateo has not received it yet, and a Remove link takes it out of the queue. It sends by itself when he is back online; he can keep working and add more photos. A button adds another photo. The dock says one photo is waiting and Mateo has not received it. One action: Back to your shift.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:31</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Progress photos</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="offline-banner">
    <rect x="20" y="114" width="350" height="72" rx="24" fill="#FFEFCF"/>
    <path transform="translate(36 130)" d="M3 9a13 13 0 0 1 18 0M6.5 12.5a8 8 0 0 1 11 0M10 16a3 3 0 0 1 4 0M12 19.5h.01M4 3l16 18" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="143" font-size="17" font-weight="700" fill="#6E4300">Offline · last confirmed 09:29</text>
    <text x="70" y="165" font-size="14" font-weight="500" fill="#6E4300">Spain time · 1 photo waiting on this phone</text>
  </g>
  <g id="upload-queue">
    <rect x="20.5" y="198.5" width="349" height="196" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <text x="40" y="230" font-size="17" font-weight="700" fill="#15171C">Upload queue</text>
    <text x="350" y="230" font-size="14" font-weight="500" fill="#555A66" text-anchor="end">1 waiting</text>
    <g transform="translate(40 246)">
      <rect width="64" height="64" rx="12" fill="#FFE3D3"/>
      <path d="M0 40h64v12a12 12 0 0 1-12 12H12A12 12 0 0 1 0 52z" fill="#DED8CB"/>
      <path d="M6 40h52M6 47h52" stroke="#15171C" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 40v7m10-7v7m12-7v7" stroke="#15171C" stroke-width="2" stroke-linecap="round"/>
      <path d="M14 30l6-8 7 5 9-10 8 9" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#747986" stroke-width="2" stroke-dasharray="5 4"/>
    </g>
    <text x="120" y="272" font-size="16" font-weight="400" fill="#15171C">Carril inferior desgastado</text>
    <text x="120" y="294" font-size="14" font-weight="500" fill="#555A66">Taken 09:29 · queued 09:31</text>
    <rect x="40" y="322" width="310" height="32" rx="16" fill="#FFEFCF"/>
    <path transform="translate(50 330) scale(0.6667)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 2" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="343" font-size="14" font-weight="600" fill="#6E4300">Saved on this device · pending sync</text>
    <text x="40" y="378" font-size="14" font-weight="500" fill="#555A66">Mateo has not received it yet.</text>
    <text x="350" y="378" font-size="14" font-weight="700" fill="#8A2F28" text-anchor="end" text-decoration="underline">Remove</text>
  </g>
  <text x="20" y="422" font-size="14" font-weight="500" fill="#555A66">It sends by itself when you are back online.</text>
  <text x="20" y="442" font-size="14" font-weight="500" fill="#555A66">You can keep working and add more photos.</text>
  <g id="add-photo">
    <rect x="21" y="463" width="348" height="54" rx="27" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <path transform="translate(103 478)" d="M12 5v14M5 12h14" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="496" font-size="17" font-weight="700" fill="#15171C">Add another photo</text>
  </g>
  <g id="dock">
    <rect y="686" width="390" height="158" fill="#FFFFFF"/>
    <path d="M0 686.5h390" stroke="#DED8CB"/>
    <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">1 photo waiting · Mateo has not received it</text>
    <rect x="20" y="732" width="350" height="62" rx="31" fill="#15171C"/>
    <text x="195" y="769" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Back to your shift</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
