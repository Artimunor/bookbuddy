<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-11-shift-live-activity-title W-11-shift-live-activity-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-11-shift-live-activity-title">W-11 Shift Live Activity — Lock Screen, since check-in</title>
  <desc id="W-11-shift-live-activity-desc">System surface on Diego Torres’s iPhone Lock Screen at 09:40 Spain time on Tuesday 24 November. He checked in at 09:14 by his own tap and chose to keep the shift on his Lock Screen. A dark Live Activity card from Reformas Ruiz for BB-1042 says On site, with a system timer at 26 minutes; the day line is at step three of five; Since check-in 09:14, Xàbia, Spain time. One link, Check out, opens the check-out sheet in the app after unlock and records nothing by itself. No address, customer name, message text or position is shown, and the card never says that a safety hold was cleared. Tapping the card opens the live shift after unlock.</desc>
  <rect width="390" height="844" fill="#ECE8DE"/><circle cx="330" cy="250" r="150" fill="#FFE3D3"/><circle cx="40" cy="470" r="190" fill="#DDEBFF"/><path d="M0 560h390v284H0z" fill="#DED8CB"/>
  <rect x="132" y="11" width="126" height="37" rx="18.5" fill="#000000" aria-hidden="true"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <path transform="translate(183 62)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="124" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">Tuesday, 24 November</text>
  <text x="195" y="216" font-size="96" font-weight="800" fill="#15171C" text-anchor="middle">9:40</text>
