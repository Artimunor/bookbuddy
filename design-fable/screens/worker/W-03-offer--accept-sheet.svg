<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-03-offer--accept-sheet-title W-03-offer--accept-sheet-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-03-offer--accept-sheet-title">W-03 Offer — accept sheet, the second tap</title>
  <desc id="W-03-offer--accept-sheet-desc">Diego reviews a cover offer at 08:38 Spain time on Tuesday 24 November. He has four minutes to reply, until 08:42. Accepting reserves the place; it does not assign him. Mateo has up to five minutes after the first valid acceptance to confirm, less if the safe staffing cutoff comes sooner. Diego must not travel until confirmed. Close sends nothing.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:38</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Cover offer</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">From Mateo Ruiz · Reformas Ruiz</text>
  </g>
  <g id="offer-capsule">
    <rect x="21" y="115" width="348" height="216" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <rect x="40" y="134" width="102" height="28" rx="14" fill="#15171C"/>
    <text x="91" y="153" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Offer open</text>
    <text x="350" y="153" font-size="14" font-weight="600" fill="#15171C" text-anchor="end">Your crew</text>
    <text x="40" y="200" font-size="28" font-weight="800" fill="#15171C">Today 09:00–10:00</text>
    <text x="40" y="222" font-size="14" font-weight="500" fill="#15171C">Spain time · starts in 22 min</text>
    <path d="M40 240.5h310" stroke="#15171C"/>
    <g id="offer-clock">
      <circle cx="72" cy="284" r="28" fill="none" stroke="#BFDC22" stroke-width="6"/>
      <path d="M72 256a28 28 0 1 1-9.58 54.31" fill="none" stroke="#15171C" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="284" font-size="20" font-weight="800" fill="#15171C" text-anchor="middle">4</text>
      <text x="72" y="298" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">min</text>
    </g>
    <text x="116" y="278" font-size="20" font-weight="700" fill="#15171C">Reply by 08:42</text>
    <text x="116" y="300" font-size="14" font-weight="500" fill="#15171C">Spain time · the offer closes then</text>
  </g>
  <g id="sheet">
    <rect width="390" height="844" fill="#15171C" opacity="0.4"/>
    <path d="M0 376a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32V844H0z" fill="#FFFFFF"/>
    <rect x="171" y="354" width="48" height="5" rx="2.5" fill="#DED8CB"/>
    <text x="20" y="398" font-size="20" font-weight="700" fill="#15171C">Accept this offer?</text>
    <text x="370" y="397" font-size="17" font-weight="700" fill="#2438B5" text-anchor="end">Close</text>
    <path d="M324.2 401.5h45.8" stroke="#2438B5" stroke-width="1.5"/>
    <text x="20" y="422" font-size="14" font-weight="500" fill="#555A66">Cover · today 09:00–10:00 Spain time</text>
    <g id="effect">
      <rect x="20" y="438" width="350" height="132" rx="24" fill="#E3EEFB"/>
      <text x="40" y="466" font-size="14" font-weight="700" fill="#1E4A7D">When you accept</text>
      <path transform="translate(36 475) scale(0.8333)" d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="490" font-size="14" font-weight="500" fill="#1E4A7D">Your place is reserved, not assigned</text>
      <path transform="translate(36 501) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4.500V12l3 2" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="516" font-size="14" font-weight="500" fill="#1E4A7D">Mateo has up to 5 minutes to confirm</text>
      <path transform="translate(36 527) scale(0.8333)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="542" font-size="14" font-weight="700" fill="#1E4A7D">Do not travel until Mateo confirms</text>
    </g>
    <text x="195" y="604" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Close changes nothing.</text>
    <text x="195" y="624" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">The offer stays open until 08:42.</text>
    <g id="sheet-dock">
      <path d="M0 686.5h390" stroke="#DED8CB"/>
      <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Reply by 08:42 Spain time · 4 min left</text>
      <rect x="21" y="733" width="348" height="60" rx="30" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="195" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Accept and reserve my place</text>
    </g>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
