<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-06-check-in-or-out--large-text-title W-06-check-in-or-out--large-text-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-06-check-in-or-out--large-text-title">W-06 Check in or out — check-in with large text and glove-size controls</title>
  <desc id="W-06-check-in-or-out--large-text-desc">The Check in sheet for Diego Torres at 09:14 Spain time on Tuesday 24 November, with Field mode on and the phone set to a large text size. The sheet has grown to full height and scrolls; nothing is shrunk or truncated. Every text style is one step larger. Close is a 56-unit outlined button at the top. The ink-bordered card shows his check-in time, 09:14 Spain time, Tuesday 24 November, now, at Villa Mar in Xàbia, shift 09:00 to 10:00. Three notices follow, each taller than before: no location is used, his tap is the record, no GPS; attendance only for now, work waits for Mateo’s briefing; Mateo sees his name and 09:14, the customer sees Crew on site. The optional Lock Screen shift card switch, on, is partly under the dock and reached by scrolling. The dock says the action records 09:14 Spain time. One lime action, 64 units high: Record check-in.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:14</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="sheet">
    <rect width="390" height="844" fill="#15171C" opacity="0.4"/>
    <path d="M0 88a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32V844H0z" fill="#FFFFFF"/>
    <rect x="171" y="66" width="48" height="5" rx="2.5" fill="#DED8CB"/>
    <text x="20" y="120" font-size="28" font-weight="800" fill="#15171C">Check in</text>
    <rect x="263" y="83" width="106" height="54" rx="27" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <text x="316" y="117" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">Close</text>
    <text x="20" y="164" font-size="17" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
    <g id="event">
      <rect x="21" y="181" width="348" height="166" rx="23" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/>
      <text x="40" y="214" font-size="17" font-weight="600" fill="#555A66">Your check-in time</text>
      <text x="40" y="260" font-size="40" font-weight="800" fill="#15171C">09:14</text>
      <text x="168" y="240" font-size="20" font-weight="700" fill="#15171C">Spain time</text>
      <text x="168" y="263" font-size="17" font-weight="500" fill="#555A66">Tue, 24 Nov · now</text>
      <text x="40" y="300" font-size="20" font-weight="700" fill="#15171C">Villa Mar · Xàbia</text>
      <text x="40" y="326" font-size="17" font-weight="500" fill="#15171C">Shift 09:00–10:00</text>
    </g>
    <g id="no-location">
      <rect x="20" y="359" width="350" height="72" rx="24" fill="#E1F3E4"/>
      <path transform="translate(36 383)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.500-6 10-6 10zM4 3l16 18" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="389" font-size="17" font-weight="700" fill="#1E5A32">No location is used</text>
      <text x="70" y="412" font-size="14" font-weight="600" fill="#1E5A32">Your tap is the record. No GPS.</text>
    </g>
    <g id="attendance-only">
      <rect x="20" y="443" width="350" height="72" rx="24" fill="#FFEFCF"/>
      <path transform="translate(36 467)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="473" font-size="17" font-weight="700" fill="#6E4300">Attendance only for now</text>
      <text x="70" y="496" font-size="14" font-weight="600" fill="#6E4300">Work waits for Mateo’s briefing</text>
    </g>
    <g id="who-sees">
      <rect x="20" y="527" width="350" height="72" rx="24" fill="#E3EEFB"/>
      <path transform="translate(36 551)" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="557" font-size="17" font-weight="700" fill="#1E4A7D">Mateo sees your name, 09:14</text>
      <text x="70" y="580" font-size="14" font-weight="600" fill="#1E4A7D">The customer sees “Crew on site”</text>
    </g>
    <g id="lock-screen-opt-in">
      <rect x="20.5" y="611.5" width="349" height="96" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
      <text x="40" y="646" font-size="20" font-weight="700" fill="#15171C">Lock Screen shift card</text>
      <text x="40" y="671" font-size="17" font-weight="500" fill="#555A66">Optional · starts at check-in</text>
      <rect x="298" y="630" width="56" height="32" rx="16" fill="#15171C"/><circle cx="338" cy="646" r="12" fill="#FFFFFF"/>
    </g>
    <g id="sheet-dock">
      <rect y="684" width="390" height="160" fill="#FFFFFF"/>
      <path d="M0 684.5h390" stroke="#DED8CB"/>
      <text x="195" y="714" font-size="17" font-weight="500" fill="#555A66" text-anchor="middle">Records 09:14 Spain time</text>
      <rect x="21" y="731" width="348" height="62" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="195" y="769" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">Record check-in</text>
    </g>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
