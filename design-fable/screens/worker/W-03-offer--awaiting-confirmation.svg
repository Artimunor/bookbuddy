<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-03-offer--awaiting-confirmation-title W-03-offer--awaiting-confirmation-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-03-offer--awaiting-confirmation-title">W-03 Offer — accepted, awaiting the foreman’s confirmation</title>
  <desc id="W-03-offer--awaiting-confirmation-desc">Diego at 08:39 Spain time on Tuesday 24 November, one minute after his first valid reply reserved this own-crew cover slot. Four minutes remain until the 08:43 confirmation cutoff. Mateo has not assigned him. Do not travel yet. The site address stays private. Diego can withdraw his acceptance; if the review expires, he is not assigned.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:39</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Cover offer</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">From Mateo Ruiz · Reformas Ruiz</text>
  </g>
  <g id="offer-capsule">
    <rect x="21" y="115" width="348" height="272" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <rect x="40" y="134" width="138" height="28" rx="14" fill="#15171C"/>
    <path d="m50 148 3.5 3.5 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="153" font-size="12" font-weight="600" fill="#FFFFFF">Accepted 08:38</text>
    <text x="350" y="153" font-size="14" font-weight="600" fill="#15171C" text-anchor="end">Your crew</text>
    <text x="40" y="200" font-size="28" font-weight="800" fill="#15171C">Waiting for Mateo</text>
    <g id="do-not-travel">
      <rect x="40" y="214" width="310" height="44" rx="16" fill="#15171C"/>
      <path transform="translate(52 224)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="242" font-size="17" font-weight="700" fill="#FFFFFF">Do not travel yet</text>
    </g>
    <text x="40" y="280" font-size="14" font-weight="600" fill="#15171C">Your place is reserved, not assigned.</text>
    <path d="M40 296.5h310" stroke="#15171C"/>
    <g id="offer-clock">
      <circle cx="72" cy="340" r="28" fill="none" stroke="#BFDC22" stroke-width="6"/>
      <path d="M72 312a28 28 0 1 1-26.63 19.35" fill="none" stroke="#15171C" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="340" font-size="20" font-weight="800" fill="#15171C" text-anchor="middle">4</text>
      <text x="72" y="354" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">min</text>
    </g>
    <text x="116" y="334" font-size="20" font-weight="700" fill="#15171C">Held until 08:43</text>
    <text x="116" y="356" font-size="14" font-weight="500" fill="#15171C">Spain time · for Mateo to confirm</text>
  </g>
  <g id="details">
    <rect x="20.5" y="399.5" width="349" height="191" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="415" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 421) scale(0.8333)" d="M5 6h14v14H5zm0 4h14M9 4v4m6-4v4" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="427" font-size="17" font-weight="700" fill="#15171C">Today 09:00–10:00</text>
    <text x="80" y="447" font-size="14" font-weight="500" fill="#555A66">Spain time · Terrace door adjustment</text>
    <path d="M36 463.5h318" stroke="#DED8CB"/>
    <rect x="36" y="479" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 485) scale(0.8333)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zm0-12.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="491" font-size="17" font-weight="700" fill="#15171C">Xàbia</text>
    <text x="80" y="511" font-size="14" font-weight="500" fill="#555A66">Address opens when Mateo confirms you</text>
    <path d="M36 527.5h318" stroke="#DED8CB"/>
    <rect x="36" y="543" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 549) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-9 9h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="555" font-size="17" font-weight="700" fill="#15171C">Briefing in Español</text>
    <text x="80" y="575" font-size="14" font-weight="500" fill="#555A66">In person with Mateo, before work</text>
  </g>
  <text x="195" y="620" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">You accepted at 08:38 Spain time</text>
  <text x="195" y="642" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">No confirmation by 08:43 means not assigned</text>
  <g id="dock">
    <rect y="686" width="390" height="158" fill="#FFFFFF"/>
    <path d="M0 686.5h390" stroke="#DED8CB"/>
    <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Withdrawing gives the place back to Mateo</text>
    <rect x="21" y="733" width="348" height="60" rx="30" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <text x="195" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Withdraw acceptance</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
