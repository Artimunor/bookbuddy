<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-03-offer--filled-elsewhere-title W-03-offer--filled-elsewhere-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-03-offer--filled-elsewhere-title">W-03 Offer — filled elsewhere, read-only</title>
  <desc id="W-03-offer--filled-elsewhere-desc">Worker view for Lucía Ortega, the other own-crew candidate at Reformas Ruiz, at 08:41 Spain time on Tuesday 24 November, Field mode on. Her cover offer closed at 08:40 when Mateo confirmed someone else; the screen never says who. The capsule has gone quiet: a white card with nothing lime, the badge Filled, the words Offer filled, by someone else, 08:40 Spain time, and a static crew glyph in place of the offer clock beside You are not assigned, nothing to do, do not travel. The offer stays readable: today 09:00 to 10:00, terrace door adjustment in Xàbia; it closed before she replied, sent 08:33 and filled 08:40 Spain time. A card says she is still open to cover today until 18:00, changeable in Availability. There is no Accept or Decline. One ink action: Back to Now.</desc>
