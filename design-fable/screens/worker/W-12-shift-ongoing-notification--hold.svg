<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-12-shift-ongoing-notification--hold-title W-12-shift-ongoing-notification--hold-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-12-shift-ongoing-notification--hold-title">W-12 Shift ongoing notification — collapsed, safety hold</title>
  <desc id="W-12-shift-ongoing-notification--hold-desc">System surface on Diego Torres’s Android phone at 09:15 Spain time on Tuesday 24 November, one minute after he checked in, with the notification shade open. The ongoing BookBuddy shift notification is collapsed and shows a safety hold: a hand icon in amber, BookBuddy, a system chronometer at 1 minute 8 seconds, the title Safety hold, open the app, and the text Work can’t start yet, checked in 09:14. No instruction text, address or customer name is shown. Tapping opens the live shift, where the hold banner leads to the safety instruction. When the hold ends the notification returns to On site without saying that anything was cleared.</desc>
