    <rect x="21" y="665" width="108" height="62" rx="31" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <text x="75" y="702" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Decline</text>
    <rect x="143" y="665" width="226" height="62" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <text x="256" y="702" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Accept offer</text>
  </g>
