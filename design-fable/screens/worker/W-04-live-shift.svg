<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-04-live-shift-title W-04-live-shift-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-04-live-shift-title">W-04 Live shift — confirmed, before setting off</title>
  <desc id="W-04-live-shift-desc">Worker view for Diego Torres at 08:42 Spain time on Tuesday 24 November, Field mode on. Mateo Ruiz confirmed him as cover at 08:40. The lime shift capsule says Confirmed: today 09:00 to 10:00 Spain time, starts in 18 minutes, at Villa Mar in Xàbia, terrace door adjustment, door fitting. His own day line is at step one of five, Confirmed. A safety hold banner says version 2 applies and Mateo briefs him on site before work; it does not stop travel or check-in. Rows open the site briefing and the crew-only chat with Mateo. A separate button says Can’t make it. The dock says the action tells Mateo he has set off and that no location is used. One lime action: On my way.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:42</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Your shift</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="shift-capsule">
    <rect x="21" y="115" width="348" height="268" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <rect x="40" y="134" width="100" height="28" rx="14" fill="#15171C"/>
    <path d="m50 148 3.5 3.5 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="153" font-size="12" font-weight="600" fill="#FFFFFF">Confirmed</text>
    <text x="350" y="153" font-size="14" font-weight="600" fill="#15171C" text-anchor="end">Reformas Ruiz</text>
    <text x="40" y="198" font-size="28" font-weight="800" fill="#15171C">Today 09:00–10:00</text>
    <text x="40" y="220" font-size="14" font-weight="500" fill="#15171C">Spain time · starts in 18 min</text>
    <text x="40" y="252" font-size="17" font-weight="700" fill="#15171C">Villa Mar · Xàbia</text>
    <text x="40" y="273" font-size="14" font-weight="500" fill="#15171C">Terrace door adjustment · Door fitting</text>
    <g id="day-line">
      <path d="M50 306H340" stroke="#BFDC22" stroke-width="6" stroke-linecap="round"/>
      <circle cx="50" cy="306" r="15" fill="none" stroke="#15171C" stroke-width="2"/><circle cx="50" cy="306" r="10" fill="#15171C"/><circle cx="50" cy="306" r="3" fill="#D6F33C"/>
      <circle cx="122.5" cy="306" r="8" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <circle cx="195" cy="306" r="8" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <circle cx="267.5" cy="306" r="8" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <circle cx="340" cy="306" r="8" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="40" y="338" font-size="12" font-weight="700" fill="#15171C">Confirmed</text>
      <text x="195" y="338" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">On site</text>
      <text x="267.5" y="338" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">Working</text>
      <text x="350" y="338" font-size="12" font-weight="600" fill="#15171C" text-anchor="end">Finished</text>
    </g>
    <text x="40" y="365" font-size="14" font-weight="600" fill="#15171C">Confirmed by Mateo · 08:40 Spain time</text>
  </g>
  <g id="hold-banner">
    <rect x="20" y="395" width="350" height="72" rx="24" fill="#FFEFCF"/>
    <path transform="translate(36 419)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="425" font-size="17" font-weight="700" fill="#6E4300">Safety hold · version 2</text>
    <text x="72" y="447" font-size="14" font-weight="500" fill="#6E4300">Mateo briefs you on site before work</text>
    <path transform="translate(330 419)" d="m10 6 6 6-6 6" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="rows">
    <rect x="20.5" y="479.5" width="349" height="127" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="495" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 501) scale(0.8333)" d="M7 3h7l4 4v14H7zm7 0v4h4M10 12h5m-5 4h5" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="507" font-size="17" font-weight="700" fill="#15171C">Site briefing</text>
    <text x="80" y="527" font-size="14" font-weight="500" fill="#555A66">Arrival plan and safety instruction</text>
    <path transform="translate(326 499)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 543.5h318" stroke="#DED8CB"/>
    <rect x="36" y="559" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 565) scale(0.8333)" d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="571" font-size="17" font-weight="700" fill="#15171C">Crew only chat</text>
    <text x="80" y="591" font-size="14" font-weight="500" fill="#555A66">Mateo and you</text>
    <path transform="translate(326 563)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="other-actions">
    <rect x="21" y="619" width="180" height="54" rx="27" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <text x="111" y="652" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Already on site?</text>
    <rect x="219" y="619" width="150" height="54" rx="27" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <text x="294" y="652" font-size="17" font-weight="700" fill="#8A2F28" text-anchor="middle">Can’t make it</text>
  </g>
  <g id="dock">
    <rect y="686" width="390" height="158" fill="#FFFFFF"/>
    <path d="M0 686.5h390" stroke="#DED8CB"/>
    <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Tells Mateo you’ve set off · no location is used</text>
    <rect x="21" y="733" width="348" height="60" rx="30" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <text x="195" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">On my way</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
