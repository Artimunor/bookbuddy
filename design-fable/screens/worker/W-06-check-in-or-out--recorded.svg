  <desc id="W-06-check-in-or-out--recorded-desc">Diego at 09:14 Spain time on Tuesday 24 November. His deliberate check-in is recorded; work remains on hold. The optional card reads “BookBuddy shift · Open app” unless he separately allows details. Showing the card or choosing Not now changes nothing about his attendance.</desc>
