    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Your shift</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="shift-capsule">
    <rect x="21" y="115" width="348" height="268" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <rect x="40" y="134" width="100" height="28" rx="14" fill="#15171C"/>
    <path d="m50 148 3.5 3.5 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="153" font-size="12" font-weight="600" fill="#FFFFFF">Confirmed</text>
    <text x="350" y="153" font-size="14" font-weight="600" fill="#15171C" text-anchor="end">Reformas Ruiz</text>
  </g>
  <g id="sheet">
    <rect width="390" height="844" fill="#15171C" opacity="0.4"/>
    <path d="M0 208a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32V844H0z" fill="#FFFFFF"/>
    <rect x="171" y="186" width="48" height="5" rx="2.5" fill="#DED8CB"/>
    <text x="20" y="230" font-size="20" font-weight="700" fill="#15171C">Can’t make it?</text>
    <text x="370" y="229" font-size="17" font-weight="700" fill="#2438B5" text-anchor="end">Close</text>
    <path d="M324.2 233.5h45.8" stroke="#2438B5" stroke-width="1.5"/>
    <text x="20" y="254" font-size="14" font-weight="500" fill="#555A66">BB-1042 · today 09:00–10:00 Spain time</text>
    <g id="scope">
      <rect x="20.5" y="270.5" width="349" height="71" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
      <rect x="36" y="290" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 296) scale(0.8333)" d="M5 6h14v14H5zm0 4h14M9 4v4m6-4v4" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="302" font-size="17" font-weight="700" fill="#15171C">Villa Mar · Xàbia</text>
      <text x="80" y="322" font-size="14" font-weight="500" fill="#555A66">Terrace door adjustment · starts in 29 min</text>
    </g>
    <g id="effect">
      <rect x="20" y="354" width="350" height="122" rx="24" fill="#FCE6E3"/>
      <text x="40" y="382" font-size="14" font-weight="700" fill="#8A2F28">When you send this</text>
      <path transform="translate(36 391) scale(0.8333)" d="M12 12h.01M8.500 8.500a5 5 0 0 0 0 7m7-7a5 5 0 0 1 0 7M5.500 5.500a9 9 0 0 0 0 13m13-13a9 9 0 0 1 0 13" fill="none" stroke="#8A2F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="406" font-size="14" font-weight="500" fill="#8A2F28">Mateo is told now and looks for cover</text>
