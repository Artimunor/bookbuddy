      <text x="66" y="432" font-size="14" font-weight="600" fill="#8A2F28">You come off this shift. No undo here.</text>
      <path transform="translate(36 443) scale(0.8333)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#8A2F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="458" font-size="14" font-weight="500" fill="#8A2F28">The customer never sees your reason</text>
    </g>
    <text x="20" y="504" font-size="14" font-weight="600" fill="#15171C">Reason · optional · only Mateo sees it</text>
