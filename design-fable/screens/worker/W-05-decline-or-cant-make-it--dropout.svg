      <path d="m42 542 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="547" font-size="14" font-weight="700" fill="#FFFFFF">Transport</text>
      <rect x="170.5" y="518.5" width="127" height="47" rx="23.5" fill="#FFFFFF" stroke="#747986"/>
      <text x="234" y="547" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Another job</text>
      <rect x="20.5" y="578.5" width="107" height="47" rx="23.5" fill="#FFFFFF" stroke="#747986"/>
      <text x="74" y="607" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Personal</text>
      <rect x="140.5" y="578.5" width="159" height="47" rx="23.5" fill="#FFFFFF" stroke="#747986"/>
      <text x="220" y="607" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">Prefer not to say</text>
    </g>
    <g id="sheet-dock">
      <path d="M0 686.5h390" stroke="#DED8CB"/>
      <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Send online to notify Mateo and leave this shift</text>
      <rect x="21" y="733" width="150" height="60" rx="30" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
      <text x="96" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Keep shift</text>
      <rect x="189" y="733" width="180" height="60" rx="30" fill="#FFFFFF" stroke="#8A2F28" stroke-width="2"/>
      <text x="279" y="769" font-size="17" font-weight="700" fill="#8A2F28" text-anchor="middle">Tell Mateo</text>
    </g>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
