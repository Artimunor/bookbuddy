<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-05-decline-or-cant-make-it--dropout-title W-05-decline-or-cant-make-it--dropout-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-05-decline-or-cant-make-it--dropout-title">W-05 Decline or can’t make it — dropout from a confirmed shift</title>
  <desc id="W-05-decline-or-cant-make-it--dropout-desc">Worker view for Nadia Benali, the original assignee at Reformas Ruiz, at 08:31 Spain time on Tuesday 24 November, Field mode on. The Can’t make it sheet sits over her dimmed confirmed shift for BB-1042, today 09:00 to 10:00 Spain time. The scope card names the shift: Villa Mar in Xàbia, terrace door adjustment, starts in 29 minutes. A critical card says what happens when she sends this: Mateo is told now and looks for cover; she comes off this shift with no undo here; the customer never sees her reason. A reason is optional and only Mateo sees it: the chips are Transport, selected, Another job, Personal and Prefer not to say; health is not asked. The dock says it is sent online and Mateo is told at once. Two actions, 16 units apart: Keep shift, and Tell Mateo with a critical outline. She sends it at 08:32.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:31</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
