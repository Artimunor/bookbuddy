      <circle cx="72" cy="284" r="28" fill="none" stroke="#BFDC22" stroke-width="6"/>
      <path d="M72 256a28 28 0 1 1-26.31 37.58" fill="none" stroke="#15171C" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="284" font-size="20" font-weight="800" fill="#15171C" text-anchor="middle">5</text>
      <text x="72" y="298" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">min</text>
    </g>
    <text x="116" y="278" font-size="20" font-weight="700" fill="#15171C">Reply by 08:42</text>
    <text x="116" y="300" font-size="14" font-weight="500" fill="#15171C">Spain time · the offer closes then</text>
  </g>
  <g id="details">
    <rect x="20.5" y="343.5" width="349" height="255" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="359" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 365) scale(0.8333)" d="M6 21V4h11v17M3 21h18M13.5 12.5h.01" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
