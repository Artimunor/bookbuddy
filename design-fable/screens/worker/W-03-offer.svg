<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-03-offer-title W-03-offer-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-03-offer-title">W-03 Offer — own-crew cover offer, open</title>
  <desc id="W-03-offer-desc">Diego, a worker on duty at Reformas Ruiz, views a cover offer at 08:37 Spain time on Tuesday 24 November. Mateo selected him at 08:33. The shift is 09:00–10:00 and the reply deadline is 08:42, five minutes away. Task: terrace door adjustment in Xàbia. Skill: door fitting. Mateo will brief him in Español. The offer does not conflict with his other shift. Accept offer opens a confirmation sheet. An accepted reply reserves the place; the site address opens only when Mateo confirms him.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:37</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
