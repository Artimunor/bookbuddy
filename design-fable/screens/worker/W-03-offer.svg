  <text x="195" y="626" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Sent by Mateo Ruiz · 08:33 Spain time</text>
  <text x="195" y="648" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Only selected workers on duty in your crew</text>
  <g id="dock">
