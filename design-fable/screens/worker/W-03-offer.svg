    <text x="80" y="499" font-size="17" font-weight="700" fill="#15171C">Briefing in Español</text>
    <text x="80" y="519" font-size="14" font-weight="500" fill="#555A66">In person with Mateo, before work</text>
    <path d="M36 535.5h318" stroke="#DED8CB"/>
    <rect x="36" y="551" width="32" height="32" rx="12" fill="#E1F3E4"/><path transform="translate(42 557) scale(0.8333)" d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="563" font-size="17" font-weight="700" fill="#15171C">You’re free at this time</text>
    <text x="80" y="583" font-size="14" font-weight="500" fill="#555A66">No clash with your other shifts</text>
