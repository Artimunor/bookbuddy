<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-12-shift-ongoing-notification--expanded-title W-12-shift-ongoing-notification--expanded-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-12-shift-ongoing-notification--expanded-title">W-12 Shift ongoing notification — expanded</title>
  <desc id="W-12-shift-ongoing-notification--expanded-desc">System surface on Diego Torres’s Android phone at 09:40 Spain time on Tuesday 24 November, with the ongoing BookBuddy shift notification expanded. A pin icon, BookBuddy and a system chronometer at 26 minutes 12 seconds. Title: On site, since check-in 09:14. Reformas Ruiz, BB-1042, Xàbia. Spain time, his own tap, no location. Time since check-in, not hours worked. One action, Check out, opens the check-out sheet in the app and records nothing by itself. No address, customer name or message text is shown, and nothing says that a safety hold was cleared.</desc>
