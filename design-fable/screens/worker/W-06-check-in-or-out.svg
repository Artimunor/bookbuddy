<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-06-check-in-or-out-title W-06-check-in-or-out-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-06-check-in-or-out-title">W-06 Check in or out — check-in ready, attendance only during the safety hold</title>
  <desc id="W-06-check-in-or-out-desc">Worker view for Diego Torres at 09:14 Spain time on Tuesday 24 November, Field mode on: the Check in sheet over his dimmed shift screen for BB-1042 Terrace door repair, opened by the Check in action. The sheet names one event. An ink-bordered card shows his check-in time, 09:14 Spain time, Tuesday 24 November, now, at Villa Mar in Xàbia for the shift 09:00 to 10:00. A green notice says no location is used: his tap is the record, no GPS and no map. An amber notice says attendance only for now: the safety hold is on and work waits for Mateo’s briefing. A blue notice says Mateo sees his name and 09:14, and the customer sees Crew on site, 09:14. An optional switch, on, keeps a shift card on his Lock Screen and starts it when he checks in; a link explains what the card shows. Close is at the top and changes nothing. The sheet’s dock says the action records 09:14 Spain time as his check-in. One lime action: Record check-in.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:14</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Your shift</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="shift-capsule">
    <rect x="21" y="115" width="348" height="268" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
  </g>
  <g id="sheet">
    <rect width="390" height="844" fill="#15171C" opacity="0.4"/>
    <path d="M0 152a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32V844H0z" fill="#FFFFFF"/>
    <rect x="171" y="130" width="48" height="5" rx="2.5" fill="#DED8CB"/>
    <text x="20" y="172" font-size="20" font-weight="700" fill="#15171C">Check in</text>
    <text x="370" y="171" font-size="17" font-weight="700" fill="#2438B5" text-anchor="end">Close</text>
    <path d="M324.2 175.5h45.8" stroke="#2438B5" stroke-width="1.5"/>
    <text x="20" y="196" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
    <g id="event">
      <rect x="21" y="211" width="348" height="126" rx="23" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/>
      <text x="40" y="240" font-size="14" font-weight="600" fill="#555A66">Your check-in time</text>
      <text x="40" y="284" font-size="40" font-weight="800" fill="#15171C">09:14</text>
      <text x="168" y="266" font-size="17" font-weight="700" fill="#15171C">Spain time</text>
      <text x="168" y="286" font-size="14" font-weight="500" fill="#555A66">Tue, 24 Nov · now</text>
      <text x="40" y="318" font-size="14" font-weight="600" fill="#15171C">Villa Mar · Xàbia · shift 09:00–10:00</text>
    </g>
    <g id="no-location">
      <rect x="20" y="349" width="350" height="60" rx="24" fill="#E1F3E4"/>
      <path transform="translate(36 367)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.500-6 10-6 10zM4 3l16 18" fill="none" stroke="#1E5A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="374" font-size="14" font-weight="600" fill="#1E5A32">No location is used</text>
      <text x="70" y="394" font-size="12" font-weight="600" fill="#1E5A32">Your tap is the record. No GPS, no map.</text>
    </g>
    <g id="attendance-only">
      <rect x="20" y="421" width="350" height="60" rx="24" fill="#FFEFCF"/>
      <path transform="translate(36 439)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="446" font-size="14" font-weight="600" fill="#6E4300">Attendance only for now</text>
      <text x="70" y="466" font-size="12" font-weight="600" fill="#6E4300">Safety hold · work waits for Mateo’s briefing</text>
    </g>
    <g id="who-sees">
      <rect x="20" y="493" width="350" height="60" rx="24" fill="#E3EEFB"/>
      <path transform="translate(36 511)" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="518" font-size="14" font-weight="600" fill="#1E4A7D">Mateo sees your name and 09:14</text>
      <text x="70" y="538" font-size="12" font-weight="600" fill="#1E4A7D">The customer sees “Crew on site · 09:14”</text>
    </g>
    <g id="lock-screen-opt-in">
      <rect x="20.5" y="565.5" width="349" height="71" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
      <text x="40" y="597" font-size="17" font-weight="700" fill="#15171C">Lock Screen shift card</text>
      <text x="40" y="619" font-size="14" font-weight="500" fill="#555A66">Optional · starts when you check in</text>
      <rect x="298" y="585" width="56" height="32" rx="16" fill="#15171C"/><circle cx="338" cy="601" r="12" fill="#FFFFFF"/>
    </g>
    <text x="20" y="664" font-size="14" font-weight="700" fill="#2438B5">What the card shows</text>
    <path d="M20 668.5h140" stroke="#2438B5" stroke-width="1.5"/>
    <g id="sheet-dock">
      <path d="M0 686.5h390" stroke="#DED8CB"/>
      <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Records 09:14 Spain time as your check-in</text>
      <rect x="21" y="733" width="348" height="60" rx="30" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
      <text x="195" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Record check-in</text>
    </g>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
