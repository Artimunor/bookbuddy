      <rect x="20" y="458" width="350" height="112" rx="24" fill="#15171C"/>
      <circle cx="44" cy="482" r="9" fill="none" stroke="#D6F33C" stroke-width="1.5"/><circle cx="44" cy="482" r="5" fill="#D6F33C"/>
      <text x="62" y="487" font-size="14" font-weight="600" fill="#F6F3EC">Reformas Ruiz</text>
      <text x="350" y="487" font-size="12" font-weight="600" fill="#B1B5C0" text-anchor="end">Shared by Diego · 10:16</text>
      <text x="40" y="516" font-size="14" font-weight="700" fill="#D6F33C">On the way · arriving</text>
      <text x="40" y="550" font-size="28" font-weight="800" fill="#F6F3EC">10:25–10:35</text>
      <text x="350" y="548" font-size="12" font-weight="600" fill="#B1B5C0" text-anchor="end">Spain time</text>
    </g>
    <text x="20" y="594" font-size="14" font-weight="500" fill="#555A66">You lead this visit, so the customer sees</text>
    <text x="20" y="614" font-size="14" font-weight="500" fill="#555A66">this at once. Mateo can correct it.</text>
    <g id="no-location">
