      <rect x="21" y="321" width="165" height="62" rx="15" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
      <text x="36" y="348" font-size="17" font-weight="700" fill="#15171C">10:30–10:40</text>
      <text x="36" y="369" font-size="14" font-weight="500" fill="#555A66">About 20 min</text>
      <rect x="204" y="321" width="165" height="62" rx="15" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
      <text x="219" y="348" font-size="17" font-weight="700" fill="#15171C">10:40–10:50</text>
      <text x="219" y="369" font-size="14" font-weight="500" fill="#555A66">About 30 min</text>
