<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-10-on-my-way--crew-lead-title W-10-on-my-way--crew-lead-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-10-on-my-way--crew-lead-title">W-10 On my way — ready, crew lead</title>
  <desc id="W-10-on-my-way--crew-lead-desc">Worker view for Diego Torres at 10:16 Spain time on Tuesday 24 November, after check-out at Villa Mar. He leads the 10:30–12:30 window lock replacement at Casa Montgó in Xàbia, BB-1049. The selected estimate is 10:25–10:35 Spain time, about 15 minutes. The customer preview names Reformas Ruiz, the crew’s estimate and Diego as its source. Sending publishes the estimate to the customer and Mateo; Mateo can correct it. No location is used.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="parent" aria-hidden="true">
    <g fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">10:16</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
