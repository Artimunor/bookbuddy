<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-07-progress-photos-title W-07-progress-photos-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-07-progress-photos-title">W-07 Progress photos — review before sending</title>
  <desc id="W-07-progress-photos-desc">Worker view for Diego Torres at 09:31 Spain time on Tuesday 24 November, Field mode on, reviewing one photo for BB-1042 Terrace door repair before he sends it. A notice says the photo is for Mateo only, that Mateo decides what the customer sees, and to keep people and gate codes out of shot. The photo, drawn as a diagram of a worn bottom track, was taken at 09:29 and is on this phone, with a Remove link. The caption is in his own words, in Spanish, and optional: Carril inferior desgastado. Mateo reads Español, so it is sent as he wrote it. A button adds another photo. One photo is ready and nothing is sent yet. The dock says it goes to Mateo’s site log, crew only. One action: Send 1 photo to Mateo.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:31</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Progress photos</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="audience-notice">
    <rect x="20" y="114" width="350" height="88" rx="24" fill="#E3EEFB"/>
    <path transform="translate(36 130)" d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v9H6z" fill="none" stroke="#1E4A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="144" font-size="17" font-weight="700" fill="#1E4A7D">For Mateo only</text>
    <text x="70" y="166" font-size="14" font-weight="500" fill="#1E4A7D">He decides what the customer sees.</text>
    <text x="70" y="186" font-size="14" font-weight="500" fill="#1E4A7D">Keep people and gate codes out of shot.</text>
  </g>
  <g id="photo-review">
    <rect x="20.5" y="214.5" width="349" height="282" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <g id="photo-1" transform="translate(40 230)">
      <rect width="310" height="116" rx="12" fill="#FFE3D3"/>
      <path d="M0 78h310v26a12 12 0 0 1-12 12H12a12 12 0 0 1-12-12z" fill="#DED8CB"/>
      <path d="M12 78h286M12 90h286" stroke="#15171C" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 78v12m44-12v12m102-12v12m44-12v12" stroke="#15171C" stroke-width="2" stroke-linecap="round"/>
      <circle cx="84" cy="66" r="11" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><circle cx="84" cy="66" r="2.5" fill="#15171C"/>
      <circle cx="228" cy="68" r="9" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><circle cx="228" cy="68" r="2" fill="#15171C"/>
      <path d="M124 58l12-12 12 9 16-16 14 13" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0.5" y="0.5" width="309" height="115" rx="11.5" fill="none" stroke="#DED8CB"/>
    </g>
    <text x="40" y="372" font-size="14" font-weight="500" fill="#555A66">Taken 09:29 · on this phone</text>
    <text x="350" y="372" font-size="14" font-weight="700" fill="#8A2F28" text-anchor="end" text-decoration="underline">Remove</text>
    <text x="40" y="398" font-size="12" font-weight="600" fill="#555A66">Caption · your words, optional</text>
    <rect x="40.5" y="406.5" width="309" height="51" rx="16" fill="#FFFFFF" stroke="#747986"/>
    <text x="56" y="438" font-size="16" font-weight="400" fill="#15171C">Carril inferior desgastado</text>
    <text x="40" y="478" font-size="14" font-weight="500" fill="#555A66">Mateo reads Español · sent as you wrote it</text>
  </g>
  <g id="add-photo">
    <rect x="21" y="511" width="348" height="54" rx="27" fill="#FFFFFF" stroke="#747986" stroke-width="2"/>
    <path transform="translate(103 526)" d="M12 5v14M5 12h14" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="544" font-size="17" font-weight="700" fill="#15171C">Add another photo</text>
  </g>
  <text x="195" y="596" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">1 photo ready · nothing is sent yet</text>
  <g id="dock">
    <rect y="686" width="390" height="158" fill="#FFFFFF"/>
    <path d="M0 686.5h390" stroke="#DED8CB"/>
    <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Goes to Mateo’s site log · Crew only</text>
    <rect x="20" y="732" width="350" height="62" rx="31" fill="#15171C"/>
    <text x="195" y="769" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send 1 photo to Mateo</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
