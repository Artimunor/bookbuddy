    <path d="M324.2 175.5h45.8" stroke="#2438B5" stroke-width="1.5"/>
    <text x="20" y="196" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
    <g id="offline-line">
      <rect x="20" y="211" width="350" height="48" rx="24" fill="#FFEFCF"/>
      <path transform="translate(36 223)" d="M2 8.500a15 15 0 0 1 20 0M5 12a10.500 10.500 0 0 1 14 0M8.500 15.500a5.500 5.500 0 0 1 7 0M12 19h.01M3 3l18 18" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="240" font-size="14" font-weight="600" fill="#6E4300">Offline · last confirmed 09:12 Spain time</text>
    </g>
    <g id="saved-event">
      <rect x="21" y="272" width="348" height="152" rx="23" fill="#FFFFFF" stroke="#747986" stroke-width="2" stroke-dasharray="6 6"/>
      <rect x="40.5" y="290.500" width="31" height="31" rx="11.500" fill="#FFFFFF" stroke="#747986" stroke-dasharray="4 4"/>
      <path transform="translate(46 296) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4.500V12l3 2" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
