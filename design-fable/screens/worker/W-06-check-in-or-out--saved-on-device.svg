      <text x="66" y="566" font-size="14" font-weight="600" fill="#6E4300">Work still waits for Mateo’s briefing</text>
    </g>
    <g id="sheet-dock">
      <path d="M0 686.5h390" stroke="#DED8CB"/>
      <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">It sends by itself when you’re back online</text>
      <rect x="20" y="732" width="350" height="62" rx="31" fill="#15171C"/>
      <text x="195" y="769" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Back to your shift</text>
