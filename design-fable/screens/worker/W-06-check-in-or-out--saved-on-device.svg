<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-06-check-in-or-out--saved-on-device-title W-06-check-in-or-out--saved-on-device-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-06-check-in-or-out--saved-on-device-title">W-06 Check in or out — check-in saved on this device, pending sync</title>
  <desc id="W-06-check-in-or-out--saved-on-device-desc">Alternative branch: Diego Torres at 09:14 Spain time on Tuesday 24 November, Field mode on, tapped Record check-in with no connection. The Check in sheet stays open over his dimmed shift screen and shows the result. An amber line says Offline, last confirmed 09:12 Spain time. A dashed card, the pending-sync style, says Saved on this device, pending sync, not sent yet: 09:14 Spain time, Tuesday 24 November, his tap, at Villa Mar in Xàbia, shift 09:00 to 10:00. Until it syncs: Mateo does not see his check-in yet; the customer still sees On the way; it sends once when he is online, timed 09:14; work still waits for Mateo’s briefing. Nothing calls it recorded, checked in or cleared. The dock says it sends by itself when he is back online. One ink action: Back to your shift.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">9:14</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
