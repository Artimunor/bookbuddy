    <text x="40" y="592" font-size="14" font-weight="500" fill="#555A66">Mateo can send you short-notice offers on</text>
    <text x="40" y="612" font-size="14" font-weight="500" fill="#555A66">this day until 18:00. You choose each time.</text>
