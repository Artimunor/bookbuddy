<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-08-availability-title W-08-availability-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-08-availability-title">W-08 Availability — available</title>
  <desc id="W-08-availability-desc">Worker view for Diego Torres at Reformas Ruiz on Monday 23 November, Field mode on, times in Spain time. A week strip for 23 to 29 November 2026 marks today, Monday 23, and selects Tuesday 24; a dot means hours are set, a cross means unavailable and no mark means not set. Previous and next week buttons sit beside the range. The day card for Tuesday 24 November is Available: the choice Available is selected beside Unavailable; he can work 08:00 to 18:00, with a Change button; and a row shows his confirmed shift from 10:30 to 12:30, which stays as it is. Open to cover is on for this day: Mateo can send him short-notice offers until 18:00 and he chooses each time. Each change applies at once and shows a receipt: Saved, Monday 23 November 09:38 Spain time. Mateo sees his hours, not his reasons, and changing availability never cancels a shift. There is no primary action.</desc>
