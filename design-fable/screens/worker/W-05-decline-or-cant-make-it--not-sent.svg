  <title id="W-05-decline-or-cant-make-it--not-sent-title">W-05 Decline or can’t make it — not sent offline</title>
  <desc id="W-05-decline-or-cant-make-it--not-sent-desc">Alternative at 08:32 Spain time. Nadia’s phone is offline before it could send her dropout. Mateo has not been notified; her assignment stands. Her optional Transport selection is retained and not queued. Reconnect and send deliberately, or use the usual provider contact if urgent.</desc>
