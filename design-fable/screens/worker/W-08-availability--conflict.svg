<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-08-availability--conflict-title W-08-availability--conflict-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-08-availability--conflict-title">W-08 Availability — conflict with a confirmed shift</title>
  <desc id="W-08-availability--conflict-desc">Worker view for Diego Torres at Reformas Ruiz on Monday 23 November, Field mode on, times in Spain time, in a branch where he has just marked Tuesday 24 November unavailable. The week strip shows a cross on Tuesday. The day card reads Unavailable, with Unavailable selected beside Available. A warning says he still has a shift from 10:30 to 12:30: marking the day unavailable does not cancel it, and to drop it he must tell Mateo from the shift. The shift row still reads Confirmed, stays as it is. Open to cover is off while this day is unavailable. The change is saved, Monday 23 November 09:40 Spain time. The dock says his 10:30 shift is still confirmed. One action: Open shift 10:30 to 12:30.</desc>
