<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-09-site-briefing-title W-09-site-briefing-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-09-site-briefing-title">W-09 Site briefing — readable, before setting off</title>
  <desc id="W-09-site-briefing-desc">Worker view for Diego Torres at 08:44 Spain time on Tuesday 24 November, Field mode on, four minutes after Mateo Ruiz confirmed him as cover. A safety hold banner says version 2 applies: Mateo briefs him on site before work, and he can travel and check in. Where and when: Villa Mar in Xàbia, 12 Carrer de la Porta Verda, a fictional address shown since he was confirmed; today 09:00 to 10:00 Spain time, starting in 16 minutes. The arrival plan from Mateo Ruiz at 08:41 is a twin card. The English translation is on top: Park on the street. Come in by the side gate; it is unlocked. Wait for me there before you start anything. Mateo’s exact Spanish original is attached beneath. A link offers Ask Mateo about arriving. The dock says to read the instruction now and acknowledge after the briefing. One action: Open safety instruction. No gate or alarm code is shown.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:44</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Site briefing</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">BB-1042 · Terrace door repair</text>
  </g>
  <g id="hold-banner">
    <rect x="20" y="114" width="350" height="92" rx="24" fill="#FFEFCF"/>
    <path transform="translate(36 130)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#6E4300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="144" font-size="17" font-weight="700" fill="#6E4300">Safety hold · version 2</text>
    <text x="70" y="166" font-size="14" font-weight="500" fill="#6E4300">Mateo briefs you on site before work.</text>
    <text x="70" y="186" font-size="14" font-weight="500" fill="#6E4300">You can travel and check in.</text>
  </g>
  <g id="where-and-when">
    <rect x="20.5" y="218.5" width="349" height="126" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <rect x="36" y="232" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 238) scale(0.8333)" d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zm0-12a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="246" font-size="17" font-weight="700" fill="#15171C">Villa Mar · Xàbia</text>
    <text x="80" y="266" font-size="14" font-weight="500" fill="#555A66">12 Carrer de la Porta Verda</text>
    <path transform="translate(326 236)" d="m10 6 6 6-6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 281.5h318" stroke="#DED8CB"/>
    <rect x="36" y="296" width="32" height="32" rx="12" fill="#ECE8DE"/><path transform="translate(42 302) scale(0.8333)" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 2" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="310" font-size="17" font-weight="700" fill="#15171C">Today 09:00–10:00</text>
    <text x="80" y="330" font-size="14" font-weight="500" fill="#555A66">Spain time · starts in 16 min</text>
  </g>
  <g id="arrival-plan-twin-card">
    <rect x="20.5" y="356.5" width="349" height="256" rx="24" fill="#FFFFFF" stroke="#DED8CB"/>
    <path d="M21 500h348v88.5a24 24 0 0 1-24 24H45a24 24 0 0 1-24-24z" fill="#ECE8DE"/>
    <rect x="20.5" y="356.5" width="349" height="256" rx="24" fill="none" stroke="#DED8CB"/>
    <text x="40" y="386" font-size="17" font-weight="700" fill="#15171C">Arrival plan</text>
    <text x="350" y="386" font-size="14" font-weight="500" fill="#555A66" text-anchor="end">Mateo Ruiz · 08:41</text>
    <text x="40" y="412" font-size="12" font-weight="600" fill="#1E4A7D">Translation · English</text>
    <text x="40" y="436" font-size="16" font-weight="400" fill="#15171C">Park on the street. Come in by the</text>
    <text x="40" y="460" font-size="16" font-weight="400" fill="#15171C">side gate; it is unlocked. Wait for</text>
    <text x="40" y="484" font-size="16" font-weight="400" fill="#15171C">me there before you start anything.</text>
    <text x="40" y="522" font-size="12" font-weight="600" fill="#555A66">Original · Español · Mateo’s words</text>
    <text x="40" y="546" font-size="16" font-weight="400" fill="#15171C">Aparca en la calle. Entra por la</text>
    <text x="40" y="570" font-size="16" font-weight="400" fill="#15171C">puerta lateral; está abierta. Espérame</text>
    <text x="40" y="594" font-size="16" font-weight="400" fill="#15171C">allí antes de empezar nada.</text>
  </g>
  <text x="20" y="650" font-size="14" font-weight="700" fill="#2438B5" text-decoration="underline">Ask Mateo about arriving</text>
  <g id="dock">
    <rect y="686" width="390" height="158" fill="#FFFFFF"/>
    <path d="M0 686.5h390" stroke="#DED8CB"/>
    <text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Read it now · acknowledge after the briefing</text>
    <rect x="20" y="732" width="350" height="62" rx="31" fill="#15171C"/>
    <text x="195" y="769" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Open safety instruction</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
