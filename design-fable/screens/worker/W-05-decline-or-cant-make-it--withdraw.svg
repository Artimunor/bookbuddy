<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-05-decline-or-cant-make-it--withdraw-title W-05-decline-or-cant-make-it--withdraw-desc" xml:lang="en" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-05-decline-or-cant-make-it--withdraw-title">W-05 Decline or can’t make it — withdraw a provisional acceptance</title>
  <desc id="W-05-decline-or-cant-make-it--withdraw-desc">Alternative at 08:39 Spain time. Diego accepted at 08:38 but has not been assigned. He can release the reservation or keep it. A withdrawal that races with Mateo’s confirmation is never turned into a dropout.</desc>
  <rect width="390" height="844" fill="#F6F3EC"/>
  <g id="status-bar" aria-hidden="true" fill="#15171C"><text x="20" y="29" font-size="15" font-weight="700">8:39</text><rect x="301" y="24" width="3" height="4" rx="1"/><rect x="306" y="22" width="3" height="6" rx="1"/><rect x="311" y="19" width="3" height="9" rx="1"/><rect x="316" y="16" width="3" height="12" rx="1"/><path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#15171C" stroke-width="1.75" stroke-linecap="round"/><circle cx="332" cy="29" r="1.1"/><rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#15171C"/><rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/><path d="M370 20v5c2-1 2-4 0-5z"/></g>
  <g id="header">
    <path transform="translate(20 64)" d="m14 6-6 6 6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="72" font-size="20" font-weight="700" fill="#15171C">Cover offer</text>
    <text x="64" y="94" font-size="14" font-weight="500" fill="#555A66">From Mateo Ruiz · Reformas Ruiz</text>
  </g>
  <g id="offer-capsule">
    <rect x="21" y="115" width="348" height="272" rx="31" fill="#D6F33C" stroke="#15171C" stroke-width="2"/>
    <rect x="40" y="134" width="138" height="28" rx="14" fill="#15171C"/>
    <path d="m50 148 3.5 3.5 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="153" font-size="12" font-weight="600" fill="#FFFFFF">Accepted 08:38</text>
    <text x="350" y="153" font-size="14" font-weight="600" fill="#15171C" text-anchor="end">Your crew</text>
    <text x="40" y="200" font-size="28" font-weight="800" fill="#15171C">Waiting for Mateo</text>
    <g id="do-not-travel">
      <rect x="40" y="214" width="310" height="44" rx="16" fill="#15171C"/>
      <path transform="translate(52 224)" d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5.2-3L5 14.5a1.5 1.5 0 0 1 2.6-1.5L8 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="242" font-size="17" font-weight="700" fill="#FFFFFF">Do not travel yet</text>
    </g>
    <text x="40" y="280" font-size="14" font-weight="600" fill="#15171C">Your place is reserved, not assigned.</text>
    <path d="M40 296.5h310" stroke="#15171C"/>
    <g id="offer-clock">
      <circle cx="72" cy="340" r="28" fill="none" stroke="#BFDC22" stroke-width="6"/>
      <path d="M72 312a28 28 0 1 1-26.63 19.35" fill="none" stroke="#15171C" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="340" font-size="20" font-weight="800" fill="#15171C" text-anchor="middle">4</text>
      <text x="72" y="354" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle">min</text>
    </g>
    <text x="116" y="334" font-size="20" font-weight="700" fill="#15171C">Held until 08:43</text>
    <text x="116" y="356" font-size="14" font-weight="500" fill="#15171C">Spain time · for Mateo to confirm</text>
  </g><g id="sheet">
<rect x="0" y="0" width="390" height="844" rx="0" fill="#15171C" opacity="0.4"/><path d="M0 354a32 32 0 0 1 32-32h326a32 32 0 0 1 32 32V844H0z" fill="#FFFFFF"/><rect x="171" y="332" width="48" height="5" rx="2.5" fill="#DED8CB"/><text x="20" y="374" font-size="20" font-weight="700" fill="#15171C" text-anchor="start">Withdraw your acceptance?</text><text x="370" y="373" font-size="17" font-weight="700" fill="#2438B5" text-anchor="end">Close</text><path d="M324 377.5h46" stroke="#2438B5" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="398" font-size="14" font-weight="500" fill="#555A66" text-anchor="start">Your crew · today 09:00–10:00 Spain time</text><rect x="20" y="420" width="350" height="148" rx="24" fill="#FCE6E3"/><text x="40" y="450" font-size="17" font-weight="700" fill="#8A2F28" text-anchor="start">This releases your reserved place.</text><text x="40" y="483" font-size="14" font-weight="500" fill="#8A2F28" text-anchor="start">Mateo can ask someone else in the crew.</text><text x="40" y="506" font-size="14" font-weight="500" fill="#8A2F28" text-anchor="start">You are not dropping a confirmed shift.</text><text x="40" y="541" font-size="14" font-weight="600" fill="#8A2F28" text-anchor="start">The customer won’t see your reply.</text>
<text x="20" y="606" font-size="17" font-weight="700" fill="#15171C" text-anchor="start">Held until 08:43 Spain time</text><text x="20" y="630" font-size="14" font-weight="500" fill="#555A66" text-anchor="start">Keep my place leaves your acceptance as it is.</text><g id="sheet-dock">
<path d="M0 686.5h390" stroke="#DED8CB" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="712" font-size="14" font-weight="500" fill="#555A66" text-anchor="middle">Only a confirmed withdrawal releases the place.</text><rect x="21" y="733" width="148" height="60" rx="30" fill="#FFFFFF" stroke="#747986" stroke-width="2"/><text x="95" y="769" font-size="17" font-weight="700" fill="#15171C" text-anchor="middle">Keep my place</text><rect x="187" y="733" width="182" height="60" rx="30" fill="#FFFFFF" stroke="#8A2F28" stroke-width="2"/><text x="278" y="769" font-size="17" font-weight="700" fill="#8A2F28" text-anchor="middle">Withdraw</text>
</g>
</g><rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#15171C" aria-hidden="true"/>
</svg>
