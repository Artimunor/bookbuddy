<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-11-shift-live-activity--island-minimal-title W-11-shift-live-activity--island-minimal-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="W-11-shift-live-activity--island-minimal-title">W-11 Shift Live Activity — Dynamic Island, minimal</title>
  <desc id="W-11-shift-live-activity--island-minimal-desc">System surface on Diego Torres’s iPhone Home Screen at 09:40 Spain time on Tuesday 24 November while another app’s timer also has a Live Activity. The other activity takes the main island, shown as a neutral timer. The shift activity is reduced to the minimal presentation: a separate round island holding only the lime pin glyph for On site, with no text and no timer. Tapping it opens the live shift; touching and holding expands the island.</desc>
