<title id="W-06-check-in-or-out--departure-title">W-06 Record departure — review before check-out</title>
<desc id="W-06-check-in-or-out--departure-desc">W-06 over the authenticated live shift. Nadia reviews the actual departure before recording it. Opening the sheet neither stops the clock nor records attendance.</desc>
