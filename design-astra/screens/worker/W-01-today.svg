<title id="W-01-today-title">W-01 Today — arrival recorded, safety hold</title>
<desc id="W-01-today-desc">Worker Nadia Benali’s own active shift at Villa Mar on Tuesday 24 November. Her deliberate 09:14 check-in was received. The terrace door task is still on hold until Mateo verifies teach-back and Nadia acknowledges the current instruction. She can open her briefing, live shift card or contact Mateo.</desc>
