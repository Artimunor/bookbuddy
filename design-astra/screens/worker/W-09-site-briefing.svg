<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="W-09-site-briefing-title W-09-site-briefing-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="W-09-site-briefing-title">W-09 Site briefing — attendance does not clear the hold</title>
<desc id="W-09-site-briefing-desc">Terrace door task on hold. Mateo must verify Nadia’s explanation in a language she understands and Nadia must acknowledge that same version online. Even then wait for Mateo’s site clearance. Arrival note shown in translation and original.</desc>
