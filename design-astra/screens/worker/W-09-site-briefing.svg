<text x="66" y="151" font-size="13" font-weight="700" fill="#704500">SAFETY HOLD · VERSION 1</text>
<text x="36" y="184" font-size="22" font-weight="700" fill="#704500">Do not start the door task.</text>
<text x="36" y="215" font-size="15" font-weight="400" fill="#704500">Explain the safety steps back to Mateo.</text>
<text x="36" y="237" font-size="15" font-weight="400" fill="#704500">Once he verifies your understanding,</text>
<text x="36" y="259" font-size="15" font-weight="400" fill="#704500">acknowledge version 1 online.</text>
<text x="36" y="284" font-size="15" font-weight="650" fill="#704500">Wait for his clearance to use the door.</text>
</g>
