<title id="W-07-add-progress-photos--queued-offline-title">W-07 Progress photos — saved locally</title>
<desc id="W-07-add-progress-photos--queued-offline-desc">One door track photo is safely staged on Nadia’s own device. Her foreman has not received it. Reconcile the existing upload when authorised; never publish it to the customer. Mateo verified Nadia’s teach-back for version 1 at 09:45. Nadia acknowledged version 1 online at 09:47, and Mateo cleared the door task at 09:48. The photo was captured at 09:53 Spain time.</desc>
