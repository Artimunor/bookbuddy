<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="screen-title">F-15 Propose job change</title>
  <desc id="screen-desc">Mateo, authorised publisher for Reformas Ruiz, is drafting Change 1 for Claire. The approved v1 Spanish scope and exclusion remain unchanged. The latch plate proposal adds €40.00, for €280.00 including tax. Only the added work is held. Worn latch plate is selected as received evidence.</desc>
  <rect width="390" height="844" fill="#F4F7F6"/>
<g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">9:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
<g id="header">
<path d="m34 64-10 10 10 10" fill="none" stroke="#0B5747" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="76" font-size="20" font-weight="700" fill="#152C26">Propose job change</text>
<text x="64" y="96" font-size="13" font-weight="450" fill="#425B52">Terrace door repair · BB-1042</text>
</g>
<g id="content">
<text x="20" y="136" font-size="13" font-weight="650" fill="#425B52">CHANGE 1 · DRAFT</text>
<text x="370" y="136" font-size="13" font-weight="550" fill="#425B52" text-anchor="end">Reformas Ruiz · Mateo Ruiz</text>
<text x="20" y="180" font-size="32" font-weight="700" fill="#152C26">€280.00</text>
<text x="167" y="176" font-size="16" font-weight="650" fill="#152C26">Proposed total incl. tax</text>
<text x="20" y="207" font-size="13" font-weight="450" fill="#425B52">Approved €240.00 · Difference +€40.00</text>
<text x="20" y="238" font-size="16" font-weight="650" fill="#152C26">For Claire Martin · reply by 10:00</text>
<text x="20" y="258" font-size="13" font-weight="450" fill="#425B52">Tue, 24 Nov · Spain time · Visit stays 09:00–10:00</text>
<g id="approved-scope" transform="translate(0 61)">
    <rect x="20.5" y="204.5" width="349" height="199" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
    <text x="36" y="230" font-size="16" font-weight="650" fill="#152C26">Locked · Approved quote v1</text>
    <text x="36" y="252" font-size="12" font-weight="650" fill="#0B5747">Translation · English</text>
    <text x="36" y="273" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">
      <tspan x="36">Adjust the terrace door and replace</tspan>
      <tspan x="36" dy="22">the rollers. Excludes glass replacement.</tspan>
    </text>
    <path d="M36 305.5H354" stroke="#D4E1DB"/>
    <text x="36" y="325" font-size="12" font-weight="550" fill="#425B52">Original · Español</text>
    <text x="36" y="346" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">
      <tspan x="36">Ajustar la puerta de la terraza y sustituir</tspan>
      <tspan x="36" dy="22">los rodillos.</tspan>
      <tspan x="36" dy="22">No incluye la sustitución del vidrio.</tspan>
    </text>
  </g>
<g id="proposed-scope" transform="translate(0 63)">
    <rect x="20.5" y="412.5" width="349" height="143" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
