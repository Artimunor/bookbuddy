    <rect x="298.5" y="420.5" width="55" height="47" rx="12" fill="#FFFFFF" stroke="#70877D"/><text x="326" y="450" font-size="16" font-weight="650" fill="#0B5747" text-anchor="middle">Edit</text>
    <text x="36" y="460" font-size="12" font-weight="650" fill="#0B5747">Translation · English</text>
    <text x="36" y="482" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">Replace worn latch plate.</text>
    <path d="M36 492.5H354" stroke="#D4E1DB"/>
    <text x="36" y="512" font-size="12" font-weight="550" fill="#425B52">Original · Español</text>
    <text x="36" y="534" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">Sustituir la placa de cierre desgastada.</text>
  </g>
<rect x="20" y="627" width="350" height="44" rx="12" fill="#FFF1D5"/>
<text x="36" y="654" font-size="13" font-weight="650" fill="#704500">Hold only the added latch plate work.</text>
<text x="20" y="701" font-size="16" font-weight="650" fill="#0B5747">Evidence: Worn latch plate</text>
<text x="20" y="722" font-size="13" font-weight="450" fill="#425B52">Received · selected for this proposal</text>
<path d="m354 694 5 5-5 5" fill="none" stroke="#0B5747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
