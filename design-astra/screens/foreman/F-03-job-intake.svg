  <text x="36" y="333" fill="#152C26" font-size="15" font-weight="400" xml:lang="en">The terrace door sticks when I close it.</text>
  <path d="M36 348h318" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="36" y="371" fill="#425B52" font-size="13" font-weight="650">Original · Français</text>
  <text x="36" y="395" fill="#152C26" font-size="15" font-weight="400" xml:lang="fr">La porte de la terrasse coince quand je</text>
  <text x="36" y="416" fill="#152C26" font-size="15" font-weight="400" xml:lang="fr">la ferme.</text>
  </g>
