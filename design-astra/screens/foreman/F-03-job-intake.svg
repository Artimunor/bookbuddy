  <text x="20" y="202" fill="#152C26" font-size="15" font-weight="400">Claire Martin · Villa Mar, Xàbia</text>
  <text x="20" y="226" fill="#425B52" font-size="13" font-weight="550">Offered to Mateo Ruiz · Not yet accepted</text>
