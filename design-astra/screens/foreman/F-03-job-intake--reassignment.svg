<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="screen-title">F-03 Job intake — booked job reassignment</title>
  <desc id="screen-desc">In this alternate BB-1042 handoff, Inés Vidal remains accountable for the booked repair while Mateo Ruiz reviews the transfer offer. If Mateo accepts and it is confirmed, he takes over the existing job with quote version 1, the booked visit, and Nadia Benali’s confirmed shift intact.</desc>
  <rect width="390" height="844" fill="#F4F7F6"/>
  <rect width="390" height="108" fill="#FFFFFF"/>
  <g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">9:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
  <g id="header">
    <path d="m35 68-8 8 8 8" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
    <text x="64" y="74" fill="#152C26" font-size="20" font-weight="650">Job intake</text>
    <text x="64" y="94" fill="#425B52" font-size="13" font-weight="450">Terrace door repair · BB-1042</text>
    <path d="M0 107.5h390" stroke="#D4E1DB"/>
  </g>
  <g id="content">
    <g id="job-card">
      <rect x="20.5" y="124.5" width="349" height="99" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
      <text x="36" y="153" fill="#425B52" font-size="13" font-weight="550">Reformas Ruiz · Transfer offer</text>
      <rect x="270" y="137" width="84" height="28" rx="14" fill="#E7F4E8"/>
      <path d="m280 151 3 3 5-6" fill="none" stroke="#245936" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <text x="295" y="155" fill="#245936" font-size="12" font-weight="550">Booked</text>
      <text x="36" y="181" fill="#152C26" font-size="20" font-weight="650">Villa Mar · Xàbia</text>
      <text x="36" y="205" fill="#425B52" font-size="13" font-weight="450">Claire Martin · Customer</text>
    </g>
    <text x="20" y="260" fill="#152C26" font-size="20" font-weight="650">Foreman handoff</text>
    <g id="handoff">
      <rect x="20.5" y="276.5" width="349" height="143" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
      <text x="36" y="308" fill="#425B52" font-size="13" font-weight="550">Current foreman</text>
      <text x="354" y="308" fill="#152C26" font-size="16" font-weight="650" text-anchor="end">Inés Vidal</text>
      <path d="M36 324.5h318" stroke="#D4E1DB"/>
      <text x="36" y="352" fill="#425B52" font-size="13" font-weight="550">Offered to</text>
      <text x="354" y="352" fill="#152C26" font-size="16" font-weight="650" text-anchor="end">Mateo Ruiz (you)</text>
      <path d="M36 368.5h318" stroke="#D4E1DB"/>
      <text x="36" y="398" fill="#425B52" font-size="13" font-weight="450">Reply by Mon, 23 Nov · 17:00 Spain time</text>
    </g>
    <text x="20" y="460" fill="#152C26" font-size="20" font-weight="650">What stays the same</text>
    <g id="existing-job">
      <rect x="20.5" y="476.5" width="349" height="117" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
      <text x="36" y="504" fill="#152C26" font-size="16" font-weight="650">Quote v1 approved · €240.00</text>
      <text x="36" y="531" fill="#152C26" font-size="15">Tue, 24 Nov · 09:00–10:00</text>
      <text x="36" y="550" fill="#425B52" font-size="13" font-weight="450">Spain time · Booked work visit</text>
      <text x="36" y="577" fill="#152C26" font-size="15">Nadia Benali · Confirmed shift</text>
