      <path d="M44 626a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 7v5m0-8h.01" fill="none" stroke="#234C78" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <text x="64" y="639" fill="#234C78" font-size="16" font-weight="650">Inés is still accountable</text>
      <text x="64" y="661" fill="#234C78" font-size="13" font-weight="450">You take over only after accepting online.</text>
    </g>
    <text x="195" y="719" fill="#0B5747" font-size="16" font-weight="650" text-anchor="middle">Return handoff</text>
  </g>
  <g id="footer">
    <rect y="744" width="390" height="100" fill="#FFFFFF"/>
    <path d="M0 744.5h390" stroke="#D4E1DB"/>
    <rect x="20" y="752" width="350" height="48" rx="12" fill="#0B6250"/>
    <text x="195" y="782" fill="#FFFFFF" font-size="16" font-weight="650" text-anchor="middle">Review transfer</text>
