<rect x="0" y="736" width="390" height="108" rx="0" fill="#FFFFFF"/>
<path d="M0 736H390" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="746" width="350" height="56" rx="12" fill="#0B6250"/>
<text x="195" y="779.5" font-size="16" font-weight="650" fill="#FFFFFF" text-anchor="middle">Propose a revised visit</text>
</g>
<rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#152C26" aria-hidden="true"/>
</svg>
