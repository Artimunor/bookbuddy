<text x="36" y="266" font-size="15" font-weight="400" fill="#152C26" text-anchor="start">We can’t open this link in your account.</text>
<text x="36" y="291" font-size="15" font-weight="400" fill="#152C26" text-anchor="start">Ask the sender to check the link.</text>
