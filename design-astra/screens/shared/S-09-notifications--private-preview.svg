<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="screen-title">S-09 Notifications — private preview before unlock</title>
  <desc id="screen-desc">An ordinary BookBuddy alert on the Lock Screen says only that there is an update. It contains no sender, property, task, offer terms or response control. Tapping requires unlock and a check of the current authorised record.</desc>
