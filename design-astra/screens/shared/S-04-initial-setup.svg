<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="screen-title">S-04 Initial setup</title>
  <desc id="screen-desc">Nadia enters her display name. Reading language is Original only, independent of app or working language. Site time cannot be replaced; adding device time is optional and off.</desc>
  <rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7F6"/>
  <g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">9:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
  <g id="header">
    <path d="m34 64-10 10 10 10" fill="none" stroke="#0B6250" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="76" fill="#152C26" font-size="20" font-weight="700">Set up your account</text>
    <text x="64" y="96" fill="#425B52" font-size="13" font-weight="450">Verified email</text>
  </g>
  <g id="content">
    <text x="20" y="160" fill="#152C26" font-size="28" font-weight="700">What should we call you?</text>
    <text x="20" y="195" fill="#425B52" font-size="15" font-weight="400">Use the name you want people on your jobs</text>
    <text x="20" y="217" fill="#425B52" font-size="15" font-weight="400">to see.</text>
    <text x="20" y="274" fill="#152C26" font-size="16" font-weight="650">Display name</text>
    <rect x="20.5" y="288.5" width="349" height="51" rx="12" fill="#FFFFFF" stroke="#70877D"/>
    <text x="36" y="321" fill="#152C26" font-size="16" font-weight="400">Nadia Benali</text>
    <text x="20" y="396" fill="#152C26" font-size="20" font-weight="650">Messages and times</text>
    <rect x="20" y="415" width="350" height="206" rx="16" fill="#FFFFFF"/>
    <text x="36" y="449" fill="#152C26" font-size="16" font-weight="650">Reading language</text>
    <text x="36" y="476" fill="#0B5747" font-size="16" font-weight="650">Original only</text>
    <text x="36" y="501" fill="#425B52" font-size="13" font-weight="450">Keeps messages in the language they were sent.</text>
    <path d="m345 454 5 5-5 5" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 521H354" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="557" fill="#152C26" font-size="16" font-weight="650">Also show my time</text>
    <text x="36" y="584" fill="#425B52" font-size="13" font-weight="450">Site time always comes first.</text>
    <text x="36" y="603" fill="#425B52" font-size="13" font-weight="450">Add your time when the zones differ.</text>
    <rect x="298" y="534" width="54" height="32" rx="16" fill="#FFFFFF" stroke="#70877D"/>
    <circle cx="314" cy="550" r="11" fill="#70877D"/>
    <text x="20" y="663" fill="#425B52" font-size="13" font-weight="450">Change these preferences later in Account.</text>
  </g>
  <g id="actions">
    <rect x="0" y="744" width="390" height="100" rx="0" fill="#FFFFFF"/>
    <path d="M0 744.5h390" stroke="#D4E1DB"/>
    <rect x="20" y="752" width="350" height="48" rx="12" fill="#0B6250"/>
    <text x="195" y="782" fill="#FFFFFF" font-size="16" font-weight="650" text-anchor="middle">Continue</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#152C26" aria-hidden="true"/>
</svg>
