<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="screen-title">S-04 Initial setup</title>
  <desc id="screen-desc">Nadia confirms her display name, English reading preference and optional two-zone visit times. Site time remains visible.</desc>
  <rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7F6"/>
  <rect x="0" y="0" width="390" height="108" rx="0" fill="#FFFFFF"/>
  <g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">9:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
  <g id="header">
    <g transform="translate(20 64) scale(1)" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="64" y="83" fill="#152C26" font-size="20" font-weight="650">Set up your account</text>
    <path d="M0 107.5h390" stroke="#D4E1DB"/>
  </g>
  <g id="content">
    <text x="20" y="153" fill="#152C26" font-size="28" font-weight="700">Make it yours</text>
    <text x="20" y="184" fill="#425B52" font-size="15" font-weight="400"><tspan x="20" dy="0">Add your name and choose how you’ll see</tspan><tspan x="20" dy="22">messages and visit times.</tspan></text>
    <text x="20" y="264" fill="#152C26" font-size="16" font-weight="650">Display name</text>
    <rect x="20.5" y="276.5" width="349" height="47" rx="12" fill="#FFFFFF" stroke="#70877D"/>
    <text x="36" y="307" fill="#152C26" font-size="16" font-weight="400">Nadia Benali</text>
    <text x="20" y="350" fill="#425B52" font-size="13" font-weight="450">People you work with can see this name.</text>
    <text x="20" y="402" fill="#152C26" font-size="20" font-weight="650">Reading preferences</text>
    <rect x="20.5" y="418.5" width="349" height="71" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
    <rect x="36" y="438" width="32" height="32" rx="8" fill="#EBF2EF"/>
    <g transform="translate(42 444) scale(0.8333333333333334)" aria-hidden="true"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM2 12h20M12 2c3 2.7 4.5 6 4.5 10s-1.5 7.3-4.5 10c-3-2.7-4.5-6-4.5-10S9 4.7 12 2Z" fill="none" stroke="#0B5747" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="80" y="445" fill="#152C26" font-size="16" font-weight="650">Reading language</text>
    <text x="80" y="466" fill="#425B52" font-size="13" font-weight="450">English · for message translations</text>
    <g transform="translate(332 442) scale(1)" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="#425B52" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
    <rect x="20.5" y="506.5" width="349" height="107" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
    <rect x="36" y="522" width="32" height="32" rx="8" fill="#EBF2EF"/>
    <g transform="translate(42 528) scale(0.8333333333333334)" aria-hidden="true"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Zm-10-6v6l4 2" fill="none" stroke="#0B5747" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="80" y="542" fill="#152C26" font-size="16" font-weight="650">Also show my local time</text>
    <text x="80" y="570" fill="#425B52" font-size="13" font-weight="450"><tspan x="80" dy="0">Visit times always include Spain time.</tspan><tspan x="80" dy="18">Show my time too when it differs.</tspan></text>
    <rect x="300.5" y="524.5" width="53" height="31" rx="16" fill="#FFFFFF" stroke="#70877D"/>
    <circle cx="316" cy="540" r="11" fill="#70877D"/>
    <text x="20" y="644" fill="#425B52" font-size="13" font-weight="450">You can change these in your account.</text>
  </g>
  <g id="actions">
    <rect x="0" y="744" width="390" height="100" rx="0" fill="#FFFFFF"/>
    <path d="M0 744.5h390" stroke="#D4E1DB"/>
    <rect x="20" y="752" width="350" height="48" rx="12" fill="#0B6250"/>
    <text x="195" y="782" fill="#FFFFFF" font-size="16" font-weight="650" text-anchor="middle">Continue</text>
  </g>
  <rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#152C26" aria-hidden="true"/>
</svg>
