<text x="20" y="177" font-size="24" font-weight="700" fill="#152C26">Assessment visit</text>
<text x="20" y="205" font-size="15" font-weight="450" fill="#425B52">Terrace door repair · Villa Mar</text>
<text x="20" y="253" font-size="20" font-weight="650" fill="#152C26">Proposed by Reformas Ruiz</text>
<text x="20" y="277" font-size="13" font-weight="450" fill="#425B52">Checked against provider capacity · Not reserved</text>
