<text x="36" y="349" font-size="22" font-weight="650" fill="#152C26">€240.00</text>
<text x="20" y="395" font-size="13" font-weight="450" fill="#425B52">Invoice total: €240.00 including tax.</text>
<text x="20" y="446" font-size="16" font-weight="650" fill="#152C26">Date sent</text>
<rect x="20" y="460" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="36" y="490" font-size="15" font-weight="400" fill="#152C26">Wed, 25 Nov 2026</text>
<path d="m336 481 6 6 6-6" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="550" font-size="16" font-weight="650" fill="#152C26">Payment method</text>
