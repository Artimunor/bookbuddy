<text x="36" y="594" font-size="15" font-weight="400" fill="#152C26">Bank transfer</text>
<path d="m336 585 6 6 6-6" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="643" width="350" height="82" rx="16" fill="#E5F0FA"/>
<text x="36" y="669" font-size="16" font-weight="650" fill="#234C78">Reported by Claire Martin</text>
<text x="36" y="692" font-size="15" font-weight="400" fill="#234C78">Reformas Ruiz will match this report to its</text>
<text x="36" y="712" font-size="15" font-weight="400" fill="#234C78">bank receipt before the bill is marked paid.</text>
