<text x="20" y="181" font-size="28" font-weight="700" fill="#152C26">What did you send?</text>
<text x="20" y="211" font-size="15" font-weight="400" fill="#152C26">Report a payment you already made directly</text>
<text x="20" y="233" font-size="15" font-weight="400" fill="#152C26">to Reformas Ruiz. This does not move money.</text>
<path d="M20 262h350" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
