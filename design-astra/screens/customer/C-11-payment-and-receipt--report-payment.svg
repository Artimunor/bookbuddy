<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="screen-title">C-11 Record payment sent</title>
<desc id="screen-desc">Review a report of Claire’s external bank transfer for provider invoice RR-1042. The amount and date describe what she already sent to Reformas Ruiz. Submitting creates an unmatched report; no funds move.</desc>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7F6"/>
