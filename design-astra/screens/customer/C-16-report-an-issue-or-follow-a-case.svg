<g id="header">
<path d="m34 64-10 10 10 10" fill="none" stroke="#0B5747" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="76" font-size="20" font-weight="700" fill="#152C26">Report an issue</text>
<text x="64" y="96" font-size="13" font-weight="450" fill="#425B52">BB-1042 · Terrace door repair</text>
</g>
<g id="content">
<text x="20" y="151" font-size="28" font-weight="700" fill="#152C26">What went wrong?</text>
<text x="20" y="179" font-size="15" font-weight="400" fill="#152C26">BookBuddy will help you follow up.</text>
<text x="20" y="220" font-size="16" font-weight="650" fill="#152C26">Issue category</text>
<rect x="20" y="234" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="36" y="264" font-size="15" font-weight="400" fill="#152C26">Work quality</text>
<path d="m336 255 6 6 6-6" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="323" font-size="16" font-weight="650" fill="#152C26">Affected item</text>
<rect x="20" y="337" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="36" y="367" font-size="15" font-weight="400" fill="#152C26">Terrace door adjustment</text>
<path d="m336 358 6 6 6-6" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="422" font-size="16" font-weight="650" fill="#152C26">What happened?</text>
<rect x="20" y="434" width="350" height="64" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="36" y="465" font-size="15" font-weight="400" fill="#152C26">The door catches again when I close it.</text>
<text x="20" y="536" font-size="16" font-weight="650" fill="#152C26">Evidence (optional)</text>
<rect x="20" y="549" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="195" y="579" font-size="16" font-weight="650" fill="#0B5747" text-anchor="middle">Add photos or a voice note</text>
<text x="20" y="620" font-size="13" font-weight="450" fill="#425B52">Up to 5 photos and 1 voice note. No entry codes.</text>
<rect x="20" y="637" width="350" height="92" rx="16" fill="#E5F0FA"/>
<text x="36" y="661" font-size="16" font-weight="650" fill="#234C78">Who sees this report?</text>
<text x="36" y="685" font-size="15" font-weight="400" fill="#234C78">You and your BookBuddy case handler. Only</text>
<text x="36" y="706" font-size="15" font-weight="400" fill="#234C78">the details needed go to the provider lead.</text>
</g>
