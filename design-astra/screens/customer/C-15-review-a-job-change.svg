<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="screen-title">C-15 Review a job change</title>
<desc id="screen-desc">Mateo issued Change 1 for Reformas Ruiz. Claire compares the immutable approved v1 with the separate proposal, its received photo, price and deadline. Only the new latch plate work is held; the original approval and visit are unchanged.</desc>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#FAF7EF"/>
<g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">08:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
<g id="header">
<path d="m34 64-10 10 10 10" fill="none" stroke="#0B5747" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="76" font-size="20" font-weight="700" fill="#152C26">Review a job change</text>
<text x="64" y="96" font-size="13" font-weight="450" fill="#425B52">BB-1042 · Reformas Ruiz</text>
</g>
<g id="content">
<text x="20" y="134" font-size="13" font-weight="650" fill="#425B52">CHANGE 1 · ISSUED BY MATEO RUIZ</text>
<text x="20" y="171" font-size="32" font-weight="700" fill="#152C26">€280.00</text>
<text x="370" y="158" font-size="18" font-weight="650" fill="#0B5747" text-anchor="end">+€40.00</text>
<text x="370" y="179" font-size="13" font-weight="450" fill="#425B52" text-anchor="end">Approved v1: €240.00</text>
<text x="20" y="192" font-size="13" font-weight="450" fill="#425B52">Proposed total incl. tax</text>
<text x="20" y="220" font-size="15" font-weight="650" fill="#152C26">Reply by Tue, 24 Nov · 10:00 Spain time</text>
<text x="20" y="241" font-size="13" font-weight="450" fill="#425B52">Visit unchanged · 09:00–10:00 Spain · 08:00–09:00 UK</text>
<g id="scope-comparison">
<rect x="20" y="254" width="350" height="293" rx="16" fill="#FFFFFF"/>
<text x="36" y="281" font-size="16" font-weight="650" fill="#152C26">Approved · Quote v1</text>
<text x="36" y="303" font-size="13" font-weight="550" fill="#0B5747">Translation · English</text>
<text x="36" y="324" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">Adjust the terrace door and replace the</text>
<text x="36" y="345" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">rollers. Excludes glass replacement.</text>
<text x="36" y="365" font-size="13" font-weight="450" fill="#425B52">Original · Español</text>
<text x="36" y="386" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">Ajustar la puerta de la terraza y sustituir</text>
<text x="36" y="407" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">los rodillos. No incluye la sustitución del vidrio.</text>
<path d="M36 420h318" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="445" font-size="16" font-weight="650" fill="#152C26">Proposed addition · Change 1</text>
<text x="36" y="465" font-size="13" font-weight="550" fill="#0B5747">Translation · English</text>
<text x="36" y="486" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">Replace worn latch plate.</text>
<text x="36" y="507" font-size="13" font-weight="450" fill="#425B52">Original · Español</text>
<text x="36" y="529" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">Sustituir la placa de cierre desgastada.</text>
</g>
<g id="received-attachments">
<rect x="20" y="556" width="350" height="52" rx="12" fill="#FFFFFF" stroke="#70877D"/>
<text x="36" y="579" font-size="16" font-weight="650" fill="#152C26">Worn latch plate</text>
<text x="36" y="598" font-size="13" font-weight="450" fill="#425B52">Received photo · Change 1</text>
<path d="m341 577 5 5-5 5" fill="none" stroke="#425B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="affected-work">
<rect x="20" y="617" width="350" height="75" rx="16" fill="#FFF1D5"/>
<path d="M36 647l9-16 9 16z m9-10v4m0 3h.01" fill="none" stroke="#704500" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="641" font-size="15" font-weight="550" fill="#704500">Latch plate replacement is on hold</text>
<text x="36" y="663" font-size="15" font-weight="400" fill="#704500">until you approve. The door adjustment</text>
<text x="36" y="683" font-size="15" font-weight="400" fill="#704500">and rollers remain approved.</text>
</g>
<text x="20" y="726" font-size="16" font-weight="650" fill="#853531">Decline change</text>
<text x="370" y="726" font-size="16" font-weight="650" fill="#0B5747" text-anchor="end">Ask Mateo</text>
</g>
<g id="action-bar">
<rect x="0" y="744" width="390" height="100" rx="0" fill="#FFFFFF"/>
<path d="M0 744h390" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="752" width="350" height="48" rx="12" fill="#0B6250"/>
<text x="195" y="782" font-size="16" font-weight="650" fill="#FFFFFF" text-anchor="middle">Review approval</text>
</g>
<rect id="home-indicator" x="128" y="831" width="134" height="5" rx="2.5" fill="#152C26" aria-hidden="true"/>
</svg>
