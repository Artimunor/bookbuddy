<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="screen-title">C-04 Review and send request</title>
<desc id="screen-desc">Claire reviews her translated and original description, attachments, service address and access before sending a request; no visit is booked.</desc>
<rect x="0" y="0" width="390" height="844" fill="#F4F7F6"/>
<rect x="0" y="0" width="390" height="108" fill="#FFFFFF"/>
<g id="status-bar" aria-hidden="true" fill="#152C26">
    <text x="20" y="29" font-size="15" font-weight="700">9:41</text>
    <rect x="301" y="24" width="3" height="4" rx="1"/>
    <rect x="306" y="22" width="3" height="6" rx="1"/>
    <rect x="311" y="19" width="3" height="9" rx="1"/>
    <rect x="316" y="16" width="3" height="12" rx="1"/>
    <path d="M324 20a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0m-7 3a3 3 0 0 1 4 0" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="332" cy="29" r="1.1"/>
    <rect x="347.5" y="16.5" width="21" height="12" rx="3" fill="none" stroke="#152C26"/>
    <rect x="349.5" y="18.5" width="17" height="8" rx="1.5"/>
    <path d="M370 20v5c2-1 2-4 0-5z"/>
  </g>
<g id="header">
<g aria-hidden="true" transform="translate(20 64)"><path d="m15 4-8 8 8 8" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="64" y="74" fill="#152C26" font-size="20" font-weight="650">Review and send request</text>
<text x="64" y="94" fill="#425B52" font-size="13" font-weight="450">New request · Step 3 of 3</text>
<path d="M0 107.5H390" stroke="#D4E1DB"/>
</g>
<g id="progress">
<rect x="20" y="120" width="112" height="4" rx="2" fill="#0B6250"/>
<rect x="140" y="120" width="112" height="4" rx="2" fill="#0B6250"/>
<rect x="260" y="120" width="110" height="4" rx="2" fill="#0B6250"/>
</g>
<g id="content">
<text x="20" y="163" font-size="24" font-weight="700" fill="#152C26">Ready to send?</text>
<text x="20" y="189" font-size="15" font-weight="400" fill="#425B52">This asks for a repair. It does not book a visit.</text>
<rect x="20" y="207" width="350" height="379" rx="16" fill="#FFFFFF"/>
<text x="36" y="238" font-size="20" font-weight="650" fill="#152C26">The repair</text>
<text x="352" y="238" font-size="16" font-weight="650" fill="#0B5747" text-anchor="end">Edit</text>
<text x="36" y="266" font-size="13" font-weight="650" fill="#0B5747">Translation · English</text>
<text x="36" y="291" font-size="15" font-weight="400" fill="#152C26">The terrace door sticks when I close it.</text>
<text x="36" y="319" font-size="13" font-weight="450" fill="#425B52">Original · Français</text>
<text x="36" y="341" font-size="15" font-weight="400" fill="#152C26" xml:lang="fr">La porte de la terrasse coince quand</text>
<text x="36" y="362" font-size="15" font-weight="400" fill="#152C26" xml:lang="fr">je la ferme.</text>
<path d="M36 381h318" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="m37 403 3 3 6-7" fill="none" stroke="#0B5747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="55" y="407" font-size="13" font-weight="500" fill="#0B5747">Received: 1 photo and 1 French voice note</text>
<path d="M36 427h318" fill="none" stroke="#D4E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="459" font-size="20" font-weight="650" fill="#152C26">Property and access</text>
<text x="352" y="459" font-size="16" font-weight="650" fill="#0B5747" text-anchor="end">Edit</text>
<text x="36" y="489" font-size="16" font-weight="650" fill="#152C26">Villa Mar · Xàbia</text>
<text x="36" y="510" font-size="13" font-weight="450" fill="#425B52">12 Carrer de la Porta Verda, 03730 Xàbia</text>
<text x="36" y="540" font-size="15" font-weight="400" fill="#152C26">Please meet me at the gate.</text>
<text x="36" y="564" font-size="13" font-weight="450" fill="#425B52">On site: Claire Martin</text>
<rect x="20" y="610" width="350" height="102" rx="16" fill="#E5F0FA"/>
<text x="36" y="638" font-size="16" font-weight="650" fill="#234C78">Who receives this?</text>
<text x="36" y="664" font-size="15" font-weight="400" fill="#234C78">Only the authorised intake team and provider</text>
<text x="36" y="686" font-size="15" font-weight="400" fill="#234C78">handling your request receive these details.</text>
</g>
