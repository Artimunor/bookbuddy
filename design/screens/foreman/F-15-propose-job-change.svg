  <title id="screen-title">F-15 Propose job change</title>
  <desc id="screen-desc">A draft for BB-1042 preserves the complete approved quote version 1 scope and its glass exclusion. It proposes replacing the worn latch plate for an additional €40.00, a proposed total of €280.00, without changing the 09:00–10:00 visit. English translations appear above the exact Spanish originals. The Worn latch plate photo is selected for publication with the draft, which has not been sent.</desc>
