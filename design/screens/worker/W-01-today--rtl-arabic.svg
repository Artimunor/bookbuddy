<title id="W-01-today--rtl-arabic-title">اليوم — المناوبة القادمة وإحاطة السلامة</title>
<desc id="W-01-today--rtl-arabic-desc">عرض العاملة نادية بنعلي في Reformas Ruiz باللغة العربية من اليمين إلى اليسار. المناوبة مؤكدة يوم الثلاثاء، ٢٤ نوفمبر، من ٠٩:٠٠ إلى ١٠:٠٠ بتوقيت إسبانيا لإصلاح باب الشرفة. إحاطة السلامة مطلوبة قبل بدء العمل. تبقى الأسماء ومعرّف المهمة بالترتيب الأصلي.</desc>
