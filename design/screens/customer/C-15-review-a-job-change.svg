<text x="64" y="94" font-size="13" font-weight="450" fill="#425B52">BB-1042 · Terrace door repair</text>
<path d="M0 107.5h390" stroke="#D4E1DB"/>
</g>
<g id="content">
<rect x="20" y="124" width="144" height="28" rx="14" fill="#FFF1D5"/><g aria-hidden="true" transform="translate(28 130) scale(0.6666666666666666)"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 4v5l3 2" fill="none" stroke="#704500" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g><text x="48" y="142" font-size="12" font-weight="550" fill="#704500">Approval needed</text>
