  <g aria-hidden="true" transform="translate(36 644) scale(.75)"><path d="M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2-3v6m10-6v6M3 11h18" fill="none" stroke="#152C26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="64" y="657" font-size="16" font-weight="650" fill="#152C26">Arrival window unchanged</text>
  <text x="64" y="675" font-size="13" font-weight="450" fill="#425B52">Tue, 24 Nov · 09:00–10:00 Spain time</text>
  <text x="64" y="690" font-size="13" font-weight="450" fill="#425B52">08:00–09:00 your time</text>
</g>
<text x="20" y="720" font-size="16" font-weight="650" fill="#853531">Decline change</text>
<text x="370" y="720" font-size="16" font-weight="650" fill="#0B5747" text-anchor="end">Ask Mateo</text>
</g>
