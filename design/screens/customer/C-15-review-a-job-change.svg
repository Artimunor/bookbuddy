<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title screen-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="screen-title">C-15 Review a job change</title>
<desc id="screen-desc">Claire compares approved quote v1 with Change 1 from Reformas Ruiz. Replacing the worn latch plate is on hold pending approval; the door adjustment, rollers and arrival window are unchanged. The proposal adds EUR 40.00 for a new total of EUR 280.00 and includes one received photo of the latch plate. English translations appear above the original Spanish.</desc>
