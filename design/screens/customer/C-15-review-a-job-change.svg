<text x="20" y="162" font-size="13" font-weight="450" fill="#425B52">Change 1 · Proposed by Mateo Ruiz</text>
<g id="scope-comparison">
  <rect x="20.5" y="172.5" width="349" height="263" rx="16" fill="#FFFFFF" stroke="#D4E1DB"/>
  <text x="36" y="197" font-size="16" font-weight="650" fill="#152C26">Approved · Quote v1</text>
  <text x="36" y="215" font-size="13" font-weight="450" fill="#0B5747">Translation · English</text>
  <text x="36" y="233" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">Adjust the terrace door and replace the</text>
  <text x="36" y="253" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">rollers. Excludes glass replacement.</text>
  <text x="36" y="271" font-size="13" font-weight="450" fill="#425B52">Original · Español</text>
  <text x="36" y="289" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">Ajustar la puerta de la terraza y sustituir</text>
  <text x="36" y="309" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">los rodillos.</text>
  <text x="36" y="329" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">No incluye la sustitución del vidrio.</text>
  <path d="M36 339.5h318" stroke="#D4E1DB"/>
  <text x="36" y="360" font-size="16" font-weight="650" fill="#152C26">Proposed addition</text>
  <text x="36" y="377" font-size="13" font-weight="450" fill="#0B5747">Translation · English</text>
  <text x="36" y="395" font-size="15" font-weight="400" fill="#152C26" xml:lang="en">Replace worn latch plate.</text>
  <text x="36" y="410" font-size="13" font-weight="450" fill="#425B52">Original · Español</text>
  <text x="36" y="428" font-size="15" font-weight="400" fill="#152C26" xml:lang="es">Sustituir la placa de cierre desgastada.</text>
</g>
