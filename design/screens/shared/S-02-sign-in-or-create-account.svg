    <text x="64" y="463" fill="#425B52" font-size="13" font-weight="450"><tspan x="64" dy="0">No password or separate crew account needed.</tspan></text>
    <text x="195" y="534" fill="#0B5747" font-size="16" font-weight="650" text-anchor="middle">Get help signing in</text>
