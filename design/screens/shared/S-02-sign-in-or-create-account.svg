    <text x="20" y="269" fill="#425B52" font-size="15" font-weight="400"><tspan x="20" dy="0">We’ll email you a one-time code. Use the</tspan><tspan x="20" dy="22">address that received your invite, if you have one.</tspan></text>
    <text x="20" y="324" fill="#152C26" font-size="16" font-weight="650">Email address</text>
