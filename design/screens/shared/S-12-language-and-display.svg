<text x="331" y="179" font-size="15" font-weight="650" fill="#0B5747" text-anchor="end">English</text>
<g aria-hidden="true" transform="translate(339 168) scale(0.75)"><path d="m9 6 6 6-6 6" fill="none" stroke="#0B5747" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
