<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="preferences-title preferences-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="preferences-title">S-12 Language and display</title>
<desc id="preferences-desc">Account language and display preferences. App language and chat translation are separate. A Claire Martin message previews English translation above original French. Appearance, large controls and site and local time display can be changed.</desc>
